<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f97316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VolleyScout TR">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>VolleyScout TR</title>
<style>
:root{--o:#f97316;--o2:#ea580c;--bg:#fff7ed;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#fed7aa;--ok:#16a34a;--bad:#dc2626;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:10;background:var(--o);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 12px #9a341244}.top .hamb{background:#fff2;border:1px solid #fff6;color:#fff;border-radius:12px;padding:9px 12px;font-size:20px}.top h1{margin:0;font-size:18px}.top small{opacity:.9}.spacer{flex:1}.bell{background:#fff2;border:1px solid #fff6;color:#fff;border-radius:12px;padding:9px 11px;position:relative}.count{position:absolute;right:-5px;top:-6px;background:#dc2626;color:#fff;border-radius:999px;font-size:10px;padding:2px 5px}.drawer{position:fixed;inset:0;background:#0006;z-index:30;display:none}.drawer.open{display:block}.drawer-panel{width:min(330px,88vw);height:100%;background:#fff;padding:18px;overflow:auto}.drawer-panel h2{margin:4px 0 16px;color:var(--o2)}.drawer button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:12px;border-radius:12px;margin:7px 0}.drawer button.active{background:#ffedd5;color:#9a3412;border-color:#fdba74;font-weight:700}main{padding:18px}.view{display:none}.view.active{display:block}.hero{background:var(--o);color:#fff;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 8px 22px #ea580c33}.hero h2{margin:0 0 5px;font-size:28px}.hero .muted{color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.tile,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 5px 18px #7c2d120c}.tile{text-align:left;min-height:95px}.tile b{display:block;margin-top:8px}.tile span,.muted{color:var(--muted);font-size:13px}.section-title{display:flex;align-items:center;gap:10px;margin:20px 0 11px}.section-title h2{margin:0;font-size:20px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #fdba74;border-radius:11px;background:#fff}.field textarea{min-height:90px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:9px 12px}.primary{background:var(--o);border-color:var(--o);color:#fff}.danger{color:var(--bad);border-color:#fecaca}.ok{color:var(--ok);border-color:#bbf7d0}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#ffedd5;color:#9a3412;font-size:12px}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.avatar{width:50px;height:50px;border-radius:50%;object-fit:cover;background:#ffedd5;display:grid;place-items:center;color:#9a3412;font-weight:800}.avatar.big{width:92px;height:92px;font-size:28px}.actions{display:flex;gap:6px;flex-wrap:wrap}.stat{font-size:27px;font-weight:800}.score{font-size:52px;font-weight:900;line-height:1}.scorebox{border-radius:20px;padding:20px;text-align:center;background:#fff;border:2px solid var(--line)}.scorebox.us{border-color:var(--o);background:#fff7ed}.scorebox.them{border-color:#cbd5e1}.quick{min-height:100px;font-size:23px;font-weight:800;width:100%;border-radius:18px}.quick.us{background:var(--o);color:#fff}.quick.them{background:#fff;border:2px solid #cbd5e1}.reasonbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:7px}.reason{padding:12px 7px;border:1px solid var(--line);border-radius:12px;background:#fff}.court{height:430px;border-radius:18px;background:#f97316;border:6px solid #fff;box-shadow:inset 0 0 0 2px #9a3412;position:relative;overflow:hidden;touch-action:none}.court:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid #fff}.court:after{content:"";position:absolute;left:14%;right:14%;top:22%;height:56%;border:3px solid #fff}.dot{position:absolute;width:48px;height:48px;border-radius:50%;background:#fff;color:#9a3412;display:grid;place-items:center;font-weight:800;box-shadow:0 4px 10px #7c2d1255;touch-action:none;user-select:none}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.show{display:flex}.sheet{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px}.close{float:right}.toast{position:fixed;right:14px;bottom:18px;background:#111827;color:#fff;padding:11px 14px;border-radius:12px;display:none;z-index:70}.toast.show{display:block}.setup{min-height:100vh;display:grid;place-items:center;padding:20px}.setup .card{width:min(520px,100%)}.hidden{display:none!important}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:9px;border-bottom:1px solid #ffedd5;text-align:left;font-size:13px}th{background:#fff7ed}.checkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px}.check{border:1px solid var(--line);padding:10px;border-radius:11px;background:#fff}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.tabs button{white-space:nowrap}.notice{border-left:4px solid var(--o);padding:10px;background:#fff7ed;border-radius:8px}.dangerbox{background:#fef2f2;border:1px solid #fecaca;padding:10px;border-radius:12px}@media(min-width:850px){.modal{align-items:center}.sheet{border-radius:22px}.top{border-radius:0 0 18px 18px}}
</style></head><body>
<div id="setup" class="setup"><div class="card"><div style="font-size:42px">🏐</div><h1>VolleyScout TR</h1><p class="muted">Tek dosyalık, iPad odaklı voleybol yönetim sistemi.</p><div class="field"><label>Ad Soyad</label><input id="setupCoach" placeholder="Antrenör adı"></div><br><div class="field"><label>Kulüp</label><input id="setupClub" placeholder="Kulüp adı"></div><br><div class="field"><label>Sezon</label><input id="setupSeason" value="2026-2027"></div><br><button class="btn primary" style="width:100%;padding:13px" onclick="finishSetup()">🚀 VolleyScout'u Başlat</button></div></div>
<div id="app" class="app hidden"><header class="top"><button class="hamb" onclick="toggleDrawer()">☰</button><div><h1 id="brand">VolleyScout TR</h1><small id="subbrand"></small></div><div class="spacer"></div><button class="bell" onclick="showView('notifications')">🔔<span id="notifCount" class="count">0</span></button></header>
<div id="drawer" class="drawer" onclick="if(event.target===this)toggleDrawer()"><div class="drawer-panel"><h2>🏐 VolleyScout TR</h2><div id="navButtons"></div></div></div>
<main><section id="home" class="view"></section><section id="athletes" class="view"></section><section id="teams" class="view"></section><section id="school" class="view"></section><section id="attendance" class="view"></section><section id="training" class="view"></section><section id="matches" class="view"></section><section id="tests" class="view"></section><section id="tactics" class="view"></section><section id="messages" class="view"></section><section id="reports" class="view"></section><section id="club" class="view"></section><section id="notifications" class="view"></section></main></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="btn close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='volleyscout_final_v1';
const CATS=['Mini','Midi','Küçük','Yıldız'],GROUPS=['A','B','C','1','2','3'];
const DEFAULT_LEAGUES=['Özel Lig','Süper Lig','1. Lig','2. Lig','Gelişim Ligi'];
const DAYS=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const TIMES=Array.from({length:15},(_,i)=>{let h=7+i;return String(h).padStart(2,'0')+':30 - '+String(h+1).padStart(2,'0')+':30'});
const SKILLS=['Pas','Manşet','Servis','Hücum','Blok','Defans','Taktik','Kondisyon','Koordinasyon','Sıçrama','Reaksiyon'];
const LEVELS=['Başlangıç','Gelişim','İleri'];
const TESTS=[['Boy','cm','Antropometrik'],['Kilo','kg','Antropometrik'],['Kulaç','cm','Antropometrik'],['Dikey Sıçrama','cm','Sıçrama'],['Hücum Sıçraması','cm','Sıçrama'],['Durarak Uzun Atlama','cm','Kuvvet'],['10 m Sprint','sn','Hız'],['20 m Sprint','sn','Hız'],['T-Testi','sn','Çeviklik'],['Y-Testi','sn','Çeviklik'],['Esneklik','cm','Esneklik'],['Plank','sn','Kuvvet'],['Servis İsabeti','/10','Teknik'],['Pas-Manşet İsabeti','/20','Teknik'],['Yo-Yo / Mekik','seviye','Dayanıklılık']];
let d={club:null,coach:null,season:'2026-2027',players:[],teams:[],schoolGroups:[],attendance:[],trainings:[],matches:[],tests:[],tactics:[],messages:[],notifications:[],leagues:DEFAULT_LEAGUES.map((name,i)=>({id:'lg'+i,name})),coaches:[],archives:[]};
let state={view:'home',q:'',testPlayer:'',testCategory:'',selectedMatch:null};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function uid(p='x'){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function save(){localStorage.setItem(KEY,JSON.stringify(d))}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function normalize(){d={...{club:null,coach:null,season:'2026-2027',players:[],teams:[],schoolGroups:[],attendance:[],trainings:[],matches:[],tests:[],tactics:[],messages:[],notifications:[],leagues:[],coaches:[],archives:[]},...d};['players','teams','schoolGroups','attendance','trainings','matches','tests','tactics','messages','notifications','archives','coaches'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});if(!Array.isArray(d.leagues)||!d.leagues.length)d.leagues=DEFAULT_LEAGUES.map((name,i)=>({id:'lg'+i,name}));d.leagues=d.leagues.map((x,i)=>typeof x==='string'?{id:'lg'+i,name:x}:{id:x.id||uid('lg'),name:String(x.name||x.label||'')}).filter(x=>x.name);d.players.forEach(p=>{p.teamIds=Array.isArray(p.teamIds)?p.teamIds:(p.teamId?[p.teamId]:[])});d.teams.forEach(t=>{t.coachIds=Array.isArray(t.coachIds)?t.coachIds:(t.coachId?[t.coachId]:[]);t.days=Array.isArray(t.days)?t.days:[]});}
function finishSetup(){let c=$('setupClub').value.trim(),n=$('setupCoach').value.trim();if(!c||!n)return toast('Kulüp ve antrenör adını gir.');d.club=c;d.coach=n;d.season=$('setupSeason').value||'2026-2027';if(!d.coaches.some(x=>x.name===n))d.coaches.push({id:uid('c'),name:n,role:'Baş Antrenör'});save();boot()}
function boot(){normalize();if(!d.club){$('setup').classList.remove('hidden');$('app').classList.add('hidden');return}$('setup').classList.add('hidden');$('app').classList.remove('hidden');$('brand').textContent=d.club;$('subbrand').textContent=d.coach+' • '+d.season;renderNav();renderAll();showView(state.view||'home');startClock()}
function greeting(){let h=new Date().getHours();if(h>=5&&h<11)return'Günaydın';if(h>=11&&h<18)return'İyi çalışmalar';if(h>=18&&h<23)return'İyi akşamlar';return'İyi geceler'}
function startClock(){clearInterval(window.greetTimer);window.greetTimer=setInterval(()=>{if($('home')&&$('home').classList.contains('active'))home()},60000)}
const NAV=[['home','🏠','Ana'],['athletes','👥','Sporcular'],['teams','🏐','Takımlar'],['school','🏫','Spor Okulu'],['attendance','📝','Yoklama'],['training','🏋️','Antrenman'],['matches','🏆','Maçlar'],['tests','🧪','Testler'],['tactics','🧠','Taktik'],['messages','💬','İletişim'],['reports','📊','Raporlar'],['club','⚙️','Ayarlar']];
function renderNav(){$('navButtons').innerHTML=NAV.map(x=>`<button data-v="${x[0]}" onclick="showView('${x[0]}');toggleDrawer()">${x[1]} ${x[2]}</button>`).join('')}
function toggleDrawer(){ $('drawer').classList.toggle('open') }
function showView(v){state.view=v;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');document.querySelectorAll('.drawer-panel button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));render(v)}
function renderAll(){['home','athletes','teams','school','attendance','training','matches','tests','tactics','messages','reports','club','notifications'].forEach(render);updateBadge()}
function render(v){({home,athletes,teams,school,attendance,training,matches,tests,tactics,messages,reports,club,notifications}[v]||(()=>{}))()}
function updateBadge(){$('notifCount').textContent=d.notifications.filter(n=>!n.read).length}
function modal(title,body){$('modalBody').innerHTML=`<h2>${title}</h2>${body}`;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function playerTeams(p){let ids=p.teamIds||[];return d.teams.filter(t=>ids.includes(t.id))} function teamPlayers(id){return d.players.filter(p=>(p.teamIds||[]).includes(id))}
function home(){let pending=d.notifications.filter(n=>!n.read).length;let up=d.matches.filter(m=>!m.finished).slice(0,3);$('home').innerHTML=`<div class="hero"><h2>${greeting()}, ${esc(d.coach)} 👋</h2><div>${esc(d.club)} • ${esc(d.season)}</div><div class="grid" style="margin-top:15px"><div><div class="stat">${d.players.length}</div><div>🏃 Sporcu</div></div><div><div class="stat">${d.teams.length}</div><div>🏐 Takım</div></div><div><div class="stat">${d.trainings.length}</div><div>🏋️ Antrenman</div></div><div><div class="stat">${pending}</div><div>🔔 Bildirim</div></div></div></div><div class="tiles">${NAV.slice(1).map(x=>`<button class="tile" onclick="showView('${x[0]}')">${x[1]}<b>${x[2]}</b><span>Yönet ve takip et</span></button>`).join('')}</div><div class="section-title"><h2>Yaklaşan</h2></div><div class="list">${up.map(m=>`<div class="item"><b>🏐 ${esc(m.teamName||'Takım')} — ${esc(m.opponent)}</b><div class="muted">${m.date} ${m.time||''} • ${esc(m.venue||'')}</div></div>`).join('')||'<div class="card muted">Yaklaşan maç yok.</div>'}</div>`}
function athleteForm(p={}){let ids=p.teamIds||[];return `<div class="formgrid"><div class="field"><label>Ad Soyad</label><input id="a_name" value="${esc(p.name)}"></div><div class="field"><label>Forma No</label><input id="a_no" value="${esc(p.no)}"></div><div class="field"><label>Mevki</label><select id="a_pos">${['Pasör','Smaçör','Orta','Libero','Pasör Çaprazı','Diğer'].map(x=>`<option ${x===p.position?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Doğum</label><input type="date" id="a_birth" value="${esc(p.birth)}"></div><div class="field"><label>Boy</label><input id="a_height" value="${esc(p.height)}"></div><div class="field"><label>Kilo</label><input id="a_weight" value="${esc(p.weight)}"></div><div class="field" style="grid-column:1/-1"><label>Fotoğraf</label><input type="file" id="a_photo" accept="image/*"></div><div class="field" style="grid-column:1/-1"><label>Takımlar — birden fazla</label><div class="checkgrid">${d.teams.map(t=>`<label class="check"><input class="teamcheck" type="checkbox" value="${t.id}" ${ids.includes(t.id)?'checked':''}> ${esc(t.name)}</label>`).join('')||'<span class="muted">Takım yok.</span>'}</div></div><div class="field"><label>Spor Okulu Grubu</label><select id="a_school"><option value="">Yok</option>${d.schoolGroups.map(g=>`<option value="${g.id}" ${g.id===p.schoolGroupId?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div><div class="field" style="grid-column:1/-1"><label>Not</label><textarea id="a_note">${esc(p.note)}</textarea></div></div><br><div class="actions"><button class="btn primary" onclick="saveAthlete('${p.id||''}')">💾 Kaydet</button>${p.id?`<button class="btn danger" onclick="deleteAthlete('${p.id}')">🗑️ Sil</button>`:''}</div>`}
function saveAthlete(id){let p=id?d.players.find(x=>x.id===id):{id:uid('p')};p.name=$('a_name').value.trim()||'Sporcu';p.no=$('a_no').value;p.position=$('a_pos').value;p.birth=$('a_birth').value;p.height=$('a_height').value;p.weight=$('a_weight').value;p.teamIds=[...document.querySelectorAll('.teamcheck:checked')].map(x=>x.value);p.schoolGroupId=$('a_school').value;p.note=$('a_note').value;let f=$('a_photo').files[0];if(f){let r=new FileReader();r.onload=()=>{p.photo=r.result;commitAthlete(p,id)};r.readAsDataURL(f)}else commitAthlete(p,id)}
function commitAthlete(p,id){if(!id)d.players.push(p);save();closeModal();renderAll();toast('Sporcu kaydedildi.')}
function deleteAthlete(id){if(!confirm('Sporcu silinsin mi?'))return;d.players=d.players.filter(p=>p.id!==id);save();renderAll();toast('Sporcu silindi.')}
function athletes(){let q=state.q.toLowerCase();let list=d.players.filter(p=>(p.name||'').toLowerCase().includes(q));$('athletes').innerHTML=`<div class="section-title"><h2>👥 Sporcular</h2><div class="spacer"></div><button class="btn primary" onclick="modal('Yeni Sporcu',athleteForm())">➕ Ekle</button></div><div class="field"><input placeholder="🔍 Sporcu ara" value="${esc(state.q)}" oninput="state.q=this.value;athletes()"></div><br><div class="list">${list.map(p=>`<div class="item row"><div class="avatar">${p.photo?`<img class="avatar" src="${p.photo}">`:esc((p.name||'?')[0])}</div><div style="flex:1"><b>${esc(p.name)}</b><div class="muted">#${esc(p.no||'-')} • ${esc(p.position||'-')}</div><div>${playerTeams(p).map(t=>`<span class="badge">${esc(t.name)}</span> `).join('')||'<span class="muted">Takımsız</span>'}</div></div><div class="actions"><button class="btn" onclick="profile('${p.id}')">👤 Profil</button><button class="btn" onclick="modal('Sporcu Düzenle',athleteForm(d.players.find(x=>x.id==='${p.id}')))" >✏️</button><button class="btn danger" onclick="deleteAthlete('${p.id}')">🗑️</button></div></div>`).join('')||'<div class="card muted">Sporcu yok.</div>'}</div>`}
function profile(id){let p=d.players.find(x=>x.id===id);if(!p)return;let ts=d.tests.filter(t=>t.playerId===id).slice(-8).reverse();modal('👤 '+esc(p.name),`<div class="row"><div class="avatar big">${p.photo?`<img class="avatar big" src="${p.photo}">`:esc((p.name||'?')[0])}</div><div><h3>${esc(p.name)}</h3><div class="muted">#${esc(p.no||'-')} • ${esc(p.position||'-')}</div><div>${playerTeams(p).map(t=>`<span class="badge">${esc(t.name)}</span> `).join('')}</div></div></div><div class="grid" style="margin-top:14px"><div class="card"><b>Doğum</b><div>${p.birth||'-'}</div></div><div class="card"><b>Boy</b><div>${p.height||'-'} cm</div></div><div class="card"><b>Kilo</b><div>${p.weight||'-'} kg</div></div></div><h3>🧪 Son Testler</h3><div class="list">${ts.map(t=>`<div class="item"><b>${esc(t.name)}</b> ${esc(t.value)} ${esc(t.unit)}<div class="muted">${t.date} • ${esc(t.period)}</div></div>`).join('')||'<div class="muted">Test yok.</div>'}</div><div class="actions"><button class="btn primary" onclick="closeModal();state.testPlayer='${id}';showView('tests')">🧪 Test Ekle</button><button class="btn" onclick="openReport('${id}')">📄 Rapor</button></div>`)}
function teamForm(t={}){let league=typeof t.league==='object'?(t.league.name||''):t.league||d.leagues[0]?.name||'';return `<div class="formgrid"><div class="field"><label>Kategori</label><select id="t_cat">${CATS.map(x=>`<option ${x===(t.category||'Yıldız')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Grup</label><select id="t_group">${GROUPS.map(x=>`<option ${x===(t.group||'A')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Takım adı</label><input id="t_name" value="${esc(t.name)}"></div><div class="field"><label>🏆 Lig</label><select id="t_league">${d.leagues.map(l=>`<option ${l.name===league?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class="field"><label>👨‍🏫 Antrenör</label><div class="checkgrid">${d.coaches.map(c=>`<label class="check"><input class="coachcheck" type="checkbox" value="${c.id}" ${(t.coachIds||[]).includes(c.id)?'checked':''}> ${esc(c.name)}</label>`).join('')||'<span class="muted">Önce antrenör ekleyin.</span>'}</div></div><div class="field"><label>Antrenman günleri (2–4)</label><div class="checkgrid">${DAYS.map(x=>`<label class="check"><input class="daycheck" type="checkbox" value="${x}" ${(t.days||[]).includes(x)?'checked':''}> ${x}</label>`).join('')}</div></div><div class="field"><label>60 dk saat</label><select id="t_time">${TIMES.map(x=>`<option ${x===(t.time||TIMES[8])?'selected':''}>${x}</option>`).join('')}</select></div></div><br><div class="actions"><button class="btn primary" onclick="saveTeam('${t.id||''}')">💾 Kaydet</button>${t.id?`<button class="btn danger" onclick="deleteTeam('${t.id}')">🗑️ Sil</button>`:''}</div>`}
function saveTeam(id){let days=[...document.querySelectorAll('.daycheck:checked')].map(x=>x.value);if(days.length<2||days.length>4)return toast('2–4 antrenman günü seç.');let t=id?d.teams.find(x=>x.id===id):{id:uid('t')};t.category=$('t_cat').value;t.group=$('t_group').value;t.name=$('t_name').value.trim()||`${t.category} ${t.group}`;t.league=$('t_league').value;t.coachIds=[...document.querySelectorAll('.coachcheck:checked')].map(x=>x.value);t.days=days;t.time=$('t_time').value;if(!id)d.teams.push(t);save();closeModal();renderAll();toast('Takım kaydedildi.')}
function deleteTeam(id){if(teamPlayers(id).length&&!confirm('Bu takımda sporcular var. Yine de silinsin mi?'))return;d.players.forEach(p=>p.teamIds=(p.teamIds||[]).filter(x=>x!==id));d.teams=d.teams.filter(t=>t.id!==id);save();renderAll();toast('Takım silindi.')}
function teams(){ $('teams').innerHTML=`<div class="section-title"><h2>🏐 Takımlar</h2><div class="spacer"></div><button class="btn primary" onclick="modal('Yeni Takım',teamForm())">➕ Takım Ekle</button></div><div class="grid">${d.teams.map(t=>`<div class="card"><div class="row between"><div><span class="badge">${esc(t.category)}</span> <span class="badge">${esc(t.group)}</span><h3>${esc(t.name)}</h3><div class="badge">🏆 ${esc(t.league||'-')}</div><div class="muted">👥 ${teamPlayers(t.id).length} sporcu • 👨‍🏫 ${t.coachIds?.map(id=>d.coaches.find(c=>c.id===id)?.name).filter(Boolean).join(', ')||'Antrenör yok'}</div><div class="muted">📅 ${(t.days||[]).join(' • ')} • ⏰ ${esc(t.time||'-')}</div></div></div><br><div class="actions"><button class="btn" onclick="teamDetail('${t.id}')">👥 Aç</button><button class="btn" onclick="modal('Takım Düzenle',teamForm(d.teams.find(x=>x.id==='${t.id}')))" >✏️</button><button class="btn danger" onclick="deleteTeam('${t.id}')">🗑️</button></div></div>`).join('')||'<div class="card muted">Takım yok.</div>'}</div>`}
function teamDetail(id){let t=d.teams.find(x=>x.id===id);modal('🏐 '+esc(t.name),`<div class="notice">🏆 ${esc(t.league||'-')} • 📅 ${(t.days||[]).join(', ')} • ⏰ ${esc(t.time||'-')}</div><h3>👥 Sporcular</h3><div class="list">${teamPlayers(id).map(p=>`<div class="item"><b>${esc(p.name)}</b> <span class="muted">#${esc(p.no||'-')} • ${esc(p.position||'-')}</span></div>`).join('')||'<div class="muted">Sporcu yok.</div>'}</div>`)}
function schoolForm(g={}){return `<div class="formgrid"><div class="field"><label>Grup adı</label><input id="sg_name" value="${esc(g.name)}"></div><div class="field"><label>60 dk saat</label><select id="sg_time">${TIMES.map(x=>`<option ${x===(g.time||TIMES[8])?'selected':''}>${x}</option>`).join('')}</select></div></div><h3>📅 Günler (2–4)</h3><div class="checkgrid">${DAYS.map(x=>`<label class="check"><input class="sgday" type="checkbox" value="${x}" ${(g.days||[]).includes(x)?'checked':''}> ${x}</label>`).join('')}</div><br><button class="btn primary" onclick="saveSchool('${g.id||''}')">💾 Kaydet</button>`}
function saveSchool(id){let days=[...document.querySelectorAll('.sgday:checked')].map(x=>x.value);if(days.length<2||days.length>4)return toast('2–4 gün seç.');let g=id?d.schoolGroups.find(x=>x.id===id):{id:uid('sg')};g.name=$('sg_name').value.trim()||'Yeni Grup';g.days=days;g.time=$('sg_time').value;if(!id)d.schoolGroups.push(g);save();closeModal();renderAll();toast('Spor Okulu grubu kaydedildi.')}
function school(){ $('school').innerHTML=`<div class="section-title"><h2>🏫 Spor Okulu</h2><div class="spacer"></div><button class="btn primary" onclick="modal('Yeni Grup',schoolForm())">➕ Grup</button></div><div class="grid">${d.schoolGroups.map(g=>`<div class="card"><h3>${esc(g.name)}</h3><div>📅 ${(g.days||[]).join(' • ')}</div><div>⏰ ${esc(g.time||'-')}</div><div class="muted">👥 ${d.players.filter(p=>p.schoolGroupId===g.id).length} sporcu</div><br><div class="actions"><button class="btn" onclick="schoolGroup('${g.id}')">👥 Sporcular</button><button class="btn" onclick="modal('Grup Düzenle',schoolForm(d.schoolGroups.find(x=>x.id==='${g.id}')))" >✏️</button><button class="btn danger" onclick="deleteSchool('${g.id}')">🗑️</button></div></div>`).join('')||'<div class="card muted">Grup yok.</div>'}</div>`}
function deleteSchool(id){if(!confirm('Bu spor okulu grubu silinsin mi?'))return;d.players.forEach(p=>{if(p.schoolGroupId===id)p.schoolGroupId=''});d.schoolGroups=d.schoolGroups.filter(g=>g.id!==id);save();renderAll();toast('Grup silindi.')}
function schoolGroup(id){let g=d.schoolGroups.find(x=>x.id===id);modal('🏫 '+esc(g.name),`<div class="notice">📅 ${(g.days||[]).join(', ')} • ⏰ ${esc(g.time)}</div><h3>👥 Sporcular</h3><div class="list">${d.players.filter(p=>p.schoolGroupId===id).map(p=>`<div class="item">${esc(p.name)} • #${esc(p.no||'-')}</div>`).join('')||'<div class="muted">Sporcu yok.</div>'}</div>`)}
function monthDates(days,ym){let [y,m]=ym.split('-').map(Number),last=new Date(y,m,0).getDate(),map={Pazartesi:1,Salı:2,Çarşamba:3,Perşembe:4,Cuma:5,Cumartesi:6,Pazar:0},out=[];for(let day=1;day<=last;day++){let dt=new Date(y,m-1,day),name=DAYS[dt.getDay()===0?6:dt.getDay()-1];if(days.includes(name))out.push(dt.toISOString().slice(0,10))}return out}
function attendance(){let ym=state.attMonth||new Date().toISOString().slice(0,7),groupId=state.attGroup||d.schoolGroups[0]?.id||d.teams[0]?.id;let groups=[...d.schoolGroups.map(g=>({id:g.id,name:'🏫 '+g.name,days:g.days||[]})),...d.teams.map(t=>({id:t.id,name:'🏐 '+t.name,days:t.days||[]}))];let g=groups.find(x=>x.id===groupId);let dates=g?monthDates(g.days,ym):[];let people=g?(d.schoolGroups.some(x=>x.id===g.id)?d.players.filter(p=>p.schoolGroupId===g.id):teamPlayers(g.id)):[];$('attendance').innerHTML=`<div class="section-title"><h2>📝 Aylık Yoklama</h2></div><div class="formgrid"><div class="field"><label>Grup/Takım</label><select onchange="state.attGroup=this.value;attendance()">${groups.map(x=>`<option value="${x.id}" ${x.id===groupId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Ay</label><input type="month" value="${ym}" onchange="state.attMonth=this.value;attendance()"></div></div><br><div class="notice">Sadece grubun programındaki günler gösterilir: ${dates.length} antrenman.</div><div class="list" style="margin-top:10px">${dates.map(date=>attendanceDay(g,people,date)).join('')||'<div class="card muted">Bu ay için antrenman günü yok.</div>'}</div>`}
function attendanceDay(g,people,date){let key=g.id+'_'+date;let rec=d.attendance.find(x=>x.key===key)||{key,states:{}};return `<div class="card"><div class="row between"><b>📅 ${new Date(date+'T12:00').toLocaleDateString('tr-TR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}</b><button class="btn primary" onclick="saveAttendance('${g.id}','${date}')">💾 Kaydet</button></div><div class="list" style="margin-top:8px">${people.map(p=>`<div class="row between"><span>${esc(p.name)}</span><select data-att="${g.id}|${date}|${p.id}"><option ${rec.states[p.id]==='Geldi'?'selected':''}>Geldi</option><option ${rec.states[p.id]==='Gelmedi'?'selected':''}>Gelmedi</option><option ${rec.states[p.id]==='Geç'?'selected':''}>Geç</option><option ${rec.states[p.id]==='İzinli'?'selected':''}>İzinli</option></select></div>`).join('')||'<span class="muted">Sporcu yok.</span>'}</div></div>`}
function saveAttendance(gid,date){let key=gid+'_'+date,rec=d.attendance.find(x=>x.key===key);if(!rec){rec={key,gid,date,states:{}};d.attendance.push(rec)}document.querySelectorAll(`[data-att^="${gid}|${date}|"]`).forEach(s=>{let pid=s.dataset.att.split('|')[2];rec.states[pid]=s.value});save();toast('Yoklama kaydedildi.')}
function trainingForm(t={}){let team=d.teams.find(x=>x.id===t.teamId);let auto=team?.time||TIMES[8];return `<div class="formgrid"><div class="field"><label>Takım/Grup</label><select id="tr_team">${d.teams.map(x=>`<option value="${x.id}" ${x.id===t.teamId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Tarih</label><input type="date" id="tr_date" value="${t.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Saat otomatik / manuel</label><select id="tr_time"><option value="auto">Otomatik grup saati (${esc(auto)})</option><option value="manual">Manuel saat yaz</option></select></div><div class="field"><label>Manuel saat (opsiyonel)</label><input id="tr_manual" value="${esc(t.timeManual||'')}" placeholder="18:30 - 20:00"></div></div><h3>🏐 Beceriler</h3><div class="checkgrid">${SKILLS.map(s=>`<label class="check"><input class="skillcheck" type="checkbox" value="${s}" ${(t.skills||[]).includes(s)?'checked':''}> ${s}</label>`).join('')}</div><h3>🎯 Beceri basamakları</h3><div class="list">${SKILLS.map(s=>`<div class="item"><b>${s}</b><div class="checkgrid">${LEVELS.map(l=>`<label class="check"><input class="levelcheck" data-skill="${s}" type="checkbox" value="${l}" ${(t.levels?.[s]||[]).includes(l)?'checked':''}> ${l}</label>`).join('')}</div></div>`).join('')}</div><div class="field"><label>Antrenör notu</label><textarea id="tr_note">${esc(t.note)}</textarea></div><br><button class="btn primary" onclick="saveTraining('${t.id||''}')">💾 Kaydet</button>`}
function saveTraining(id){let t=id?d.trainings.find(x=>x.id===id):{id:uid('tr')};t.teamId=$('tr_team').value;t.date=$('tr_date').value;let tm=d.teams.find(x=>x.id===t.teamId);t.time=$('tr_time').value==='auto'?(tm?.time||''):($('tr_manual').value.trim());t.timeManual=$('tr_manual').value.trim();t.skills=[...document.querySelectorAll('.skillcheck:checked')].map(x=>x.value);t.levels={};document.querySelectorAll('.levelcheck:checked').forEach(x=>{(t.levels[x.dataset.skill]??=[]).push(x.value)});t.note=$('tr_note').value;t.title=(t.skills||[]).join(' + ')||'Antrenman';if(!id)d.trainings.push(t);save();closeModal();renderAll();toast('Antrenman kaydedildi.')}
function training(){$('training').innerHTML=`<div class="section-title"><h2>🏋️ Antrenman</h2><div class="spacer"></div><button class="btn primary" onclick="modal('Yeni Antrenman',trainingForm())">➕ Yeni</button></div><div class="list">${[...d.trainings].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>{let tm=d.teams.find(x=>x.id===t.teamId);return `<div class="item"><div class="row between"><div><b>${esc(tm?.name||'Takım')} • ${t.date} • ${esc(t.time)}</b><div>${esc(t.title)}</div><div class="muted">${esc(t.note||'')}</div></div><div class="actions"><button class="btn" onclick="modal('Antrenman Düzenle',trainingForm(d.trainings.find(x=>x.id==='${t.id}')))" >✏️</button><button class="btn danger" onclick="deleteTraining('${t.id}')">🗑️</button></div></div></div>`}).join('')||'<div class="card muted">Antrenman yok.</div>'}</div>`}
function deleteTraining(id){if(!confirm('Antrenman silinsin mi?'))return;d.trainings=d.trainings.filter(x=>x.id!==id);save();renderAll()}
function matchForm(m={}){return `<div class="formgrid"><div class="field"><label>Takım</label><select id="m_team">${d.teams.map(t=>`<option value="${t.id}" ${t.id===m.teamId?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Rakip</label><input id="m_opp" value="${esc(m.opponent)}"></div><div class="field"><label>Tarih</label><input type="date" id="m_date" value="${m.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Saat</label><input id="m_time" value="${esc(m.time)}"></div><div class="field"><label>Salon / Yer</label><input id="m_venue" value="${esc(m.venue)}"></div></div><br><button class="btn primary" onclick="saveMatch('${m.id||''}')">💾 Maçı Kaydet</button>`}
function saveMatch(id){let m=id?d.matches.find(x=>x.id===id):{id:uid('m'),sets:[],events:[],finished:false};m.teamId=$('m_team').value;m.teamName=d.teams.find(t=>t.id===m.teamId)?.name||'';m.opponent=$('m_opp').value.trim()||'Rakip';m.date=$('m_date').value;m.time=$('m_time').value;m.venue=$('m_venue').value;if(!id)d.matches.push(m);save();closeModal();renderAll();toast('Maç kaydedildi.')}
function matches(){$('matches').innerHTML=`<div class="section-title"><h2>🏆 Maçlar</h2><div class="spacer"></div><button class="btn primary" onclick="modal('Yeni Maç',matchForm())">➕ Maç</button></div><div class="list">${d.matches.map(m=>`<div class="item row between"><div><b>${esc(m.teamName)} — ${esc(m.opponent)}</b><div class="muted">${m.date} ${m.time||''} • ${esc(m.venue||'')}</div></div><div class="actions"><button class="btn primary" onclick="liveMatch('${m.id}')">⚡ Canlı</button><button class="btn" onclick="modal('Maç Düzenle',matchForm(d.matches.find(x=>x.id==='${m.id}')))" >✏️</button></div></div>`).join('')||'<div class="card muted">Maç yok.</div>'}</div>`}
function liveMatch(id){state.selectedMatch=id;let m=d.matches.find(x=>x.id===id);if(!m)return;m.sets=m.sets||[];m.events=m.events||[];let cur=m.sets[m.sets.length-1]||{us:0,them:0};m.current=cur;let players=teamPlayers(m.teamId);modal('⚡ Canlı Maç',`<div class="grid"><div class="scorebox us"><div>${esc(m.teamName)}</div><div class="score">${cur.us}</div></div><div class="scorebox them"><div>${esc(m.opponent)}</div><div class="score">${cur.them}</div></div></div><br><div class="grid"><button class="quick us" onclick="point('${id}','us')">+1 ${esc(m.teamName)}</button><button class="quick them" onclick="point('${id}','them')">+1 ${esc(m.opponent)}</button></div><br><div class="row"><button class="btn" onclick="undoPoint('${id}')">↩️ Son sayıyı geri al</button><button class="btn" onclick="finishSet('${id}')">🏁 Seti Bitir</button></div><h3>🎯 Son sayı için neden</h3><div class="reasonbar">${['Servis','Hücum','Blok','Rakip Hatası','Servis Hatası','Hücum Hatası','Manşet Hatası','Diğer'].map(r=>`<button class="reason" onclick="setReason('${id}','${r}')">${r}</button>`).join('')}</div><h3>👤 Oyuncu</h3><div class="reasonbar">${players.map(p=>`<button class="reason" onclick="setPlayer('${id}','${p.id}')">#${esc(p.no||'-')} ${esc(p.name)}</button>`).join('')||'<span class="muted">Oyuncu yok.</span>'}</div><h3>📋 Son 8 olay</h3><div class="list">${m.events.slice(-8).reverse().map(e=>`<div class="item"><b>${e.team==='us'?esc(m.teamName):esc(m.opponent)} +1</b> • ${esc(e.reason||'Neden seçilmedi')} • ${esc(e.playerName||'Oyuncu yok')}<div class="muted">${e.time}</div></div>`).join('')||'<div class="muted">Henüz sayı yok.</div>'}</div>`)}
function point(id,side){let m=d.matches.find(x=>x.id===id);m.sets=m.sets||[];if(!m.sets.length)m.sets.push({us:0,them:0});let s=m.sets[m.sets.length-1];s[side]++;m.events=m.events||[];m.events.push({team:side,reason:m.pendingReason||'',playerId:m.pendingPlayer||'',playerName:d.players.find(p=>p.id===m.pendingPlayer)?.name||'',time:new Date().toLocaleTimeString('tr-TR')});m.pendingReason='';m.pendingPlayer='';save();liveMatch(id)}
function setReason(id,r){let m=d.matches.find(x=>x.id===id);m.pendingReason=r;toast('Neden seçildi: '+r)}function setPlayer(id,p){let m=d.matches.find(x=>x.id===id);m.pendingPlayer=p;toast('Oyuncu seçildi.')}
function undoPoint(id){let m=d.matches.find(x=>x.id===id);let e=(m.events||[]).pop();if(e){let s=m.sets[m.sets.length-1];s[e.team]--;save()}liveMatch(id)}
function finishSet(id){let m=d.matches.find(x=>x.id===id);let s=m.sets[m.sets.length-1];if(s.us===s.them)return toast('Set eşit bitirilemez.');m.sets.push({us:0,them:0});save();liveMatch(id)}
function tests(){let player=state.testPlayer,cat=state.testCategory;let list=d.tests.filter(t=>(!player||t.playerId===player)&&(!cat||t.category===cat));$('tests').innerHTML=`<div class="section-title"><h2>🧪 Test Merkezi</h2><div class="spacer"></div><button class="btn primary" onclick="modal('Yeni Test',testForm())">➕ Test Gir</button></div><div class="grid">${['Antropometrik','Teknik','Hız','Çeviklik','Sıçrama','Kuvvet','Dayanıklılık'].map(c=>`<button class="tile" onclick="state.testCategory='${c}';tests()">🧪<b>${c}</b><span>Testleri aç</span></button>`).join('')}</div><br><div class="formgrid"><div class="field"><label>Sporcu</label><select onchange="state.testPlayer=this.value;tests()"><option value="">Tümü</option>${d.players.map(p=>`<option value="${p.id}" ${p.id===player?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Kategori</label><select onchange="state.testCategory=this.value;tests()"><option value="">Tümü</option>${['Antropometrik','Teknik','Hız','Çeviklik','Sıçrama','Kuvvet','Dayanıklılık'].map(c=>`<option ${c===cat?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="section-title"><h2>Sonuçlar</h2></div><div class="list">${list.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="item row"><div style="flex:1"><b>${esc(t.name)}</b> — ${esc(t.value)} ${esc(t.unit)}<div class="muted">${esc(d.players.find(p=>p.id===t.playerId)?.name||'')} • ${t.date} • ${esc(t.period)}</div></div><button class="btn danger" onclick="deleteTest('${t.id}')">🗑️</button></div>`).join('')||'<div class="card muted">Test sonucu yok.</div>'}</div>`}
function testForm(){return `<div class="formgrid"><div class="field"><label>Sporcu</label><select id="te_player">${d.players.map(p=>`<option value="${p.id}" ${p.id===state.testPlayer?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Test</label><select id="te_test" onchange="testUnit()">${TESTS.map((x,i)=>`<option value="${i}">${esc(x[0])}</option>`).join('')}</select></div><div class="field"><label>Sonuç</label><input id="te_value"></div><div class="field"><label>Birim</label><input id="te_unit" readonly value="${TESTS[0][1]}"></div><div class="field"><label>Dönem</label><select id="te_period"><option>Sezon Başı</option><option>10. Hafta</option><option>20. Hafta</option><option>30. Hafta</option></select></div><div class="field"><label>Tarih</label><input type="date" id="te_date" value="${new Date().toISOString().slice(0,10)}"></div></div><br><button class="btn primary" onclick="saveTest()">💾 Testi Kaydet</button>`}
function testUnit(){let x=TESTS[Number($('te_test').value)];$('te_unit').value=x[1]}
function saveTest(){let x=TESTS[Number($('te_test').value)],t={id:uid('te'),playerId:$('te_player').value,name:x[0],unit:x[1],category:x[2],value:$('te_value').value,date:$('te_date').value,period:$('te_period').value};if(!t.playerId||!t.value)return toast('Sporcu ve sonuç gir.');d.tests.push(t);save();closeModal();renderAll();toast('Test kaydedildi.')}
function deleteTest(id){d.tests=d.tests.filter(x=>x.id!==id);save();tests()}
function tactics(){let t=d.tactics[0]||{id:uid('ta'),name:'Yeni Taktik',players:[]};if(!d.tactics.length){d.tactics=[t];save()}$('tactics').innerHTML=`<div class="section-title"><h2>🧠 Taktik Tahtası</h2><div class="spacer"></div><button class="btn primary" onclick="saveTactic()">💾 Kaydet</button></div><div class="formgrid"><div class="field"><label>Taktik adı</label><input id="ta_name" value="${esc(t.name)}"></div><div class="field"><label>Oyuncu</label><select id="ta_player">${d.players.map(p=>`<option value="${p.id}">#${esc(p.no||'-')} ${esc(p.name)}</option>`).join('')}</select></div><button class="btn" onclick="placePlayer()">➕ Sahaya koy</button><button class="btn danger" onclick="removeSelectedDot()">🗑️ Seçileni çıkar</button></div><br><div class="court" id="court">${(t.players||[]).map((p,i)=>`<div class="dot" data-i="${i}" style="left:${p.x}%;top:${p.y}%">#${esc(p.no||'-')}</div>`).join('')}</div><p class="muted">Oyuncuyu basılı tutup sürükle. Dokunup seç, sonra “Seçileni çıkar”.</p>`;bindDots()}
function placePlayer(){let p=d.players.find(x=>x.id===$('ta_player').value),t=d.tactics[0];if(!p)return;if(t.players.some(x=>x.id===p.id))return toast('Bu oyuncu zaten sahada.');t.players.push({id:p.id,no:p.no,x:15+t.players.length*12,y:35});save();tactics()}
let selectedDot=-1;function bindDots(){document.querySelectorAll('.dot').forEach(el=>{let down=false;el.addEventListener('pointerdown',e=>{down=true;selectedDot=Number(el.dataset.i);el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!down)return;let r=$('court').getBoundingClientRect(),p=d.tactics[0].players[selectedDot];p.x=Math.max(2,Math.min(90,(e.clientX-r.left)/r.width*100));p.y=Math.max(2,Math.min(86,(e.clientY-r.top)/r.height*100));el.style.left=p.x+'%';el.style.top=p.y+'%'});el.addEventListener('pointerup',()=>{down=false;save()})})}
function removeSelectedDot(){if(selectedDot<0)return toast('Önce oyuncuya dokun.');d.tactics[0].players.splice(selectedDot,1);selectedDot=-1;save();tactics()}
function saveTactic(){d.tactics[0].name=$('ta_name').value;save();toast('Taktik kaydedildi.')}
function messages(){let list=d.messages.slice().reverse();$('messages').innerHTML=`<div class="section-title"><h2>💬 İletişim</h2><div class="spacer"></div><button class="btn primary" onclick="messageForm()">✉️ Yeni</button></div><div class="list">${list.map(m=>`<div class="item"><b>${esc(m.title)}</b><div>${esc(m.body)}</div><div class="muted">${m.date} • ${esc(m.target)}</div></div>`).join('')||'<div class="card muted">Mesaj yok.</div>'}</div>`}
function messageForm(){modal('💬 Yeni Mesaj / Duyuru',`<div class="formgrid"><div class="field"><label>Hedef</label><select id="msg_target"><option>Sporcular</option><option>Veliler</option><option>Takım</option><option>Spor Okulu</option></select></div><div class="field"><label>Başlık</label><input id="msg_title"></div><div class="field" style="grid-column:1/-1"><label>Mesaj</label><textarea id="msg_body"></textarea></div></div><br><button class="btn primary" onclick="saveMessage()">📤 Gönder</button>`)}
function saveMessage(){let m={id:uid('msg'),title:$('msg_title').value||'Duyuru',body:$('msg_body').value,target:$('msg_target').value,date:new Date().toLocaleString('tr-TR')};d.messages.push(m);addNotification('📢 '+m.title,m.body);save();closeModal();renderAll();toast('Mesaj gönderildi.')}
function addNotification(title,body){d.notifications.unshift({id:uid('n'),title,body,date:new Date().toISOString(),read:false});save();updateBadge()}
function notifications(){let list=d.notifications;$('notifications').innerHTML=`<div class="section-title"><h2>🔔 Bildirimler</h2><div class="spacer"></div><button class="btn" onclick="markAllRead()">✓ Tümünü okundu</button><button class="btn danger" onclick="deleteAllNotifications()">🗑️ Tümünü sil</button></div><div class="list">${list.map(n=>`<div class="item row"><div style="flex:1" onclick="readNotification('${n.id}')"><b>${n.read?'':'🔴 '}${esc(n.title)}</b><div>${esc(n.body)}</div><div class="muted">${new Date(n.date).toLocaleString('tr-TR')}</div></div><button class="btn danger" onclick="deleteNotification('${n.id}')">🗑️</button></div>`).join('')||'<div class="card muted">Bildirim yok.</div>'}</div>`}
function readNotification(id){let n=d.notifications.find(x=>x.id===id);if(n)n.read=true;save();notifications();updateBadge()}function markAllRead(){d.notifications.forEach(n=>n.read=true);save();notifications();updateBadge()}function deleteNotification(id){d.notifications=d.notifications.filter(n=>n.id!==id);save();notifications();updateBadge()}function deleteAllNotifications(){if(!d.notifications.length)return;if(!confirm('Tüm bildirimler silinsin mi?'))return;d.notifications=[];save();notifications();updateBadge()}
function reportPlayer(id){let p=d.players.find(x=>x.id===id),tests=d.tests.filter(x=>x.playerId===id),att=d.attendance.flatMap(a=>Object.entries(a.states||{}).filter(([pid])=>pid===id).map(([,s])=>s));return `<div class="card"><h3>${esc(p.name)} — Performans Özeti</h3><p>Takımlar: ${playerTeams(p).map(t=>esc(t.name)).join(', ')||'Takımsız'}</p><p>Test kayıtları: ${tests.length}</p><p>Yoklama: ${att.filter(x=>x==='Geldi').length}/${att.length||0}</p><button class="btn primary" onclick="window.print()">🖨️ Yazdır / PDF</button></div>`}
function openReport(id){modal('📊 Sporcu Raporu',reportPlayer(id))}
function reports(){$('reports').innerHTML=`<div class="section-title"><h2>📊 Raporlar</h2></div><div class="card"><h3>👤 Sporcu raporu</h3><select onchange="if(this.value)openReport(this.value)"><option value="">Sporcu seç</option>${d.players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>`}
function leagueForm(l={}){return `<div class="field"><label>Lig adı</label><input id="lg_name" value="${esc(l.name)}"></div><br><button class="btn primary" onclick="saveLeague('${l.id||''}')">💾 Kaydet</button>`}
function saveLeague(id){let n=$('lg_name').value.trim();if(!n)return;let l=id?d.leagues.find(x=>x.id===id):{id:uid('lg')};l.name=n;if(!id)d.leagues.push(l);save();closeModal();renderAll()}
function club(){ $('club').innerHTML=`<div class="section-title"><h2>⚙️ Ayarlar</h2></div><div class="card"><h3>🏢 Kulüp</h3><div class="formgrid"><div class="field"><label>Kulüp</label><input id="c_club" value="${esc(d.club)}"></div><div class="field"><label>Ad Soyad</label><input id="c_coach" value="${esc(d.coach)}"></div><div class="field"><label>Sezon</label><input id="c_season" value="${esc(d.season)}"></div></div><br><button class="btn primary" onclick="saveClub()">💾 Kaydet</button></div><div class="card" style="margin-top:12px"><div class="row between"><h3>👨‍🏫 Antrenörler</h3><button class="btn primary" onclick="coachForm()">➕ Antrenör</button></div><div class="list">${d.coaches.map(c=>`<div class="item row between"><span>${esc(c.name)} • ${esc(c.role||'Antrenör')}</span><button class="btn danger" onclick="deleteCoach('${c.id}')">🗑️</button></div>`).join('')}</div></div><div class="card" style="margin-top:12px"><div class="row between"><h3>🏆 Ligler</h3><button class="btn primary" onclick="modal('Lig Ekle',leagueForm())">➕</button></div><div class="list">${d.leagues.map(l=>`<div class="item row between"><b>${esc(l.name)}</b><button class="btn" onclick="modal('Lig Düzenle',leagueForm(d.leagues.find(x=>x.id==='${l.id}')))" >✏️</button></div>`).join('')}</div></div><div class="card" style="margin-top:12px"><h3>💾 Veri Yönetimi</h3><div class="actions"><button class="btn primary" onclick="backup()">⬇️ Yedekle</button><button class="btn" onclick="archiveSeason()">🗄️ Sezonu Arşivle</button><label class="btn">♻️ Geri Yükle<input type="file" accept="application/json" hidden onchange="restore(this.files[0])"></label></div><p class="muted">Geri yükleme öncesinde mevcut verinin otomatik yedeği alınır.</p></div><div class="card" style="margin-top:12px"><h3>📅 Yeni Sezon</h3><button class="btn primary" onclick="newSeason()">Yeni sezon oluştur ve aktif sporcuları aktar</button><div class="muted" style="margin-top:8px">Sporcular aktarılır; takımlar, yoklama ve antrenmanlar eski sezonda kalır.</div></div><div class="card" style="margin-top:12px"><h3>🗄️ Arşivler</h3><div class="list">${d.archives.slice().reverse().map(a=>`<div class="item"><b>${esc(a.season)}</b><div class="muted">${new Date(a.created).toLocaleString('tr-TR')}</div></div>`).join('')||'<div class="muted">Henüz arşiv yok.</div>'}</div></div><div class="dangerbox" style="margin-top:12px"><b>⚠️ Tüm veriyi sıfırla</b><br><button class="btn danger" onclick="resetApp()">Tüm verileri sil</button></div>`}
function saveClub(){d.club=$('c_club').value.trim();d.coach=$('c_coach').value.trim();d.season=$('c_season').value.trim()||d.season;save();boot();toast('Ayarlar kaydedildi.')}
function coachForm(){modal('Yeni Antrenör',`<div class="field"><label>Ad Soyad</label><input id="co_name"></div><div class="field"><label>Rol</label><select id="co_role"><option>Baş Antrenör</option><option>Yardımcı Antrenör</option><option>Altyapı Antrenörü</option></select></div><br><button class="btn primary" onclick="saveCoach()">💾 Kaydet</button>`)}
function saveCoach(){let n=$('co_name').value.trim();if(!n)return;d.coaches.push({id:uid('c'),name:n,role:$('co_role').value});save();closeModal();renderAll()}function deleteCoach(id){if(d.teams.some(t=>(t.coachIds||[]).includes(id)))return toast('Bu antrenör bir takımda atanmış.');d.coaches=d.coaches.filter(c=>c.id!==id);save();renderAll()}
function backup(){let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`volleyScout-${d.season}-yedek.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(file){if(!file)return;backup();let r=new FileReader();r.onload=()=>{try{d=JSON.parse(r.result);normalize();save();boot();toast('Yedek geri yüklendi.')}catch(e){toast('Yedek dosyası okunamadı.')}};r.readAsText(file)}
function archiveSeason(){d.archives.push({season:d.season,created:new Date().toISOString(),data:JSON.parse(JSON.stringify(d))});save();toast(d.season+' arşivlendi.')}
function newSeason(){
  let n=prompt('Yeni sezon (örn. 2027-2028)',d.season);
  if(!n||n===d.season)return;
  archiveSeason();
  d.season=n;
  /* Aktif sporcular yeni sezona otomatik taşınır; sezon kayıtları temizlenir. */
  d.players=d.players.map(p=>({...p,teamIds:[],teamId:'',schoolGroupId:''}));
  d.teams=[]; d.schoolGroups=[]; d.attendance=[]; d.trainings=[]; d.matches=[]; d.tests=[]; d.tactics=[]; d.messages=[]; d.notifications=[];
  save(); boot(); toast('Yeni sezon oluşturuldu. Aktif sporcular yeni sezona aktarıldı.');
}
function resetApp(){if(confirm('TÜM veriler silinsin mi? Bu işlem geri alınamaz.')){localStorage.removeItem(KEY);location.reload()}}
try{let raw=localStorage.getItem(KEY);if(raw)d=JSON.parse(raw);else{let old=localStorage.getItem('volleyscout_v30');if(old){d=JSON.parse(old);normalize();save()}}}catch(e){}normalize();boot();
try{if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}}catch(e){}
</script></body></html>
