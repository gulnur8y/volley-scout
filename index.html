<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47b20"><title>VolleyScout TR</title><style>:root{--o:#f47b20;--bg:#f6f6f6;--ink:#222;--mut:#777;--line:#e7e7e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:5;padding:12px;display:flex;gap:10px;align-items:center}.top b{font-size:19px}.grow{flex:1}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 13px;font-weight:700;cursor:pointer}.icon{background:#fff;border:1px solid var(--line);font-size:20px}.primary{background:var(--o);color:#fff}.danger{background:#fff0f0;color:#c33}.secondary{background:#f3f3f3;color:#333}.ghost{background:#fff;border:1px solid var(--line)}main{max-width:1050px;margin:auto;padding:18px 14px 90px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 8px #00000008}.action{text-align:left;min-height:110px}.action strong{display:block;margin-top:10px;font-size:17px}.muted{color:var(--mut);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:24px}.stat small{color:var(--mut)}.row{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;flex-wrap:wrap}.row .grow{min-width:180px}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.field textarea{min-height:90px}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;position:sticky;bottom:0;background:#fff;padding-top:10px}.drawer{position:fixed;inset:0;background:#0006;z-index:20;display:none}.drawer.open{display:block}.panel{background:#fff;width:min(370px,88vw);height:100%;padding:16px;overflow:auto}.menu{display:block;width:100%;text-align:left;background:#fff;margin:3px 0}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:30}.modal.open{display:flex}.sheet{width:min(720px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:18px}.score{display:flex;justify-content:center;gap:25px;font-size:42px;font-weight:900}.score small{font-size:12px;color:var(--mut);display:block;text-align:center}.event{padding:9px;border:1px solid var(--line);border-radius:10px;margin:5px 0;font-size:13px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f4f4f4;font-size:12px}.notice{padding:10px 12px;background:#fff8ef;border:1px solid #ffd8b5;border-radius:12px;color:#8a4b12}.empty{padding:22px;text-align:center}.mini{font-size:12px}@media(max-width:700px){.grid4,.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.modal{align-items:flex-end}.sheet{border-radius:20px 20px 0 0}.row .grow{min-width:140px}}
</style></head><body><div class="top"><button class="icon" onclick="drawer()">☰</button><div><b>🏐 VolleyScout TR</b><div class="muted" id="ctx">Kulüp spor yönetimi</div></div><div class="grow"></div><button class="icon" onclick="page('settings')">⚙️</button></div>
<div id="dr" class="drawer" onclick="if(event.target===this)drawer()"><div class="panel"><button onclick="drawer()">✕ Kapat</button><h2>VolleyScout TR</h2><button class="menu" onclick="go('home')">🏠 Ana Sayfa</button><button class="menu" onclick="go('clubs')">🏢 Kulüpler</button><button class="menu" onclick="go('seasons')">📅 Sezonlar</button><button class="menu" onclick="go('teams')">👥 Takımlar</button><button class="menu" onclick="go('players')">👤 Oyuncular</button><button class="menu" onclick="go('matches')">🏐 Maçlar</button><button class="menu" onclick="go('tests')">🧪 Sporcu Testleri</button><button class="menu" onclick="go('training')">📝 Antrenman</button><button class="menu" onclick="go('analysis')">📊 Analiz</button><button class="menu" onclick="go('reports')">📄 Raporlar</button><button class="menu" onclick="go('settings')">⚙️ Ayarlar & Yedekleme</button></div></div>
<main id="app"></main><div id="mo" class="modal" onclick="if(event.target===this)requestClose()"><div id="sheet" class="sheet"></div></div><script>
const K='VS_TR_MASTER_1';
let d=JSON.parse(localStorage.getItem(K)||'null')||{clubs:[],seasons:[],teams:[],players:[],matches:[],events:[],tests:[],training:[]};
for(const k of ['clubs','seasons','teams','players','matches','events','tests','training'])if(!Array.isArray(d[k]))d[k]=[];
let s={page:'home',club:null,season:null,team:null,player:null,match:null,dirty:false};
const id=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function persist(){localStorage.setItem(K,JSON.stringify(d));}
function save(){persist();s.dirty=false;render();}
function drawer(){$('dr').classList.toggle('open')}
function go(p){drawer();page(p)}
function page(p){s.page=p;s.dirty=false;render()}
function club(){return d.clubs.find(x=>x.id===s.club)}
function season(){return d.seasons.find(x=>x.id===s.season)}
function team(){return d.teams.find(x=>x.id===s.team)}
function players(){return d.players.filter(x=>x.teamId===s.team)}
function modal(html,dirty=false){$('sheet').innerHTML=html;$('mo').classList.add('open');s.dirty=dirty}
function requestClose(){if(s.dirty&&!confirm('Kaydedilmemiş değişiklikler var. Kapatırsan bu bilgiler kaybolacak. Kapatılsın mı?'))return;close()}
function close(){ $('mo').classList.remove('open');s.dirty=false }
function cancelForm(){requestClose()}
function markDirty(){s.dirty=true}
function formButtons(saveFn){return `<div class="form-actions"><button class="secondary" onclick="cancelForm()">Vazgeç</button><button class="primary" onclick="${saveFn}">Kaydet</button></div>`}
function confirmDelete(label){return confirm(`"${label}" silinsin mi? Bu işlem geri alınamaz.`)}
function render(){let c=club();$('ctx').textContent=c?`${esc(c.name)} • ${esc(c.sport)} • ${esc(season()?.name||'')}`:'Kulüp spor yönetimi';let f={home,clubs,seasons,teams,teamPage,playersPage,playerPage,matches,matchPage,tests,training,analysis,reports,settings}[s.page]||home;$('app').innerHTML=f()}
function home(){let c=club();if(!c)return `<div class="card"><h1>🏐 VolleyScout TR</h1><p>Voleybol ve voleybol için kulüp, takım, oyuncu, test, antrenman ve maç takibi.</p><button class="primary" onclick="clubForm()">🏢 Kulüp Oluştur</button></div>`;return `<h1>İyi çalışmalar, ${esc(c.coach||'Antrenör')} 👋</h1><p class="muted">${esc(c.name)} • ${esc(c.sport)} • ${esc(season()?.name||'')}</p><div class="grid"><button class="card action" onclick="page('players')">👤<strong>Oyuncu Profilleri</strong><span class="muted">Sporcular ve gelişim</span></button><button class="card action" onclick="newMatch()">🏐<strong>Yeni Maç</strong><span class="muted">Manuel veya video + canlı</span></button><button class="card action" onclick="page('matches')">🗂️<strong>Eski Maçlar</strong><span class="muted">Maç geçmişi</span></button><button class="card action" onclick="page('analysis')">📊<strong>Sezon Özeti</strong><span class="muted">Performans ve gelişim</span></button></div><div class="section"><h2>Sezon Özeti</h2></div><div class="stats"><div class="stat"><b>${d.players.length}</b><small>Oyuncu</small></div><div class="stat"><b>${d.matches.length}</b><small>Maç</small></div><div class="stat"><b>${d.tests.length}</b><small>Test</small></div><div class="stat"><b>${d.training.length}</b><small>Antrenman</small></div></div>`}
function clubs(){return `<div class="section"><div><h2>🏢 Kulüpler</h2><div class="muted">Kulüp ekle, düzenle, seç veya sil.</div></div><button class="primary" onclick="clubForm()">+ Kulüp</button></div>${d.clubs.map(c=>`<div class="row"><div class="grow"><b>${esc(c.name)}</b><div class="muted">${esc(c.sport)} • ${esc(c.coach||'')}</div></div><button onclick="selectClub('${c.id}')">Aç</button><button onclick="clubForm('${c.id}')">✏️ Düzenle</button><button class="danger" onclick="deleteClub('${c.id}')">🗑️ Sil</button></div>`).join('')||'<div class="card empty muted">Henüz kulüp yok.</div>'}`}
function seasons(){let ss=d.seasons.filter(x=>!s.club||x.clubId===s.club);return `<div class="section"><div><h2>📅 Sezonlar</h2><div class="muted">Sezonları da sonradan düzenleyebilir veya kapatabilirsin.</div></div><button class="primary" onclick="seasonForm()">+ Sezon</button></div>${ss.map(x=>`<div class="row"><div class="grow"><b>${esc(x.name)}</b><div class="muted">${esc(d.clubs.find(c=>c.id===x.clubId)?.name||'')} • ${esc(x.status||'Aktif')}</div></div><button onclick="selectSeason('${x.id}')">Aç</button><button onclick="seasonForm('${x.id}')">✏️ Düzenle</button><button class="danger" onclick="deleteSeason('${x.id}')">🗑️ Sil</button></div>`).join('')||'<div class="card empty muted">Henüz sezon yok.</div>'}`}
function teams(){let ts=d.teams.filter(x=>!s.club||x.clubId===s.club);return `<div class="section"><div><h2>👥 Takımlar</h2><div class="muted">Takım ekle, düzenle veya kaldır.</div></div><button class="primary" onclick="teamForm()">+ Takım</button></div>${ts.map(t=>`<div class="row"><div class="grow"><b>${esc(t.name)}</b><div class="muted">${esc(t.category)} • ${esc(t.group)} • ${esc(t.lig)} • ${esc(t.sport)}</div></div><button onclick="openTeam('${t.id}')">Aç</button><button onclick="teamForm('${t.id}')">✏️ Düzenle</button><button class="danger" onclick="deleteTeam('${t.id}')">🗑️ Sil</button></div>`).join('')||'<div class="card empty muted">Henüz takım yok.</div>'}`}
function teamPage(){let t=team(),ps=d.players.filter(p=>p.teamId===t.id),ms=d.matches.filter(x=>x.teamId===t.id),tr=d.training.filter(x=>x.teamId===t.id);if(!t)return page('teams');return `<button onclick="page('teams')">← Takımlar</button><div class="card"><div class="section" style="margin:0"><div><h1>${esc(t.name)}</h1><p class="muted">${esc(t.sport)} • ${esc(t.category)} • ${esc(t.group)} • ${esc(t.lig)} • ${esc(season()?.name||'')}</p></div><div class="toolbar"><button onclick="teamForm('${t.id}')">✏️</button><button class="danger" onclick="deleteTeam('${t.id}')">🗑️</button></div></div></div><div class="stats"><div class="stat"><b>${ps.length}</b><small>Oyuncu</small></div><div class="stat"><b>${ms.length}</b><small>Maç</small></div><div class="stat"><b>${tr.length}</b><small>Antrenman</small></div><div class="stat"><b>${d.tests.filter(x=>ps.some(p=>p.id===x.playerId)).length}</b><small>Test</small></div></div><div class="grid"><button class="card action" onclick="page('players')">👤<strong>Oyuncular</strong></button><button class="card action" onclick="newMatch()">🏐<strong>Yeni Maç</strong></button><button class="card action" onclick="testForm()">🧪<strong>Test Yap</strong></button><button class="card action" onclick="trainingForm()">📝<strong>Antrenman</strong></button></div>`}
function playersPage(){let ts=d.teams.filter(x=>x.clubId===s.club&&(!s.season||x.seasonId===s.season));let cur=s.team&&ts.some(t=>t.id===s.team)?s.team:(ts[0]?.id||'');let ps=d.players.filter(p=>p.teamId===cur);return `<div class="section"><div><h2>👤 Oyuncular</h2><div class="muted">Ekle • düzenle • sil • takımını değiştir.</div></div><button class="primary" onclick="playerForm()">+ Oyuncu</button></div><div class="field"><label>Takım</label><select onchange="s.team=this.value;render()">${ts.map(t=>`<option value="${t.id}" ${t.id===cur?'selected':''}>${esc(t.name)} • ${esc(t.category)} ${esc(t.group)}</option>`).join('')}</select></div>${ps.map(p=>`<div class="row"><div class="grow"><b>#${esc(p.no)} ${esc(p.name)}</b><div class="muted">${esc(p.position||'')} • ${esc(ts.find(t=>t.id===p.teamId)?.name||'')}</div></div><button onclick="openPlayer('${p.id}')">Aç</button><button onclick="playerForm('${p.id}')">✏️ Düzenle</button><button class="danger" onclick="deletePlayer('${p.id}')">🗑️ Sil</button></div>`).join('')||'<div class="card empty muted">Bu takımda oyuncu yok.</div>'}`}
function playerPage(){let p=d.players.find(x=>x.id===s.player),t=d.teams.find(x=>x.id===p?.teamId);if(!p)return page('players');return `<button onclick="page('players')">← Oyuncular</button><div class="card"><div class="section" style="margin:0"><div><h1>#${esc(p.no)} ${esc(p.name)}</h1><p class="muted">${esc(t?.name||'')} • ${esc(p.position||'')}</p></div><div class="toolbar"><button onclick="playerForm('${p.id}')">✏️ Düzenle</button><button class="danger" onclick="deletePlayer('${p.id}')">🗑️ Sil</button></div></div><hr><p><b>Doğum:</b> ${esc(p.birth||'-')} &nbsp; <b>Boy:</b> ${esc(p.height||'-')} cm &nbsp; <b>Kilo:</b> ${esc(p.weight||'-')} kg</p><p>${esc(p.note||'Not yok.')}</p></div>`}
function matches(){let ms=d.matches.filter(m=>!s.club||d.teams.find(t=>t.id===m.teamId)?.clubId===s.club);return `<div class="section"><div><h2>🏐 Maçlar</h2><div class="muted">Maç ve set içi olayları düzenleyebilir veya silebilirsin.</div></div><button class="primary" onclick="newMatch()">+ Yeni Maç</button></div>${ms.map(m=>`<div class="row"><div class="grow"><b>${esc(m.teamName)} – ${esc(m.opp)}</b><div class="muted">${esc(m.date)} • ${esc(m.format)} • ${esc(m.status)} • ${m.a}-${m.b}</div></div><button onclick="openMatch('${m.id}')">Aç</button><button onclick="matchForm('${m.id}')">✏️ Düzenle</button><button class="danger" onclick="deleteMatch('${m.id}')">🗑️ Sil</button></div>`).join('')||'<div class="card empty muted">Henüz maç yok.</div>'}`}
function matchPage(){let m=d.matches.find(x=>x.id===s.match);if(!m)return page('matches');let ev=d.events.filter(e=>e.matchId===m.id);return `<button onclick="page('matches')">← Maçlar</button><div class="card"><div class="section" style="margin:0"><div><h2>${esc(m.teamName)} – ${esc(m.opp)}</h2><div class="muted">${esc(m.date)} • ${esc(m.mode)} • ${esc(m.format)}</div></div><div class="toolbar"><button onclick="matchForm('${m.id}')">✏️ Düzenle</button><button class="danger" onclick="deleteMatch('${m.id}')">🗑️ Sil</button></div></div><div class="score"><div>${m.a}<small>Biz</small></div><div>${m.b}<small>Rakip</small></div></div><div class="toolbar" style="justify-content:center"><button class="primary" onclick="eventForm('${m.id}',true)">+ Biz sayı</button><button class="secondary" onclick="eventForm('${m.id}',false)">+ Rakip sayı</button><button onclick="next('${m.id}')">Sonraki ${esc(m.label)}</button><button onclick="finish('${m.id}')">Maçı Tamamla</button></div><h3>${esc(m.label)} ${m.period} Olayları</h3>${ev.filter(e=>e.period===m.period).map(e=>`<div class="event"><b>${esc(e.seq)}.</b> ${esc(e.player?'#'+e.player+' ':'')}${esc(e.reason)} <span class="muted">${esc(e.time||'')}</span> <button onclick="eventEditForm('${e.id}')">✏️</button><button class="danger" onclick="deleteEvent('${e.id}')">🗑️</button></div>`).join('')||'<div class="muted">Henüz olay yok.</div>'}</div>`}
function tests(){let ps=d.players.filter(p=>!s.team||p.teamId===s.team);let xs=d.tests.filter(x=>ps.some(p=>p.id===x.playerId));return `<div class="section"><div><h2>🧪 Sporcu Testleri</h2><div class="muted">Her test kaydı sonradan düzenlenebilir veya silinebilir.</div></div><button class="primary" onclick="testForm()">+ Test</button></div>${xs.map(x=>{let p=d.players.find(p=>p.id===x.playerId);return `<div class="row"><div class="grow"><b>${esc(p?.name||'Oyuncu')} — ${esc(x.type)}</b><div class="muted">${esc(x.result)} ${esc(x.unit)} • ${esc(x.date)}</div></div><button onclick="testForm('${x.id}')">✏️ Düzenle</button><button class="danger" onclick="deleteTest('${x.id}')">🗑️ Sil</button></div>`}).join('')||'<div class="card empty muted">Henüz test yok.</div>'}`}
function training(){let xs=d.training.filter(x=>!s.team||x.teamId===s.team);return `<div class="section"><div><h2>📝 Antrenman</h2><div class="muted">Antrenman kaydını kapatabilir, düzenleyebilir veya silebilirsin.</div></div><button class="primary" onclick="trainingForm()">+ Antrenman</button></div>${xs.map(x=>`<div class="row"><div class="grow"><b>${esc(x.title)}</b><div class="muted">${esc(x.date)} • ${esc(x.duration)} dk • Katılım ${esc(x.att)}</div><div class="mini">${esc(x.note||'')}</div></div><button onclick="trainingForm('${x.id}')">✏️ Düzenle</button><button class="danger" onclick="deleteTraining('${x.id}')">🗑️ Sil</button></div>`).join('')||'<div class="card empty muted">Henüz antrenman yok.</div>'}`}
function analysis(){return `<div class="section"><h2>📊 Analiz Merkezi</h2></div><div class="stats"><div class="stat"><b>${d.players.length}</b><small>Oyuncu</small></div><div class="stat"><b>${d.matches.length}</b><small>Maç</small></div><div class="stat"><b>${d.tests.length}</b><small>Test</small></div><div class="stat"><b>${d.training.length}</b><small>Antrenman</small></div></div><div class="card" style="margin-top:12px"><b>VolleyScout TR • Voleybol sürümü</b><p>Bu sürümde yalnızca voleybol aktif. Voleybolu daha sonra ayrı bir modül olarak ekleyeceğiz. Önceliğimiz voleybolun tüm kayıt, maç, test, antrenman ve rapor akışını kusursuzlaştırmak.</p></div>`}
function reports(){return `<div class="section"><h2>📄 Raporlar</h2></div><div class="card"><p>Oyuncu seçerek veli performans raporu oluştur.</p>${d.players.map(p=>`<div class="row"><div class="grow"><b>#${esc(p.no)} ${esc(p.name)}</b></div><button class="primary" onclick="report('${p.id}')">PDF / Yazdır</button></div>`).join('')||'<div class="muted">Önce oyuncu ekle.</div>'}</div>`}
function settings(){return `<div class="section"><h2>⚙️ Ayarlar & Yedekleme</h2></div><div class="card"><button class="primary" onclick="backup()">⬇️ Yedek Al</button> <label class="secondary" style="display:inline-block;padding:10px 13px;border-radius:12px;cursor:pointer">⬆️ Yedek Geri Yükle<input type="file" accept="application/json" style="display:none" onchange="restore(this.files[0])"></label><hr><button class="danger" onclick="wipe()">Tüm Verileri Sil</button></div>`}
function clubForm(cid=''){let c=d.clubs.find(x=>x.id===cid)||{};modal(`<h2>${cid?'✏️ Kulübü Düzenle':'🏢 Kulüp'}</h2><div class="field"><label>Kulüp adı</label><input id="cn" value="${esc(c.name)}" oninput="markDirty()"></div><div class="field"><label>Antrenör</label><input id="cc" value="${esc(c.coach)}" oninput="markDirty()"></div><div class="field"><label>Branş</label><input value="Voleybol" disabled></div>${formButtons(cid?`updateClub('${cid}')`:'createClub()')}` ,!!cid)}
function createClub(){let c={id:id('c'),name:$('cn').value||'Kulüp',coach:$('cc').value||'Antrenör',sport:'Voleybol'};d.clubs.push(c);s.club=c.id;close();persist();page('clubs')}
function updateClub(cid){let c=d.clubs.find(x=>x.id===cid);if(!c)return;c.name=$('cn').value||'Kulüp';c.coach=$('cc').value||'Antrenör';c.sport='Voleybol';close();persist();render()}
function deleteClub(cid){let c=d.clubs.find(x=>x.id===cid);if(!c||!confirmDelete(c.name))return;let tids=d.teams.filter(t=>t.clubId===cid).map(t=>t.id);if(tids.some(tid=>d.players.some(p=>p.teamId===tid)||d.matches.some(m=>m.teamId===tid)||d.training.some(t=>t.teamId===tid))){alert('Bu kulüpte bağlı oyuncu, maç veya antrenman kaydı var. Veri kaybını önlemek için önce bunları taşı/sil.');return}d.teams=d.teams.filter(t=>t.clubId!==cid);d.seasons=d.seasons.filter(x=>x.clubId!==cid);d.clubs=d.clubs.filter(x=>x.id!==cid);if(s.club===cid){s.club=d.clubs[0]?.id||null;s.season=d.seasons[0]?.id||null;s.team=d.teams[0]?.id||null}persist();render()}
function selectClub(cid){s.club=cid;s.season=d.seasons.find(x=>x.clubId===cid)?.id||null;s.team=d.teams.find(x=>x.clubId===cid)?.id||null;persist();page('home')}
function seasonForm(sid=''){let x=d.seasons.find(q=>q.id===sid)||{};let clubs=d.clubs;modal(`<h2>${sid?'✏️ Sezonu Düzenle':'📅 Sezon'}</h2><div class="field"><label>Kulüp</label><select id="sc" onchange="markDirty()">${clubs.map(c=>`<option value="${c.id}" ${c.id===x.clubId||(!x.clubId&&c.id===s.club)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Sezon</label><input id="sn" value="${esc(x.name||'2026–2027')}" oninput="markDirty()"></div><div class="field"><label>Durum</label><select id="sst" onchange="markDirty()"><option ${x.status!=='Kapalı'?'selected':''}>Aktif</option><option ${x.status==='Kapalı'?'selected':''}>Kapalı</option></select></div>${formButtons(sid?`updateSeason('${sid}')`:'createSeason()')}`,!!sid)}
