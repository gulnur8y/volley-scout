<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f97316">
<title>VolleyScout TR V4.3 FINAL</title>
<style>
:root{--orange:#f97316;--orange2:#ea580c;--bg:#fff7ed;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#fed7aa;--ok:#16a34a;--bad:#dc2626;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1180px;margin:auto;min-height:100vh}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--orange2),var(--orange),#fb923c);backdrop-filter:blur(12px);border-bottom:0;padding:12px 18px;display:flex;align-items:center;gap:12px;color:#fff;box-shadow:0 5px 18px rgba(194,65,12,.18)}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--orange),#fb923c);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:800}.top h1{font-size:18px;margin:0}.top small{color:var(--muted)}.spacer{flex:1}
.iconbtn,.btn{border-radius:12px;padding:10px 13px;background:#fff;border:1px solid var(--line);color:var(--ink)}
.top .iconbtn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}.top .logo{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3)}.top h1{color:#fff}.top small{color:rgba(255,255,255,.9)}.primary{background:var(--orange);color:#fff;border-color:var(--orange)}.danger{background:#fff;color:var(--bad);border-color:#fecaca}.ghost{background:transparent}
main{padding:18px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 5px 20px rgba(124,45,18,.06)}.card h3{margin:0 0 8px}.muted{color:var(--muted)}.hero{background:linear-gradient(135deg,#fff1e6,#fff);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}.hero h2{margin:0 0 6px;font-size:28px}.section-title{display:flex;align-items:center;gap:10px;margin:22px 0 12px}.section-title h2{margin:0;font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.tile{padding:18px;border-radius:18px;background:#fff;border:1px solid var(--line);text-align:left;min-height:100px}.tile b{display:block;margin-top:8px}.tile span{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #fdba74;border-radius:11px;background:#fff}.field textarea{min-height:90px;resize:vertical}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:9px 10px;border-bottom:1px solid #ffedd5;text-align:left;font-size:13px}th{background:#fff7ed;position:sticky;top:0}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#ffedd5;color:#9a3412;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#ffedd5;display:grid;place-items:center;color:#9a3412;font-weight:800}.avatar.big{width:88px;height:88px;font-size:28px}
.nav{display:none !important}.nav button{padding:9px 4px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:12px}.nav button.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px}.close{float:right}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;z-index:50}.drawer.show{display:block}.drawerSheet{width:min(360px,88%);height:100%;overflow:auto;background:#fff;padding:18px;box-shadow:8px 0 30px rgba(0,0,0,.16)}.drawerNav{display:grid;gap:8px}.drawerNav button{text-align:left;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}.toast{position:fixed;right:16px;bottom:78px;background:#111827;color:#fff;padding:12px 15px;border-radius:12px;display:none;z-index:30}.toast.show{display:block}
.setup{min-height:100vh;display:grid;place-items:center;padding:20px}.setup .card{width:min(520px,100%)}.hidden{display:none!important}.stat{font-size:28px;font-weight:800}.score{font-size:42px;font-weight:900}.court{height:390px;border-radius:16px;background:#fb923c;border:6px solid #fff;box-shadow:inset 0 0 0 2px #9a3412;position:relative;overflow:hidden}.court:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid #fff}.court:after{content:"";position:absolute;left:14%;right:14%;top:22%;height:56%;border:3px solid #fff}.playerdot{position:absolute;width:42px;height:42px;border-radius:50%;background:#fff;color:#9a3412;display:grid;place-items:center;font-weight:800;box-shadow:0 3px 8px #7c2d1255;touch-action:none}
@media(min-width:900px){.modal{align-items:center}.sheet{border-radius:22px}}
.playerdot.selected{outline:4px solid #f97316;outline-offset:3px;transform:scale(1.08)}.playerdot{cursor:grab;user-select:none;-webkit-user-select:none}

.drawerSheet{border-top:6px solid var(--orange)}.drawerNav button{width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink);font-size:15px}.drawerNav button.active{background:var(--orange);color:#fff;border-color:var(--orange)}
</style>

<style>
.skill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.skill-chip{display:flex;align-items:center;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick-btn{min-height:64px;border-radius:16px;font-size:18px;font-weight:800;background:#fff;border:2px solid var(--line)}.quick-btn.orange{background:#fff7ed;border-color:#fb923c}.quick-btn.blue{background:#eff6ff;border-color:#93c5fd}.reason-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.reason-btn{padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:#fff}.reason-btn.active{background:#f97316;color:#fff;border-color:#f97316}.analysis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.mini-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.setbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.setbadge{padding:7px 10px;border-radius:999px;background:#fff;border:1px solid var(--line)}
</style>

<style>
#printArea{display:none}
body.printing>*:not(#printArea){display:none!important}
body.printing #printArea{display:block!important;padding:24px;font-family:Arial,sans-serif;color:#111}
.print-report{max-width:900px;margin:0 auto}
.print-report h1{margin-bottom:4px}.print-score{font-size:44px;font-weight:900;margin:20px 0}
.print-report table{width:100%;border-collapse:collapse;margin:12px 0 24px}.print-report th,.print-report td{border:1px solid #bbb;padding:8px;text-align:left;vertical-align:top}.print-report th{font-weight:800}.small{font-size:12px;color:#666}
.report-lines{line-height:1.7;margin-top:10px}
@media print{body.printing #printArea{display:block!important}body.printing{background:#fff!important}}
</style>
</head>
<body>
<div id="printArea"></div>
<div id="setup" class="setup">
  <div class="card">
    <div class="logo">🏐</div><h1>VolleyScout TR <span class="badge">V4.3 FINAL</span></h1>
    <p class="muted">Voleybol antrenör asistanı. İlk kurulumdan sonra kulübünü hatırlar.</p>
    <div class="field"><label>Ad Soyad</label><input id="setupCoach" placeholder="Antrenör adı"></div>
    <div class="field"><label>Kulüp / Spor Okulu adı</label><input id="setupClub" placeholder="Örn. Yıldız Spor"></div>
    <div class="field"><label>Sezon</label><input id="setupSeason" value="2026-2027"></div>
    <br><button class="btn primary" style="width:100%" onclick="finishSetup()">🚀 VolleyScout'u Başlat</button>
  </div>
</div>

<div id="app" class="app hidden">
<header class="top"><button class="iconbtn" onclick="toggleMenu()" aria-label="Menü">☰</button><button id="backBtn" class="iconbtn hidden" onclick="goBack()" aria-label="Geri">←</button><div class="logo">🏐</div><div><h1 id="brand">VolleyScout TR</h1><small id="subbrand">Antrenör paneli</small></div><div class="spacer"></div><button class="iconbtn" onclick="showView('notifications')">🔔 <span id="notifCount">0</span></button></header>
<main>
<section id="home" class="view active"></section>
<section id="athletes" class="view"></section>
<section id="teams" class="view"></section>
<section id="coaches" class="view"></section>
<section id="school" class="view"></section>
<section id="attendance" class="view"></section>
<section id="training" class="view"></section>
<section id="matches" class="view"></section>
<section id="tests" class="view"></section>
<section id="tactics" class="view"></section>
<section id="messages" class="view"></section>
<section id="reports" class="view"></section>
<section id="club" class="view"></section>
<section id="notifications" class="view"></section>
</main>
<nav class="nav" id="nav"></nav><div id="drawer" class="drawer" onclick="if(event.target===this)toggleMenu()"><div class="drawerSheet"><div class="row between"><h2>☰ Menü</h2><button class="btn" onclick="toggleMenu()">✕</button></div><div id="drawerNav" class="drawerNav"></div></div></div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="btn close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const KEY='volleyscout_v30';
const CATS=['Mini','Midi','Küçük','Yıldız'], GROUPS=['A','B','C','1','2','3'];
const DAYS=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const LEAGUES_DEFAULT=['Özel Lig','Süper Lig','1. Lig','2. Lig','Gelişim Ligi'];
const TECH=['Pas','Manşet','Servis','Hücum','Blok','Defans'];
const TEST_GROUPS={
 'Teknik Beceri':[
  ['Pas Testi','/10','teknik'],['Manşet Testi','/10','teknik'],['Servis Testi','/10','teknik'],
  ['Hücum Testi','/10','teknik'],['Blok Testi','/10','teknik'],['Defans Testi','/10','teknik']
 ],
 'Antropometrik':[['Boy','cm','antropometrik'],['Kilo','kg','antropometrik'],['Kulaç','cm','antropometrik']],
 'Hız':[['10 m Sprint','sn','hız'],['20 m Sprint','sn','hız']],
 'Çeviklik':[['T Testi','sn','çeviklik'],['Y Testi','sn','çeviklik']],
 'Kuvvet':[['Plank','sn','kuvvet'],['Durarak Uzun Atlama','cm','kuvvet'],['Dikey Sıçrama','cm','sıçrama'],['Hücum Sıçraması','cm','sıçrama']],
 'Dayanıklılık':[['Yo-Yo / Mekik','seviye','dayanıklılık']],
 'Esneklik':[['Esneklik','cm','esneklik']]
};
const TESTS=Object.entries(TEST_GROUPS).flatMap(([group,items])=>items.map(x=>[x[0],x[1],group]));
const DEFAULT_DATA={club:null,coach:null,season:'2026-2027',players:[],teams:[],coaches:[],schoolGroups:[],schoolAttendance:[],attendance:[],trainings:[],matches:[],tests:[],tactics:[],messages:[],notifications:[],leagues:LEAGUES_DEFAULT.slice()};
function loadData(){
 let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
 let saved=null;try{saved=raw?JSON.parse(raw):null}catch(e){saved=null}
 const x=Object.assign({},DEFAULT_DATA,saved||{});
 for(const k of ['players','teams','coaches','schoolGroups','schoolAttendance','attendance','trainings','matches','tests','tactics','messages','notifications']) if(!Array.isArray(x[k])) x[k]=[];
 if(!Array.isArray(x.leagues)||!x.leagues.length)x.leagues=LEAGUES_DEFAULT.slice();
 x.season=x.season||'2026-2027';
 x.players.forEach(p=>{if(!Array.isArray(p.teamIds))p.teamIds=p.teamId?[p.teamId]:[];p.teamId=p.teamIds[0]||'';});
 x.teams.forEach(t=>{if(!Array.isArray(t.days))t.days=t.day?[t.day]:[];if(t.league&&typeof t.league==='object')t.league=t.league.name||'';if(!t.time)t.time='';if(!t.headCoachId)t.headCoachId='';if(!t.assistantCoachId)t.assistantCoachId='';});
 x.schoolGroups.forEach(g=>{if(!Array.isArray(g.days))g.days=g.day?[g.day]:[];if(!g.time)g.time='';});
 x.trainings.forEach(t=>{if(!Array.isArray(t.skills))t.skills=[];if(!t.time){let tm=x.teams.find(z=>z.id===t.teamId);t.time=tm?.time||'';}});
 x.matches.forEach(m=>{if(!Array.isArray(m.points))m.points=[];if(!m.currentSet)m.currentSet=1;for(const pt of m.points)if(!pt.set)pt.set=1;});
 x.tactics.forEach(t=>{if(!Array.isArray(t.players))t.players=[];});
 return x;
}
let d=loadData();
d.matches.forEach(m=>{if(!Array.isArray(m.points))m.points=[];if(!m.currentSet)m.currentSet=1;if(!Array.isArray(m.setResults))m.setResults=[];m.points.forEach(p=>{if(!p.set)p.set=1});});
let state={view:'home',prevView:'home',editId:null,selectedPlayer:null,selectedTeam:null,selectedMatch:null,testPlayer:'',tacticSelected:null,month:new Date().toISOString().slice(0,7),attTeam:''};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){console.warn('Veri kaydedilemedi.',e)}}
function uid(p='x'){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function playerTeamIds(p){return Array.isArray(p.teamIds)?p.teamIds:(p.teamId?[p.teamId]:[])}
function playerTeams(p){return playerTeamIds(p).map(id=>d.teams.find(t=>t.id===id)).filter(Boolean)}
function teamPlayers(id){return d.players.filter(p=>playerTeamIds(p).includes(id))}
function finishSetup(){let club=$('setupClub').value.trim(),coach=$('setupCoach').value.trim();if(!club||!coach)return toast('Kulüp ve antrenör adını gir.');d.club=club;d.coach=coach;d.season=$('setupSeason').value||'2026-2027';save();boot()}
function boot(){if(!d.club){$('setup').classList.remove('hidden');$('app').classList.add('hidden');return}$('setup').classList.add('hidden');$('app').classList.remove('hidden');$('brand').textContent=d.club;$('subbrand').textContent=d.coach+' • '+d.season;renderNav();renderAll();showView(state.view||'home')}
function showView(v){if(!$(v))return;let prev=state.view;state.view=v;state.prevView=prev;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');document.querySelectorAll('.nav button,.drawerNav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));$('backBtn').classList.toggle('hidden',v==='home');render(v);if($('drawer').classList.contains('show'))toggleMenu()}
function goBack(){showView(state.prevView&&state.prevView!==state.view?state.prevView:'home')}
function toggleMenu(){$('drawer').classList.toggle('show')}
function renderNav(){let items=[['home','🏠','Ana'],['coaches','🧑‍🏫','Antrenörler'],['teams','🏐','Takımlar'],['athletes','👥','Sporcular'],['school','🏫','Spor Okulu'],['attendance','📝','Yoklama'],['training','🏋️','Antrenman'],['matches','🏐','Maçlar'],['tests','🧪','Testler'],['tactics','🧠','Taktik'],['messages','💬','İletişim'],['reports','📊','Raporlar'],['notifications','🔔','Bildirimler'],['club','⚙️','Ayarlar']];let make=x=>`<button data-v="${x[0]}" onclick="showView('${x[0]}')">${x[1]}<br>${x[2]}</button>`;$('nav').innerHTML=items.map(make).join('');$('drawerNav').innerHTML=items.map(x=>`<button data-v="${x[0]}" onclick="showView('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}
function renderAll(){['home','athletes','teams','coaches','school','attendance','training','matches','tests','tactics','messages','reports','club','notifications'].forEach(render);$('notifCount').textContent=d.notifications.filter(n=>!n.read).length}
function render(v){if(!$(`${v}`))return;({home:home,athletes:athletes,teams:teams,coaches:coaches,school:school,attendance:attendance,training:training,matches:matches,tests:tests,tactics:tactics,messages:messages,reports:reports,club:club,notifications:notifications}[v])()}
function greeting(){let h=new Date().getHours();return h<6?'İyi geceler':h<12?'Günaydın':h<18?'İyi çalışmalar':'İyi akşamlar'}
function home(){let today=new Date().toISOString().slice(0,10),trs=d.trainings.filter(t=>t.date===today),up=d.matches.filter(m=>m.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,2),pending=d.notifications.filter(n=>!n.read).length;$('home').innerHTML=`<div class="hero"><h2>${greeting()} ${esc(d.coach)} 👋</h2><div class="muted">${esc(d.club)} • ${esc(d.season)}</div><div class="grid" style="margin-top:14px"><div><div class="stat">${d.players.length}</div><div class="muted">Sporcu</div></div><div><div class="stat">${d.teams.length}</div><div class="muted">Takım</div></div><div><div class="stat">${d.trainings.length}</div><div class="muted">Antrenman</div></div><div><div class="stat">${pending}</div><div class="muted">Okunmamış</div></div></div></div>
<div class="section-title"><h2>⚡ Hızlı İşlemler</h2><span class="muted">Diğer tüm bölümler ☰ menüde</span></div>
<div class="tiles">
${[['training','🏋️','Antrenman Ekle','Yeni antrenman planla'],['matches','🏐','Maç Başlat','Hızlı canlı maç analizi'],['attendance','📝','Yoklama','Takım yoklamasını aç'],['tests','🧪','Test Gir','Sporcu test merkezine git']].map(t=>`<button class="tile" onclick="showView('${t[0]}')">${t[1]}<b>${t[2]}</b><span>${t[3]}</span></button>`).join('')}</div>
<div class="section-title"><h2>Bugün</h2></div><div class="list">${trs.length?trs.map(t=>`<div class="item"><b>🏋️ ${esc(t.title)}</b><div class="muted">${t.time||''} • ${esc(t.team||'')}</div></div>`).join(''):'<div class="card muted">Bugün planlanmış antrenman yok.</div>'}</div>
<div class="section-title"><h2>Yaklaşan Maçlar</h2></div><div class="list">${up.length?up.map(m=>`<div class="item"><b>🏐 ${esc(m.team)} — ${esc(m.opponent)}</b><div class="muted">${m.date} ${m.time||''} • ${esc(m.venue||'')}</div></div>`).join(''):'<div class="card muted">Yaklaşan maç yok.</div>'}</div>`}
function openModal(title,body){$('modalBody').innerHTML=`<h2>${title}</h2>${body}`;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show');state.editId=null}
function athleteForm(p={}){let ids=playerTeamIds(p);return `<div class="formgrid">
<div class="field"><label>Ad Soyad</label><input id="f_name" value="${esc(p.name)}"></div><div class="field"><label>Forma No</label><input id="f_no" value="${esc(p.no)}"></div>
<div class="field"><label>Mevki</label><select id="f_pos">${['Pasör','Smaçör','Orta','Libero','Pasör Çaprazı','Diğer'].map(x=>`<option ${x===p.position?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Doğum Tarihi</label><input type="date" id="f_birth" value="${esc(p.birth)}"></div><div class="field"><label>Boy (cm)</label><input id="f_height" value="${esc(p.height)}"></div><div class="field"><label>Kilo (kg)</label><input id="f_weight" value="${esc(p.weight)}"></div>
<div class="field" style="grid-column:1/-1"><label>Fotoğraf</label><input type="file" id="f_photo" accept="image/*"></div>
<div class="field" style="grid-column:1/-1"><label>Takımlar — birden fazla seçilebilir</label><div class="card">${d.teams.map(t=>`<label style="display:block;margin:7px 0"><input class="tmcheck" type="checkbox" value="${t.id}" ${ids.includes(t.id)?'checked':''}> ${esc(t.name)} <span class="muted">• ${esc(t.category)}</span></label>`).join('')||'<span class="muted">Önce takım oluştur.</span>'}</div></div>
<div class="field" style="grid-column:1/-1"><label>Spor Okulu Grubu</label><select id="f_school"><option value="">Yok</option>${d.schoolGroups.map(g=>`<option value="${g.id}" ${g.id===p.schoolGroupId?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div>
<div class="field" style="grid-column:1/-1"><label>Not</label><textarea id="f_note">${esc(p.note)}</textarea></div></div>
<br><div class="actions"><button class="btn primary" onclick="saveAthlete('${p.id||''}')">💾 Kaydet</button>${p.id?`<button class="btn danger" onclick="deleteAthlete('${p.id}')">🗑️ Sil</button>`:''}</div>`}

function schoolAttendanceDates(month,g){let y=Number(month.slice(0,4)),m=Number(month.slice(5,7)),daysInMonth=new Date(y,m,0).getDate(),allowed=Array.isArray(g.days)&&g.days.length?g.days:(g.day?[g.day]:DAYS);return Array.from({length:daysInMonth},(_,i)=>{let date=new Date(y,m-1,i+1),day=DAYS[(date.getDay()+6)%7];return allowed.includes(day)?{date:`${month}-${String(i+1).padStart(2,'0')}`,day}:null}).filter(Boolean)}
function schoolAttendance(groupId){let g=d.schoolGroups.find(x=>x.id===groupId);if(!g)return;let month=state.schoolMonth||new Date().toISOString().slice(0,7),ps=d.players.filter(p=>p.schoolGroupId===groupId),dates=schoolAttendanceDates(month,g);openModal('📝 '+esc(g.name)+' • Yoklama',`<div class="formgrid"><div class="field"><label>Ay</label><input type="month" value="${month}" onchange="state.schoolMonth=this.value;schoolAttendance('${groupId}')"></div><div class="field"><label>⏰ Grup saati</label><input type="time" value="${esc(g.time||'')}" disabled></div></div><div class="muted" style="margin:10px 0">${dates.length} antrenman günü • ${ps.length} sporcu</div>${dates.map(dt=>{return `<div class="card" style="margin-bottom:12px"><div class="section-title"><h3>📅 ${dt.date.split('-').reverse().join('.')} • ${dt.day}</h3><div class="muted">⏰ ${esc(g.time||'')}</div></div><div class="actions" style="margin-bottom:10px"><button class="btn" onclick="bulkSchoolAttendance('${groupId}','${dt.date}','G')">🟢 Tümünü Geldi</button><button class="btn" onclick="bulkSchoolAttendance('${groupId}','${dt.date}','Y')">🔴 Tümünü Gelmedi</button></div>${ps.map(p=>{let a=d.schoolAttendance.find(x=>x.groupId===groupId&&x.playerId===p.id&&x.date===dt.date),v=a?.status||'';return `<div class="item row"><div style="flex:1"><b>${esc(p.name)}</b>${p.no?`<div class="muted">#${esc(p.no)}</div>`:''}</div><div class="actions"><button class="btn ${v==='G'?'primary':''}" onclick="setSchoolAttendance('${groupId}','${p.id}','${dt.date}','G')">✅</button><button class="btn ${v==='Y'?'danger':''}" onclick="setSchoolAttendance('${groupId}','${p.id}','${dt.date}','Y')">❌</button><button class="btn ${v==='GEC'?'primary':''}" onclick="setSchoolAttendance('${groupId}','${p.id}','${dt.date}','GEC')">🟡</button><button class="btn ${v==='I'?'primary':''}" onclick="setSchoolAttendance('${groupId}','${p.id}','${dt.date}','I')">🔵</button></div></div>`}).join('')||'<div class="muted">Bu grupta sporcu yok.</div>'}</div>`}).join('')||'<div class="card muted">Bu ay için seçili gün yok.</div>'}`)}

function bulkSchoolAttendance(groupId,date,status){let ps=d.players.filter(p=>p.schoolGroupId===groupId);ps.forEach(p=>{let a=d.schoolAttendance.find(x=>x.groupId===groupId&&x.playerId===p.id&&x.date===date);if(!a)d.schoolAttendance.push({id:uid('sat'),groupId,playerId:p.id,date,status});else a.status=status});save();schoolAttendance(groupId);toast('Spor okulu yoklaması toplu güncellendi.')}

function finishSet(id,winner){

function finishMatch(id){
let m=d.matches.find(x=>x.id===id);if(!m)return;if(m.finished)return toast('Bu maç zaten tamamlandı.');
if(!Array.isArray(m.setResults))m.setResults=[];if(!m.currentSet)m.currentSet=1;

if(!m.setResults.some(x=>x.set===current)){

function matchEventModel(p){
  if(p.event==='point'||p.event==='error'||p.event==='received'||p.event==='team')return p.event;
  if(p.reason==='Rakip hatası'&&p.side==='biz')return 'received';
  if(p.side==='rakip'&&p.playerId)return 'error';
  if(p.side==='biz'&&p.playerId)return 'point';
  return 'team';
}
function pointStats(m){
  let pts=Array.isArray(m.points)?m.points:[],out={};
  d.players.forEach(p=>out[p.id]={id:p.id,name:p.name,no:p.no,point:0,error:0,received:0,total:0,pointReasons:{},errorReasons:{},sets:{}});
  pts.forEach(p=>{let ev=matchEventModel(p),pid=p.playerId;if(!pid||!out[pid])return;let st=out[pid],r=p.reason||'Diğer',set=p.set||1;st.total++;st.sets[set]=(st.sets[set]||0)+1;if(ev==='point'){st.point++;st.pointReasons[r]=(st.pointReasons[r]||0)+1}else if(ev==='error'){st.error++;st.errorReasons[r]=(st.errorReasons[r]||0)+1}else if(ev==='received')st.received++;});
  return out;
}
function reasonList(obj){return Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc(k)} ${v}`).join(' • ')||'—'}
function playerStatCards(m){
  let stats=pointStats(m),points=m.points||[],teamPoints=points.filter(p=>p.side==='biz').length;
  return Object.values(stats).filter(s=>s.total>0).sort((a,b)=>(b.point-b.error)-(a.point-a.error)).map(s=>{
    let net=s.point-s.error, pct=teamPoints?((s.point/teamPoints)*100):0;
    return `<div class="card report-player-card"><div class="row between"><div><h3>👤 ${esc(s.name)} ${s.no?`<span class="badge">#${esc(s.no)}</span>`:''}</h3><div class="muted">Net katkı: ${net} • Takım sayılarının ${pct.toFixed(1)}%'i</div></div></div><div class="analysis-grid"><div class="mini-stat"><div class="muted">🏆 Aldığı sayı</div><div class="score">${s.point}</div></div><div class="mini-stat"><div class="muted">❌ Yaptığı hata</div><div class="score">${s.error}</div></div><div class="mini-stat"><div class="muted">🎁 Rakip hatasıyla alınan takım sayısı</div><div class="score">${s.received}</div></div><div class="mini-stat"><div class="muted">📈 Net katkı</div><div class="score">${net}</div></div></div><div class="report-lines"><b>🏆 Kazandırdığı sayı nedeni:</b> ${reasonList(s.pointReasons)}<br><b>❌ Yaptığı hata nedeni:</b> ${reasonList(s.errorReasons)}</div></div>`;
  }).join('')||'<div class="card muted">Oyuncu verisi yok. Sayı/hata kaydederken oyuncu seç.</div>';
}
function matchAnalysis(id){
  let m=d.matches.find(x=>x.id===id);if(!m)return;let points=Array.isArray(m.points)?m.points:[],biz=points.filter(p=>p.side==='biz'),rak=points.filter(p=>p.side==='rakip');
  let setNums=[...new Set(points.map(p=>p.set||1))].sort((a,b)=>a-b),sets=setNums.map(s=>{let b=points.filter(p=>(p.set||1)===s&&p.side==='biz').length,r=points.filter(p=>(p.set||1)===s&&p.side==='rakip').length;return `<div class="mini-stat"><b>${s}. Set</b><div class="score">${b} - ${r}</div></div>`}).join('');
  let positive={},errors={},received=0;points.forEach(p=>{let ev=matchEventModel(p),r=p.reason||'Diğer';if(ev==='point')positive[r]=(positive[r]||0)+1;if(ev==='error')errors[r]=(errors[r]||0)+1;if(ev==='received')received++});
  openModal('📊 Detaylı Maç Analizi — '+esc(m.team)+' 🆚 '+esc(m.opponent),`<div class="analysis-grid"><div class="mini-stat"><div class="muted">Maç skoru</div><div class="score">${biz.length} - ${rak.length}</div></div><div class="mini-stat"><div class="muted">🏆 Bizim sayılar</div><div class="score">${biz.length}</div></div><div class="mini-stat"><div class="muted">🔴 Rakip sayıları</div><div class="score">${rak.length}</div></div><div class="mini-stat"><div class="muted">🎁 Rakip hatası</div><div class="score">${received}</div></div></div><h3>🏐 Set Analizi</h3><div class="analysis-grid">${sets||'<div class="muted">Set verisi yok.</div>'}</div><h3>👤 Sporcu Bazlı Performans</h3><div class="list">${playerStatCards(m)}</div><h3>🎯 Takım Teknik Dağılımı</h3><div class="card"><b>🏆 Kazandırılan sayıların nedeni</b><div class="muted" style="margin-top:6px">${reasonList(positive)}</div><br><b>❌ Hataların nedeni</b><div class="muted" style="margin-top:6px">${reasonList(errors)}</div></div><br><div class="actions"><button class="btn primary" onclick="printMatchReport('${id}')">📄 PDF / Yazdır</button><button class="btn" onclick="liveMatch('${id}')">⚡ Maça Dön</button></div>`);
}

function liveMatch(id){
  let m=d.matches.find(x=>x.id===id);if(!m)return;let players=teamPlayers(m.teamId);if(!Array.isArray(m.points))m.points=[];if(!m.currentSet)m.currentSet=1;
  let current=m.currentSet,totalBiz=m.points.filter(p=>p.side==='biz').length,totalRak=m.points.filter(p=>p.side==='rakip').length,setBiz=m.points.filter(p=>(p.set||1)===current&&p.side==='biz').length,setRak=m.points.filter(p=>(p.set||1)===current&&p.side==='rakip').length,last=m.points[m.points.length-1]||{};
  let reasons=['Servis','Manşet','Pas','Hücum','Smaç','Plase','Blok','Defans / Savunma','File Teması','Diğer'],ev=matchEventModel(last);
  openModal('⚡ Canlı Maç Analizi — '+esc(m.team)+' 🆚 '+esc(m.opponent),`<div class="analysis-grid"><div class="mini-stat"><div class="muted">Toplam</div><div class="score" id="ls_total">${totalBiz} - ${totalRak}</div></div><div class="mini-stat"><div class="muted">Set ${current}</div><div class="score" id="ls_set">${setBiz} - ${setRak}</div></div></div><br><div class="setbar"><b>Set:</b> ${Array.from({length:Math.max(current,m.setResults?.length||0)},(_,i)=>`<span class="setbadge">${i+1}. set ${m.points.filter(p=>(p.set||1)===i+1&&p.side==='biz').length}-${m.points.filter(p=>(p.set||1)===i+1&&p.side==='rakip').length}</span>`).join('')}</div><div class="setbar" style="margin-top:10px"><button class="btn primary" onclick="finishSet('${id}','biz')">🏆 Seti Biz Kazandı</button><button class="btn" onclick="finishSet('${id}','rakip')">🏆 Seti Rakip Kazandı</button><button class="btn danger" onclick="finishMatch('${id}')">🏁 Maçı Bitir</button></div><hr><div class="field"><label>1️⃣ Olay türü</label><div class="reason-grid" id="eventGrid"><button type="button" data-event="point" class="reason-btn ${ev==='point'?'active':''}" onclick="selectMatchEvent('point');updateEventHelp()">🏆 Bizim sayımız</button><button type="button" data-event="error" class="reason-btn ${ev==='error'?'active':''}" onclick="selectMatchEvent('error');updateEventHelp()">❌ Bizim hatamız</button><button type="button" data-event="received" class="reason-btn ${ev==='received'?'active':''}" onclick="selectMatchEvent('received');updateEventHelp()">🎁 Rakip hatası</button><button type="button" data-event="team" class="reason-btn ${ev==='team'?'active':''}" onclick="selectMatchEvent('team');updateEventHelp()">👥 Takım sayısı</button></div><input type="hidden" id="q_event" value="${esc(ev)}"></div><div class="field"><label>2️⃣ Oyuncu</label><select id="q_player"><option value="">${ev==='received'||ev==='team'?'Oyuncu yok':'Oyuncu seç'}</option>${players.map(p=>`<option value="${p.id}" ${last.playerId===p.id?'selected':''}>${esc(p.name)} #${esc(p.no||'-')}</option>`).join('')}</select></div><div class="field"><label>3️⃣ Sayı / hata nedeni</label><div class="reason-grid" id="reasonGrid">${reasons.map(x=>`<button type="button" class="reason-btn ${last.reason===x?'active':''}" onclick="selectReason(this,'${x}')">${x}</button>`).join('')}</div><input type="hidden" id="q_reason" value="${esc(last.reason||'Servis')}"></div><p class="muted">🏆 Sayı: oyuncunun kazandırdığı sayı. ❌ Hata: oyuncunun yaptığı hata ve sayı rakibe gider. 🎁 Rakip hatası: sayı bize gelir ama oyuncuya yazılmaz.</p><div class="quick-grid"><button class="quick-btn orange" onclick="quickPoint('${id}','biz')">🟧 ${esc(m.team)} +1</button><button class="quick-btn blue" onclick="quickPoint('${id}','rakip')">🔵 ${esc(m.opponent)} +1</button></div><br><div class="section-title"><h3>Son 8 olay</h3><div class="spacer"></div><button class="btn" onclick="undoPoint('${id}')">↩️ Geri Al</button></div><div id="pointList">${m.points.slice(-8).reverse().map(pointRow).join('')||'<div class="card muted">Henüz veri yok.</div>'}</div><hr><div class="actions"><button class="btn" onclick="closeModal()">Kapat</button><button class="btn" onclick="matchAnalysis('${id}')">📊 Detaylı Analiz</button><button class="btn danger" onclick="deleteMatch('${id}')">🗑️ Maçı Sil</button></div>`);updateEventHelp();
}
function pointRow(p){let name=p.playerId?(d.players.find(x=>x.id===p.playerId)?.name||''):'Takım',ev=matchEventModel(p),label=ev==='point'?'🏆 Sayı':ev==='error'?'❌ Hata':ev==='received'?'🎁 Rakip hatası':'👥 Takım';return `<div class="item"><b>${label}</b> • ${esc(name||'Takım')} • ${esc(p.reason||'Diğer')}<div class="muted">${p.set||1}. set • ${p.time||''}</div></div>`}
function quickPoint(id,side){let m=d.matches.find(x=>x.id===id);if(!m)return;if(!m.currentSet)m.currentSet=1;let player=$('q_player')?.value||'',reason=$('q_reason')?.value||'Servis',event=$('q_event')?.value||'team';if(event==='point'&&side!=='biz'){toast('Bizim sayımız seçili. Turuncu +1 kullan.');return}if(event==='error'&&side!=='rakip'){toast('Bizim hatamız seçili. Rakip +1 kullan.');return}if((event==='received'||event==='team')&&side!=='biz'){toast('Bu olay için Biz +1 kullan.');return}if((event==='point'||event==='error')&&!player)return toast('Önce oyuncuyu seç.');let playerId=(event==='point'||event==='error')?player:'';m.points.push({id:uid('pt'),side,playerId,reason,event,time:new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}),set:m.currentSet});save();liveMatch(id);}
function undoPoint(id){let m=d.matches.find(x=>x.id===id);if(!m||!m.points.length)return toast('Geri alınacak olay yok.');m.points.pop();save();liveMatch(id);}
function playerMatchAggregate(playerId){let out={matches:0,point:0,error:0,received:0,pointReasons:{},errorReasons:{}};d.matches.filter(m=>m.finished).forEach(m=>{let st=pointStats(m)[playerId];if(!st||!st.total)return;out.matches++;out.point+=st.point;out.error+=st.error;out.received+=st.received;Object.entries(st.pointReasons).forEach(([k,v])=>out.pointReasons[k]=(out.pointReasons[k]||0)+v);Object.entries(st.errorReasons).forEach(([k,v])=>out.errorReasons[k]=(out.errorReasons[k]||0)+v)});return out;}
function reportPlayer(id){let p=d.players.find(x=>x.id===id);if(!p)return '<div class="card muted">Sporcu bulunamadı.</div>';let ts=d.tests.filter(x=>x.playerId===id),a=playerMatchAggregate(id);return `<div class="report-page"><h2>👤 ${esc(p.name)} — Performans Raporu</h2><p class="muted">${esc(d.club)} • ${esc(d.season)}</p><div class="analysis-grid"><div class="mini-stat"><div class="muted">Maç</div><div class="score">${a.matches}</div></div><div class="mini-stat"><div class="muted">🏆 Aldığı sayı</div><div class="score">${a.point}</div></div><div class="mini-stat"><div class="muted">❌ Yaptığı hata</div><div class="score">${a.error}</div></div><div class="mini-stat"><div class="muted">📊 Net katkı</div><div class="score">${a.point-a.error}</div></div></div><h3>🏆 Aldığı sayıların nedeni</h3><div class="card">${reasonList(a.pointReasons)}</div><h3>❌ Yaptığı hataların nedeni</h3><div class="card">${reasonList(a.errorReasons)}</div><h3>🧪 Testler</h3><div class="list">${ts.map(t=>`<div class="item"><b>${esc(t.name)}</b> — ${esc(t.value)} ${esc(t.unit||'')}<div class="muted">${t.date} • ${esc(t.period||'')}</div></div>`).join('')||'<div class="muted">Test kaydı yok.</div>'}</div><br><div class="actions"><button class="btn primary" onclick="printPlayerReport('${id}')">📄 PDF / Yazdır</button></div></div>`}
function reportMatchCard(m){let b=m.points.filter(p=>p.side==='biz').length,r=m.points.filter(p=>p.side==='rakip').length;return `<div class="card"><div class="row between"><div><h3>🏐 ${esc(m.team)} 🆚 ${esc(m.opponent)}</h3><div class="muted">${esc(m.date||'')} ${esc(m.time||'')} • ${esc(m.venue||'')}</div></div><div class="score">${b} - ${r}</div></div><div class="actions"><button class="btn" onclick="matchAnalysis('${m.id}')">📊 Analiz</button><button class="btn primary" onclick="printMatchReport('${m.id}')">📄 PDF</button></div></div>`}
function reports(){$('reports').innerHTML=`<div class="section-title"><h2>📊 Raporlar</h2></div><div class="card"><h3>👤 Sporcu Performans Raporu</h3><div class="muted">Maçlardan gelen sayı, hata ve teknik dağılımı + testler.</div><br><select onchange="if(this.value)openModal('Sporcu Raporu',reportPlayer(this.value))"><option value="">Sporcu seç</option>${d.players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="section-title"><h3>🏐 Tamamlanan Maç Raporları</h3></div><div class="list">${d.matches.filter(m=>m.finished).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(reportMatchCard).join('')||'<div class="card muted">Henüz tamamlanan maç yok. Maçı bitirdiğinde rapor burada otomatik oluşacak.</div>'}</div>`}
function buildMatchReport(id){let m=d.matches.find(x=>x.id===id);if(!m)return '';let points=m.points||[],biz=points.filter(p=>p.side==='biz').length,rak=points.filter(p=>p.side==='rakip').length,stats=pointStats(m),rows=Object.values(stats).filter(s=>s.total>0).map(s=>`<tr><td>${esc(s.name)}</td><td>${s.point}</td><td>${s.error}</td><td>${reasonList(s.pointReasons)}</td><td>${reasonList(s.errorReasons)}</td></tr>`).join('');let sets=(m.setResults||[]).map(x=>`<tr><td>${x.set}</td><td>${x.biz}</td><td>${x.rak}</td><td>${x.winner==='biz'?'Biz':x.winner==='rakip'?'Rakip':'-'}</td></tr>`).join('');return `<div class="print-report"><h1>🏐 VolleyScout TR</h1><h2>Maç Performans Raporu</h2><p><b>${esc(m.team)}</b> 🆚 <b>${esc(m.opponent)}</b></p><p>${esc(m.date||'')} ${esc(m.time||'')} • ${esc(m.venue||'')}</p><div class="print-score">${biz} - ${rak}</div><h3>Setler</h3><table><tr><th>Set</th><th>Biz</th><th>Rakip</th><th>Kazanan</th></tr>${sets||'<tr><td colspan="4">Set kaydı yok</td></tr>'}</table><h3>Sporcu Analizi</h3><table><tr><th>Sporcu</th><th>Aldığı sayı</th><th>Yaptığı hata</th><th>Sayı nedeni</th><th>Hata nedeni</th></tr>${rows||'<tr><td colspan="5">Oyuncu verisi yok</td></tr>'}</table><p class="small">Rapor; maç sırasında kaydedilen olay türü, oyuncu ve teknik nedenlerden oluşturulmuştur.</p></div>`}
function buildPlayerReport(id){let p=d.players.find(x=>x.id===id);if(!p)return '';let a=playerMatchAggregate(id),ts=d.tests.filter(x=>x.playerId===id);return `<div class="print-report"><h1>🏐 VolleyScout TR</h1><h2>${esc(p.name)} — Performans Raporu</h2><p>${esc(d.club)} • ${esc(d.season)}</p><table><tr><th>Maç</th><th>Aldığı sayı</th><th>Yaptığı hata</th><th>Rakip hatası</th></tr><tr><td>${a.matches}</td><td>${a.point}</td><td>${a.error}</td><td>${a.received}</td></tr></table><h3>Aldığı sayıların nedeni</h3><p>${reasonList(a.pointReasons)}</p><h3>Yaptığı hataların nedeni</h3><p>${reasonList(a.errorReasons)}</p><h3>Testler</h3><table><tr><th>Test</th><th>Sonuç</th><th>Tarih</th></tr>${ts.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.value)} ${esc(t.unit||'')}</td><td>${esc(t.date||'')}</td></tr>`).join('')||'<tr><td colspan="3">Test kaydı yok</td></tr>'}</table></div>`}
function printHtml(html){let area=$('printArea');if(!area){area=document.createElement('div');area.id='printArea';document.body.appendChild(area)}area.innerHTML=html;document.body.classList.add('printing');setTimeout(()=>{window.print();setTimeout(()=>{document.body.classList.remove('printing');area.innerHTML=''},500)},50)}
function printMatchReport(id){printHtml(buildMatchReport(id))}
function printPlayerReport(id){printHtml(buildPlayerReport(id))}
function leagueForm(l={}){return `<div class="field"><label>Lig adı</label><input id="lg_name" value="${esc(l.name)}" placeholder="Örn. Gelişim Ligi"></div><br><div class="actions"><button class="btn primary" onclick="saveLeague('${l.id||''}')">💾 Kaydet</button>${l.id?`<button class="btn danger" onclick="deleteLeague('${l.id}')">🗑️ Sil</button>`:''}</div>`}
function saveLeague(id){let name=$('lg_name').value.trim();if(!name)return toast('Lig adı gir.');let l=id?d.leagues.find(x=>x.id===id):{id:uid('lg')};l.name=name;if(!id)d.leagues.push(l);save();closeModal();renderAll();toast('Lig kaydedildi.')}
function deleteLeague(id){let l=d.leagues.find(x=>x.id===id);if(!l)return;if(d.teams.some(t=>t.league===l.name)){toast('Bu lig bir takımda kullanılıyor. Önce takımdan ligi değiştir.');return}if(!confirm(`${l.name} silinsin mi?`))return;d.leagues=d.leagues.filter(x=>x.id!==id);save();renderAll();toast('Lig silindi.')}
function club(){$('club').innerHTML=`<div class="section-title"><h2>⚙️ Ayarlar</h2></div><div class="card"><h3>🏢 Kulüp</h3><div class="formgrid"><div class="field"><label>Kulüp</label><input id="c_club" value="${esc(d.club)}"></div><div class="field"><label>Antrenör</label><input id="c_coach" value="${esc(d.coach)}"></div><div class="field"><label>Sezon</label><input id="c_season" value="${esc(d.season)}"></div></div><br><button class="btn primary" onclick="saveClub()">💾 Kaydet</button></div><div class="card" style="margin-top:12px"><div class="row between"><h3>🏆 Ligler</h3><button class="btn primary" onclick="openModal('Yeni Lig',leagueForm())">➕ Lig Ekle</button></div><p class="muted">Takım eklerken bu listeden lig seçilir.</p><div class="list">${d.leagues.map(l=>`<div class="item row between"><b>${esc(l.name)}</b><div class="actions"><button class="btn" onclick="openModal('Lig Düzenle',leagueForm(d.leagues.find(x=>x.id==='${l.id}')))">✏️</button><button class="btn danger" onclick="deleteLeague('${l.id}')">🗑️</button></div></div>`).join('')}</div></div><div class="card" style="margin-top:12px"><h3>💾 Veri</h3><div class="actions"><button class="btn" onclick="backup()">⬇️ Yedek Al</button><button class="btn" onclick="archiveCurrentSeason()">🗄️ Sezonu Arşivle</button><button class="btn" onclick="newSeason()">🔄 Yeni Sezon</button><label class="btn">⬆️ Yedek Yükle<input type="file" accept="application/json" hidden onchange="restore(this.files[0])"></label><button class="btn danger" onclick="resetApp()">🗑️ Tüm Veriyi Sıfırla</button></div></div>`}
function saveClub(){d.club=$('c_club').value.trim();d.coach=$('c_coach').value.trim();d.season=$('c_season').value.trim();save();boot();toast('Ayarlar kaydedildi.')}
function backup(){let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='volleyScout-yedek.json';a.click();URL.revokeObjectURL(a.href)}
function restore(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{d=JSON.parse(r.result);save();boot();toast('Yedek yüklendi.')}catch(e){toast('Yedek dosyası okunamadı.')}};r.readAsText(file)}
function archiveCurrentSeason(){let key='volleyScout_archive_'+d.season;let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=key+'.json';a.click();URL.revokeObjectURL(a.href);toast('Sezon arşivi indirildi.')}
function newSeason(){let n=prompt('Yeni sezon (örn. 2027-2028)',d.season);if(!n||n===d.season)return;let old=d.season;d.season=n;d.players=d.players.map(p=>({...p,teamIds:[],teamId:'',schoolGroupId:''}));d.teams=[];d.schoolGroups=[];d.schoolAttendance=[];d.attendance=[];d.trainings=[];d.matches=[];d.tests=[];d.tactics=[];d.messages=[];d.notifications=[];save();boot();toast(old+' → '+n+' geçildi. Aktif sporcular yeni sezona aktarıldı.')}
function resetApp(){if(!confirm('Tüm VolleyScout verileri silinsin mi?'))return;localStorage.removeItem(KEY);location.reload()}
function deleteTestDummy(){}

try{let raw=localStorage.getItem(KEY);if(raw){let old=JSON.parse(raw);if(old&&typeof old==='object')d={...d,...old}}}catch(e){console.warn('Kayıtlı veri okunamadı, güvenli başlangıç yapıldı.',e)}
// Veri şeması güvenliği: eski sürümlerde eksik/bozuk alanlar uygulamanın açılmasını engellemesin.
for(const k of ['players','teams','coaches','schoolGroups','schoolAttendance','attendance','trainings','matches','tests','tactics','messages','notifications'])if(!Array.isArray(d[k]))d[k]=[];
if(!d.season)d.season='2026-2027';
if(!Array.isArray(d.leagues))d.leagues=[];
const _leagueNames=d.leagues.map(x=>typeof x==='string'?x:(x&&x.name?String(x.name):'')).filter(Boolean);
for(const lg of LEAGUES_DEFAULT)if(!_leagueNames.includes(lg))_leagueNames.push(lg);
d.leagues=_leagueNames.map((name,i)=>({id:'lg_'+i+'_'+name.toLowerCase().replace(/[^a-z0-9ğüşöçıİĞÜŞÖÇ]+/gi,'_'),name}));
for(const g of d.schoolGroups){if(!Array.isArray(g.days))g.days=g.day?[g.day]:[];if(!g.time)g.time='';}
save();
boot();

// FINAL PWA cache/version guard
try{if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}}catch(e){}
</script>
