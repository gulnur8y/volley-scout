<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f97316">
<title>VolleyScout TR V4.3 FINAL</title>
<style>
:root{--orange:#f97316;--orange2:#ea580c;--bg:#fff7ed;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#fed7aa;--ok:#16a34a;--bad:#dc2626;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1180px;margin:auto;min-height:100vh}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,var(--orange2),var(--orange),#fb923c);backdrop-filter:blur(12px);border-bottom:0;padding:12px 18px;display:flex;align-items:center;gap:12px;color:#fff;box-shadow:0 5px 18px rgba(194,65,12,.18)}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--orange),#fb923c);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:800}.top h1{font-size:18px;margin:0}.top small{color:var(--muted)}.spacer{flex:1}
.iconbtn,.btn{border-radius:12px;padding:10px 13px;background:#fff;border:1px solid var(--line);color:var(--ink)}
.top .iconbtn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}.top .logo{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3)}.top h1{color:#fff}.top small{color:rgba(255,255,255,.9)}.primary{background:var(--orange);color:#fff;border-color:var(--orange)}.danger{background:#fff;color:var(--bad);border-color:#fecaca}.ghost{background:transparent}
main{padding:18px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 5px 20px rgba(124,45,18,.06)}.card h3{margin:0 0 8px}.muted{color:var(--muted)}.hero{background:linear-gradient(135deg,#fff1e6,#fff);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}.hero h2{margin:0 0 6px;font-size:28px}.section-title{display:flex;align-items:center;gap:10px;margin:22px 0 12px}.section-title h2{margin:0;font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.tile{padding:18px;border-radius:18px;background:#fff;border:1px solid var(--line);text-align:left;min-height:100px}.tile b{display:block;margin-top:8px}.tile span{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #fdba74;border-radius:11px;background:#fff}.field textarea{min-height:90px;resize:vertical}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:9px 10px;border-bottom:1px solid #ffedd5;text-align:left;font-size:13px}th{background:#fff7ed;position:sticky;top:0}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#ffedd5;color:#9a3412;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#ffedd5;display:grid;place-items:center;color:#9a3412;font-weight:800}.avatar.big{width:88px;height:88px;font-size:28px}
.nav{display:none !important}.nav button{padding:9px 4px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:12px}.nav button.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px}.close{float:right}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;z-index:50}.drawer.show{display:block}.drawerSheet{width:min(360px,88%);height:100%;overflow:auto;background:#fff;padding:18px;box-shadow:8px 0 30px rgba(0,0,0,.16)}.drawerNav{display:grid;gap:8px}.drawerNav button{text-align:left;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}.toast{position:fixed;right:16px;bottom:78px;background:#111827;color:#fff;padding:12px 15px;border-radius:12px;display:none;z-index:30}.toast.show{display:block}
.setup{min-height:100vh;display:grid;place-items:center;padding:20px}.setup .card{width:min(520px,100%)}.hidden{display:none!important}.stat{font-size:28px;font-weight:800}.score{font-size:42px;font-weight:900}.court{height:390px;border-radius:16px;background:#fb923c;border:6px solid #fff;box-shadow:inset 0 0 0 2px #9a3412;position:relative;overflow:hidden}.court:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid #fff}.court:after{content:"";position:absolute;left:14%;right:14%;top:22%;height:56%;border:3px solid #fff}.playerdot{position:absolute;width:42px;height:42px;border-radius:50%;background:#fff;color:#9a3412;display:grid;place-items:center;font-weight:800;box-shadow:0 3px 8px #7c2d1255;touch-action:none}
@media(min-width:900px){.modal{align-items:center}.sheet{border-radius:22px}}
.playerdot.selected{outline:4px solid #f97316;outline-offset:3px;transform:scale(1.08)}.playerdot{cursor:grab;user-select:none;-webkit-user-select:none}

.drawerSheet{border-top:6px solid var(--orange)}.drawerNav button{width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);background:#fff;border-radius:12px;color:var(--ink);font-size:15px}.drawerNav button.active{background:var(--orange);color:#fff;border-color:var(--orange)}
</style>

<style>
.skill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.skill-chip{display:flex;align-items:center;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick-btn{min-height:64px;border-radius:16px;font-size:18px;font-weight:800;background:#fff;border:2px solid var(--line)}.quick-btn.orange{background:#fff7ed;border-color:#fb923c}.quick-btn.blue{background:#eff6ff;border-color:#93c5fd}.reason-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.reason-btn{padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:#fff}.reason-btn.active{background:#f97316;color:#fff;border-color:#f97316}.analysis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.mini-stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.setbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.setbadge{padding:7px 10px;border-radius:999px;background:#fff;border:1px solid var(--line)}
</style>
</head>
<body>
<div id="setup" class="setup">
  <div class="card">
    <div class="logo">🏐</div><h1>VolleyScout TR <span class="badge">V4.3 FINAL</span></h1>
    <p class="muted">Voleybol antrenör asistanı. İlk kurulumdan sonra kulübünü hatırlar.</p>
    <div class="field"><label>Ad Soyad</label><input id="setupCoach" placeholder="Antrenör adı"></div>
    <div class="field"><label>Kulüp / Spor Okulu adı</label><input id="setupClub" placeholder="Örn. Yıldız Spor"></div>
    <div class="field"><label>Sezon</label><input id="setupSeason" value="2026-2027"></div>
    <br><button class="btn primary" style="width:100%" onclick="finishSetup()">🚀 VolleyScout'u Başlat</button>
  </div>
</div>

<div id="app" class="app hidden">
<header class="top"><button class="iconbtn" onclick="toggleMenu()" aria-label="Menü">☰</button><button id="backBtn" class="iconbtn hidden" onclick="goBack()" aria-label="Geri">←</button><div class="logo">🏐</div><div><h1 id="brand">VolleyScout TR</h1><small id="subbrand">Antrenör paneli</small></div><div class="spacer"></div><button class="iconbtn" onclick="showView('notifications')">🔔 <span id="notifCount">0</span></button></header>
<main>
<section id="home" class="view active"></section>
<section id="athletes" class="view"></section>
<section id="teams" class="view"></section>
<section id="coaches" class="view"></section>
<section id="school" class="view"></section>
<section id="attendance" class="view"></section>
<section id="training" class="view"></section>
<section id="matches" class="view"></section>
<section id="tests" class="view"></section>
<section id="tactics" class="view"></section>
<section id="messages" class="view"></section>
<section id="reports" class="view"></section>
<section id="club" class="view"></section>
<section id="notifications" class="view"></section>
</main>
<nav class="nav" id="nav"></nav><div id="drawer" class="drawer" onclick="if(event.target===this)toggleMenu()"><div class="drawerSheet"><div class="row between"><h2>☰ Menü</h2><button class="btn" onclick="toggleMenu()">✕</button></div><div id="drawerNav" class="drawerNav"></div></div></div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="btn close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const KEY='volleyscout_v30';
const CATS=['Mini','Midi','Küçük','Yıldız'], GROUPS=['A','B','C','1','2','3'];
const DAYS=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const LEAGUES_DEFAULT=['Özel Lig','Süper Lig','1. Lig','2. Lig','Gelişim Ligi'];
const TECH=['Pas','Manşet','Servis','Hücum','Blok','Defans'];
const TEST_GROUPS={
 'Teknik Beceri':[
  ['Pas Testi','/10','teknik'],['Manşet Testi','/10','teknik'],['Servis Testi','/10','teknik'],
  ['Hücum Testi','/10','teknik'],['Blok Testi','/10','teknik'],['Defans Testi','/10','teknik']
 ],
 'Antropometrik':[['Boy','cm','antropometrik'],['Kilo','kg','antropometrik'],['Kulaç','cm','antropometrik']],
 'Hız':[['10 m Sprint','sn','hız'],['20 m Sprint','sn','hız']],
 'Çeviklik':[['T Testi','sn','çeviklik'],['Y Testi','sn','çeviklik']],
 'Kuvvet':[['Plank','sn','kuvvet'],['Durarak Uzun Atlama','cm','kuvvet'],['Dikey Sıçrama','cm','sıçrama'],['Hücum Sıçraması','cm','sıçrama']],
 'Dayanıklılık':[['Yo-Yo / Mekik','seviye','dayanıklılık']],
 'Esneklik':[['Esneklik','cm','esneklik']]
};
const TESTS=Object.entries(TEST_GROUPS).flatMap(([group,items])=>items.map(x=>[x[0],x[1],group]));
const DEFAULT_DATA={club:null,coach:null,season:'2026-2027',players:[],teams:[],coaches:[],schoolGroups:[],schoolAttendance:[],attendance:[],trainings:[],matches:[],tests:[],tactics:[],messages:[],notifications:[],leagues:LEAGUES_DEFAULT.slice()};
function loadData(){
 let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
 let saved=null;try{saved=raw?JSON.parse(raw):null}catch(e){saved=null}
 const x=Object.assign({},DEFAULT_DATA,saved||{});
 for(const k of ['players','teams','coaches','schoolGroups','schoolAttendance','attendance','trainings','matches','tests','tactics','messages','notifications']) { if(!Array.isArray(x[k])) x[k]=[]; else x[k]=x[k].filter(v=>v!==null&&v!==undefined&&typeof v==='object'); }
 if(!Array.isArray(x.leagues))x.leagues=[];
 if(x.leagues.length && x.leagues.some(v=>typeof v!=='object')) x.leagues=x.leagues.map(v=>typeof v==='string'?{id:uid('lg'),name:v}:v).filter(Boolean);
 if(!Array.isArray(x.leagues)||!x.leagues.length)x.leagues=LEAGUES_DEFAULT.slice();
 x.season=x.season||'2026-2027';
 x.players.forEach(p=>{if(!Array.isArray(p.teamIds))p.teamIds=p.teamId?[p.teamId]:[];p.teamId=p.teamIds[0]||'';});
 x.teams.forEach(t=>{if(!Array.isArray(t.days))t.days=t.day?[t.day]:[];if(t.league&&typeof t.league==='object')t.league=t.league.name||'';if(!t.time)t.time='';if(!t.headCoachId)t.headCoachId='';if(!t.assistantCoachId)t.assistantCoachId='';});
 x.schoolGroups.forEach(g=>{if(!Array.isArray(g.days))g.days=g.day?[g.day]:[];if(!g.time)g.time='';});
 x.trainings.forEach(t=>{if(!Array.isArray(t.skills))t.skills=[];if(!t.time){let tm=x.teams.find(z=>z.id===t.teamId);t.time=tm?.time||'';}});
 x.matches.forEach(m=>{if(!Array.isArray(m.points))m.points=[];if(!m.currentSet)m.currentSet=1;for(const pt of m.points)if(!pt.set)pt.set=1;});
 x.tactics.forEach(t=>{if(!Array.isArray(t.players))t.players=[];});
 return x;
}
let d=loadData();
let state={view:'home',prevView:'home',editId:null,selectedPlayer:null,selectedTeam:null,selectedMatch:null,testPlayer:'',tacticSelected:null,month:new Date().toISOString().slice(0,7),attTeam:''};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){console.warn('Veri kaydedilemedi.',e)}}
function uid(p='x'){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function playerTeamIds(p){return Array.isArray(p.teamIds)?p.teamIds:(p.teamId?[p.teamId]:[])}
function playerTeams(p){return playerTeamIds(p).map(id=>d.teams.find(t=>t.id===id)).filter(Boolean)}
function teamPlayers(id){return d.players.filter(p=>playerTeamIds(p).includes(id))}
function finishSet(id){let m=d.matches.find(x=>x.id===id);if(!m)return;normalizeMatchPoints(m);let max=Number(m.sets)||3;if((m.currentSet||1)>=max)return toast('Seçilen tüm setler tamamlandı.');m.currentSet=(m.currentSet||1)+1;save();liveMatch(id);toast((m.currentSet-1)+'. set tamamlandı. '+m.currentSet+'. sete geçildi.')}
function finishSetup(){let coach=$('setupCoach')?.value.trim()||'',club=$('setupClub')?.value.trim()||'';if(!coach||!club)return toast('Antrenör adı ve kulüp adı gerekli.');d.club=club;d.coach=coach;d.season=$('setupSeason')?.value.trim()||'2026-2027';save();boot();toast('VolleyScout hazır.')}
function boot(){if(!d.club){$('setup').classList.remove('hidden');$('app').classList.add('hidden');return}$('setup').classList.add('hidden');$('app').classList.remove('hidden');$('brand').textContent=d.club;$('subbrand').textContent=d.coach+' • '+d.season;renderNav();renderAll();showView(state.view||'home')}
function showView(v){if(!$(v))return;let prev=state.view;state.view=v;state.prevView=prev;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');document.querySelectorAll('.nav button,.drawerNav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));$('backBtn').classList.toggle('hidden',v==='home');render(v);if($('drawer').classList.contains('show'))toggleMenu()}
function goBack(){showView(state.prevView&&state.prevView!==state.view?state.prevView:'home')}
function toggleMenu(){$('drawer').classList.toggle('show')}
function renderNav(){let items=[['home','🏠','Ana'],['coaches','🧑‍🏫','Antrenörler'],['teams','🏐','Takımlar'],['athletes','👥','Sporcular'],['school','🏫','Spor Okulu'],['attendance','📝','Yoklama'],['training','🏋️','Antrenman'],['matches','🏐','Maçlar'],['tests','🧪','Testler'],['tactics','🧠','Taktik'],['messages','💬','İletişim'],['reports','📊','Raporlar'],['notifications','🔔','Bildirimler'],['club','⚙️','Ayarlar']];let make=x=>`<button data-v="${x[0]}" onclick="showView('${x[0]}')">${x[1]}<br>${x[2]}</button>`;$('nav').innerHTML=items.map(make).join('');$('drawerNav').innerHTML=items.map(x=>`<button data-v="${x[0]}" onclick="showView('${x[0]}')">${x[1]} ${x[2]}</button>`).join('')}
function renderAll(){['home','athletes','teams','coaches','school','attendance','training','matches','tests','tactics','messages','reports','club','notifications'].forEach(render);$('notifCount').textContent=d.notifications.filter(n=>!n.read).length}
function render(v){if(!$(`${v}`))return;let fn=({home:home,athletes:athletes,teams:teams,coaches:coaches,school:school,attendance:attendance,training:training,matches:matches,tests:tests,tactics:tactics,messages:messages,reports:reports,club:club,notifications:notifications}[v]);if(typeof fn!=='function')return;try{fn()}catch(e){console.error('VolleyScout bölüm hatası:',v,e);$(v).innerHTML=`<div class="card"><h2>⚠️ ${esc(v)} bölümü açılırken bir sorun oluştu.</h2><p class="muted">Veriler korunuyor. Bölüm güvenli modda açılmayı denedi.</p><button class="btn primary" onclick="location.reload()">🔄 Yenile</button></div>`}}
function greeting(){let h=new Date().getHours();return h<6?'İyi geceler':h<12?'Günaydın':h<18?'İyi çalışmalar':'İyi akşamlar'}
function home(){let today=new Date().toISOString().slice(0,10),trs=d.trainings.filter(t=>t.date===today),up=d.matches.filter(m=>m.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,2),pending=d.notifications.filter(n=>!n.read).length;$('home').innerHTML=`<div class="hero"><h2>${greeting()} ${esc(d.coach)} 👋</h2><div class="muted">${esc(d.club)} • ${esc(d.season)}</div><div class="grid" style="margin-top:14px"><div><div class="stat">${d.players.length}</div><div class="muted">Sporcu</div></div><div><div class="stat">${d.teams.length}</div><div class="muted">Takım</div></div><div><div class="stat">${d.trainings.length}</div><div class="muted">Antrenman</div></div><div><div class="stat">${pending}</div><div class="muted">Okunmamış</div></div></div></div>
<div class="section-title"><h2>⚡ Hızlı İşlemler</h2><span class="muted">Diğer tüm bölümler ☰ menüde</span></div>
<div class="tiles">
${[['training','🏋️','Antrenman Ekle','Yeni antrenman planla'],['matches','🏐','Maç Başlat','Hızlı canlı maç analizi'],['attendance','📝','Yoklama','Takım yoklamasını aç'],['tests','🧪','Test Gir','Sporcu test merkezine git']].map(t=>`<button class="tile" onclick="showView('${t[0]}')">${t[1]}<b>${t[2]}</b><span>${t[3]}</span></button>`).join('')}</div>
<div class="section-title"><h2>Bugün</h2></div><div class="list">${trs.length?trs.map(t=>`<div class="item"><b>🏋️ ${esc(t.title)}</b><div class="muted">${t.time||''} • ${esc(t.team||'')}</div></div>`).join(''):'<div class="card muted">Bugün planlanmış antrenman yok.</div>'}</div>
<div class="section-title"><h2>Yaklaşan Maçlar</h2></div><div class="list">${up.length?up.map(m=>`<div class="item"><b>🏐 ${esc(m.team)} — ${esc(m.opponent)}</b><div class="muted">${m.date} ${m.time||''} • ${esc(m.venue||'')}</div></div>`).join(''):'<div class="card muted">Yaklaşan maç yok.</div>'}</div>`}
function openModal(title,body){$('modalBody').innerHTML=`<h2>${title}</h2>${body}`;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show');state.editId=null}
function athleteForm(p={}){let ids=playerTeamIds(p);return `<div class="formgrid">
<div class="field"><label>Ad Soyad</label><input id="f_name" value="${esc(p.name)}"></div><div class="field"><label>Forma No</label><input id="f_no" value="${esc(p.no)}"></div>
<div class="field"><label>Mevki</label><select id="f_pos">${['Pasör','Smaçör','Orta','Libero','Pasör Çaprazı','Diğer'].map(x=>`<option ${x===p.position?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Doğum Tarihi</label><input type="date" id="f_birth" value="${esc(p.birth)}"></div><div class="field"><label>Boy (cm)</label><input id="f_height" value="${esc(p.height)}"></div><div class="field"><label>Kilo (kg)</label><input id="f_weight" value="${esc(p.weight)}"></div>
<div class="field" style="grid-column:1/-1"><label>Fotoğraf</label><input type="file" id="f_photo" accept="image/*"></div>
<div class="field" style="grid-column:1/-1"><label>Takımlar — birden fazla seçilebilir</label><div class="card">${d.teams.map(t=>`<label style="display:block;margin:7px 0"><input class="tmcheck" type="checkbox" value="${t.id}" ${ids.includes(t.id)?'checked':''}> ${esc(t.name)} <span class="muted">• ${esc(t.category)}</span></label>`).join('')||'<span class="muted">Önce takım oluştur.</span>'}</div></div>
<div class="field" style="grid-column:1/-1"><label>Spor Okulu Grubu</label><select id="f_school"><option value="">Yok</option>${d.schoolGroups.map(g=>`<option value="${g.id}" ${g.id===p.schoolGroupId?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div>
<div class="field" style="grid-column:1/-1"><label>Not</label><textarea id="f_note">${esc(p.note)}</textarea></div></div>
<br><div class="actions"><button class="btn primary" onclick="saveAthlete('${p.id||''}')">💾 Kaydet</button>${p.id?`<button class="btn danger" onclick="deleteAthlete('${p.id}')">🗑️ Sil</button>`:''}</div>`}

function teamForm(t={}){let cats=[...new Set([t.category,...CATS].filter(Boolean))],leagues=Array.isArray(d.leagues)&&d.leagues.length?d.leagues:LEAGUES_DEFAULT.map((name,i)=>({id:'lg_default_'+i,name}));let td=Array.isArray(t.days)?t.days:(t.day?[t.day]:[]);let head=t.headCoachId||'',assistant=t.assistantCoachId||'';return `<div class="formgrid"><div class="field"><label>Kategori</label><select id="t_cat">${cats.map(x=>`<option ${x===(t.category||'Yıldız')?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Grup</label><select id="t_group">${GROUPS.map(x=>`<option ${x===(t.group||'A')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Takım adı</label><input id="t_name" value="${esc(t.name)}" placeholder="Yıldız A"></div><div class="field"><label>🏆 Lig</label><select id="t_league">${leagues.map(x=>{let n=typeof x==='string'?x:(x&&x.name?String(x.name):'');return `<option value="${esc(n)}" ${n===(t.league||((leagues[0]&&typeof leagues[0]==='object')?leagues[0].name:leagues[0]))?'selected':''}>${esc(n)}</option>`}).join('')}</select></div><div class="field"><label>👨‍🏫 Baş antrenör</label><select id="t_headCoach"><option value="">Seçilmedi</option>${d.coaches.map(c=>`<option value="${c.id}" ${c.id===head?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>🧑‍🏫 Yardımcı antrenör</label><select id="t_assistantCoach"><option value="">Seçilmedi</option>${d.coaches.map(c=>`<option value="${c.id}" ${c.id===assistant?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Eski Antrenör adı</label><input id="t_coach" value="${esc(t.coach||'')}" placeholder="İsteğe bağlı"></div><div class="field"><label>⏰ Takım saati</label><input type="time" id="t_time" value="${esc(t.time||'')}"></div><div class="field"><label>📅 Antrenman günleri (2–4)</label><div>${DAYS.map(x=>`<label style="display:inline-block;margin:5px 10px 5px 0"><input class="tdcheck" type="checkbox" value="${x}" ${td.includes(x)?"checked":""}> ${x}</label>`).join("")}</div></div></div><p class="muted">Lig: ${leagues.map(x=>esc(typeof x==='string'?x:(x&&x.name?String(x.name):''))).join(' • ')}</p><br><div class="actions"><button class="btn primary" onclick="saveTeam('${t.id||''}')">💾 Kaydet</button>${t.id?`<button class="btn danger" onclick="deleteTeam('${t.id}')">🗑️ Sil</button>`:''}</div>`}
function saveTeam(id){let t=id?d.teams.find(x=>x.id===id):{id:uid('t')};t.category=$('t_cat').value;t.group=$('t_group').value;t.name=$('t_name').value.trim()||`${t.category} ${t.group}`;t.league=$('t_league').value;t.coach=$('t_coach')?.value.trim()||'';t.headCoachId=$('t_headCoach')?.value||'';t.assistantCoachId=$('t_assistantCoach')?.value||'';t.days=[...document.querySelectorAll('.tdcheck:checked')].map(x=>x.value).slice(0,4);t.time=$('t_time')?.value||'';if(!id)t.created=new Date().toISOString();if(!id)d.teams.push(t);save();closeModal();renderAll();toast('Takım kaydedildi.')}

function teams(){$('teams').innerHTML=`<div class="section-title"><h2>🏐 Takımlar</h2><div class="spacer"></div><button class="btn primary" onclick="openModal('Yeni Takım',teamForm())">➕ Takım Ekle</button></div><div class="grid">${d.teams.map(t=>`<div class="card"><div class="row between"><div><span class="badge">${esc(t.category)}</span> <span class="badge">${esc(t.group)}</span><h3>${esc(t.name)}</h3><div><span class="badge">🏆 ${esc(t.league||'Lig seçilmedi')}</span></div><div class="muted">${teamPlayers(t.id).length} sporcu • ${esc(d.season)}</div><div class="muted">👨‍🏫 Baş: ${esc(d.coaches.find(c=>c.id===t.headCoachId)?.name||t.coach||'Atanmadı')} • Yardımcı: ${esc(d.coaches.find(c=>c.id===t.assistantCoachId)?.name||'Atanmadı')}</div><div class="muted">📅 ${esc((t.days||[]).join(', ')||'Gün seçilmedi')} • ⏰ ${esc(t.time||'Manuel saat')}</div></div><div>🏐</div></div><br><div class="actions"><button class="btn" onclick="teamDetail('${t.id}')">👥 Aç</button><button class="btn" onclick="openModal('Takım Düzenle',teamForm(d.teams.find(x=>x.id==='${t.id}')))">✏️</button><button class="btn danger" onclick="deleteTeam('${t.id}')">🗑️</button></div></div>`).join('')||'<div class="card muted">Henüz takım yok.</div>'}</div>`}

function saveCoach(id){let c=id?d.coaches.find(x=>x.id===id):{id:uid('co')};c.name=$('co_name').value.trim();if(!c.name)return toast('Antrenör adı gir.');c.role=$('co_role').value;c.phone=$('co_phone').value.trim();if(!id)d.coaches.push(c);save();closeModal();renderAll();toast('Antrenör kaydedildi.')}
function deleteCoach(id){if(d.teams.some(t=>t.headCoachId===id||t.assistantCoachId===id)){toast('Bu antrenör bir takıma atanmış. Önce takım atamasını değiştir.');return}if(!confirm('Antrenör silinsin mi?'))return;d.coaches=d.coaches.filter(c=>c.id!==id);save();renderAll();toast('Antrenör silindi.')}
function coaches(){$('coaches').innerHTML=`<div class="section-title"><h2>🧑‍🏫 Antrenörler</h2><div class="spacer"></div><button class="btn primary" onclick="openModal('Yeni Antrenör',coachForm())">➕ Antrenör Ekle</button></div><div class="grid">${d.coaches.map(c=>`<div class="card"><h3>${esc(c.name)}</h3><div class="muted">${esc(c.role||'')}</div><div>${esc(c.phone||'')}</div><br><div class="actions"><button class="btn" onclick="openModal('Antrenör Düzenle',coachForm(d.coaches.find(x=>x.id==='${c.id}')))">✏️</button><button class="btn danger" onclick="deleteCoach('${c.id}')">🗑️</button></div></div>`).join('')||'<div class="card muted">Henüz antrenör eklenmedi.</div>'}</div>`}

function schoolForm(g={}){
 let days=Array.isArray(g.days)?g.days:(g.day?[g.day]:[]);
 return `<div class="field"><label>Grup adı</label><input id="sg_name" value="${esc(g.name)}" placeholder="Spor Okulu Grubu"></div>
 <div class="field"><label>Günler — 2–4 gün seç</label><div>${DAYS.map((x,i)=>`<label style="display:inline-block;margin:5px 10px 5px 0"><input class="sg_daycheck" type="checkbox" value="${x}" ${days.includes(x)?'checked':''}> ${i+1} - ${x}</label>`).join('')}</div><div class="muted">Örnek: 2 - Salı, 4 - Perşembe, 5 - Cuma</div></div>
 <div class="field"><label>⏰ Saat</label><input type="time" id="sg_time" value="${esc(g.time||((d.schoolGroups.find(x=>x.time)||{}).time)||'17:00')}" required></div>
 <br><button class="btn primary" onclick="saveSchool('${g.id||''}')">💾 Kaydet</button>`
}
function saveSchool(id){
 let g=id?d.schoolGroups.find(x=>x.id===id):{id:uid('sg')};
 let selected=[...document.querySelectorAll('.sg_daycheck:checked')].map(x=>x.value);
 if(selected.length<2||selected.length>4)return toast('Spor okulu için 2–4 gün seçmelisin.');
 let time=$('sg_time').value||g.time||'';
 if(!time)return toast('Spor okulu saatini gir.');
 g.name=$('sg_name').value.trim()||'Spor Okulu Grubu';g.days=selected;g.day=selected[0]||'';g.time=time;
 if(!id)d.schoolGroups.push(g);save();closeModal();renderAll();toast('Spor okulu grubu kaydedildi.')
}
function school(){let groups=d.schoolGroups; $('school').innerHTML=`<div class="section-title"><h2>🏫 Spor Okulu</h2><div class="spacer"></div><button class="btn primary" onclick="openModal('Yeni Spor Okulu Grubu',schoolForm())">➕ Grup Ekle</button></div><p class="muted">Takımlardan bağımsız sporcu, <b>grup yoklaması</b> ve test takibi.</p><div class="card" style="margin-bottom:14px;border:2px solid #fdba74;background:#fff7ed"><div class="row"><div style="font-size:26px">📝</div><div style="flex:1"><b>Spor Okulu Yoklaması</b><div class="muted">Grup seç → o gruptaki tüm sporcuları tek listede gör → gün gün yoklama al.</div></div></div>${groups.length?`<div class="actions" style="margin-top:12px">${groups.map(g=>`<button class="btn primary" onclick="schoolAttendance('${g.id}')">📝 ${esc(g.name)} Yoklaması</button>`).join('')}</div>`:'<div class="muted" style="margin-top:10px">Önce bir Spor Okulu grubu oluştur.</div>'}</div><div class="grid">${groups.map(g=>`<div class="card"><h3>${esc(g.name)}</h3><div class="muted">${esc((g.days||[g.day]).join(', '))} • ⏰ ${esc(g.time||'')}</div><div class="stat">${d.players.filter(p=>p.schoolGroupId===g.id).length}</div><div class="muted">sporcu</div><br><div class="actions"><button class="btn primary" onclick="schoolAttendance('${g.id}')">📝 Yoklama</button><button class="btn" onclick="schoolDetail('${g.id}')">👥 Sporcular</button><button class="btn" onclick="openModal('Grup Düzenle',schoolForm(d.schoolGroups.find(x=>x.id==='${g.id}')))">✏️</button><button class="btn danger" onclick="deleteSchool('${g.id}')">🗑️</button></div></div>`).join('')||'<div class="card muted">Henüz spor okulu grubu yok.</div>'}</div>`}
function schoolDetail(id){let g=d.schoolGroups.find(x=>x.id===id),ps=d.players.filter(p=>p.schoolGroupId===id);openModal('🏫 '+esc(g.name),`<div class="row"><span class="badge">${esc((g.days||[g.day]).join(', '))}</span><span class="badge">⏰ ${esc(g.time||'')}</span></div><div class="actions" style="margin:12px 0"><button class="btn primary" onclick="schoolAttendance('${id}')">📝 Grup Yoklaması</button></div><h3>Sporcular</h3><div class="list">${ps.map(p=>`<div class="item row"><div class="avatar">${esc((p.name||'?')[0])}</div><b>${esc(p.name)}</b><div class="spacer"></div><button class="btn" onclick="profile('${p.id}')">Profil</button></div>`).join('')||'<div class="muted">Sporcu yok.</div>'}</div>`)}
function schoolAttendanceDates(month,g){let y=Number(month.slice(0,4)),m=Number(month.slice(5,7)),daysInMonth=new Date(y,m,0).getDate(),allowed=Array.isArray(g.days)&&g.days.length?g.days:(g.day?[g.day]:DAYS);return Array.from({length:daysInMonth},(_,i)=>{let date=new Date(y,m-1,i+1),day=DAYS[(date.getDay()+6)%7];return allowed.includes(day)?{date:`${month}-${String(i+1).padStart(2,'0')}`,day}:null}).filter(Boolean)}
function schoolAttendance(groupId){let g=d.schoolGroups.find(x=>x.id===groupId);if(!g)return;let month=state.schoolMonth||new Date().toISOString().slice(0,7),ps=d.players.filter(p=>p.schoolGroupId===groupId),dates=schoolAttendanceDates(month,g);openModal('📝 '+esc(g.name)+' • Yoklama',`<div class="formgrid"><div class="field"><label>Ay</label><input type="month" value="${month}" onchange="state.schoolMonth=this.value;schoolAttendance('${groupId}')"></div><div class="field"><label>⏰ Grup saati</label><input type="time" value="${esc(g.time||'')}" disabled></div></div><div class="muted" style="margin:10px 0">${dates.length} antrenman günü • ${ps.length} sporcu</div>${dates.map(dt=>{return `<div class="card" style="margin-bottom:12px"><div class="section-title"><h3>📅 ${dt.date.split('-').reverse().join('.')} • ${dt.day}</h3><div class="muted">⏰ ${esc(g.time||'')}</div></div><div class="actions" style="margin-bottom:10px"><button class="btn" onclick="bulkSchoolAttendance('${groupId}','${dt.date}','G')">🟢 Tümünü Geldi</button><button class="btn" onclick="bulkSchoolAttendance('${groupId}','${dt.date}','Y')">🔴 Tümünü Gelmedi</button></div>${ps.map(p=>{let a=d.schoolAttendance.find(x=>x.groupId===groupId&&x.playerId===p.id&&x.date===dt.date),v=a?.status||'';return `<div class="item row"><div style="flex:1"><b>${esc(p.name)}</b>${p.no?`<div class="muted">#${esc(p.no)}</div>`:''}</div><div class="actions"><button class="btn ${v==='G'?'primary':''}" onclick="setSchoolAttendance('${groupId}','${p.id}','${dt.date}','G')">✅</button><button class="btn ${v==='Y'?'danger':''}" onclick="setSchoolAttendance('${groupId}','${p.id}','${dt.date}','Y')">❌</button><button class="btn ${v==='GEC'?'primary':''}" onclick="setSchoolAttendance('${groupId}','${p.id}','${dt.date}','GEC')">🟡</button><button class="btn ${v==='I'?'primary':''}" onclick="setSchoolAttendance('${groupId}','${p.id}','${dt.date}','I')">🔵</button></div></div>`}).join('')||'<div class="muted">Bu grupta sporcu yok.</div>'}</div>`}).join('')||'<div class="card muted">Bu ay için seçili gün yok.</div>'}`)}
function setSchoolAttendance(groupId,playerId,date,status){let a=d.schoolAttendance.find(x=>x.groupId===groupId&&x.playerId===playerId&&x.date===date);if(!a){a={id:uid('sat'),groupId,playerId,date,status};d.schoolAttendance.push(a)}else a.status=status;save();schoolAttendance(groupId)}
function bulkSchoolAttendance(groupId,date,status){let ps=d.players.filter(p=>p.schoolGroupId===groupId);ps.forEach(p=>{let a=d.schoolAttendance.find(x=>x.groupId===groupId&&x.playerId===p.id&&x.date===date);if(!a)d.schoolAttendance.push({id:uid('sat'),groupId,playerId:p.id,date,status});else a.status=status});save();schoolAttendance(groupId);toast('Spor okulu yoklaması toplu güncellendi.')}

 };

function normalizeMatchPoints(m){

  if(!p.set)p.set=1;

  if(!p.action)p.action=p.reason||'Diğer';
  if(!p.event){
   if(p.result==='biz_sayi')p.event=(p.action||'').startsWith('Rakip Hatası')?'a_forced':'a_score';
   else if(p.result==='biz_hata')p.event='a_error';

}

function finishSet(id,winner){
 let m=d.matches.find(x=>x.id===id);if(!m)return;
 normalizeMatchPoints(m);
 if(m.finished)return toast('Bu maç zaten tamamlandı.');
 let current=m.currentSet||1,max=Number(m.sets)||3;
 m.setResults=Array.isArray(m.setResults)?m.setResults:[];
 if(m.setResults.some(x=>x.set===current))return toast(current+'. set zaten tamamlandı.');
 let score=matchScore(m,current);
 m.setResults.push({set:current,biz:score[0],rakip:score[1],winner:winner||''});
 if(current>=max){
   m.finished=true;m.finishedAt=new Date().toISOString();m.winner=winner||'';
   save();liveMatch(id);toast(current+'. set tamamlandı. Maç bitirildi.');return;
 }
 m.currentSet=current+1;
 save();liveMatch(id);toast(current+'. seti tamamlandı. '+m.currentSet+'. sete geçildi.');
}
function finishMatch(id){
 let m=d.matches.find(x=>x.id===id);if(!m)return;
 if(m.finished)return toast('Bu maç zaten tamamlandı.');
 if(!confirm('Maçı şimdi bitirmek istediğine emin misin?'))return;
 normalizeMatchPoints(m);
 m.finished=true;m.finishedAt=new Date().toISOString();
 let wins=(m.setResults||[]).reduce((a,x)=>{if(x.winner==='biz')a.biz++;if(x.winner==='rakip')a.rakip++;return a},{biz:0,rakip:0});
 m.winner=wins.biz>wins.rakip?'biz':wins.rakip>wins.biz?'rakip':'';
 save();liveMatch(id);toast('Maç tamamlandı.');
}
function pointRow(p,m){let name=p.playerId?(d.players.find(x=>x.id===p.playerId)?.name||''):'Oyuncusuz / Rakip',side=p.event?.startsWith('b_')?(m.internal?m.team2:m.opponent):m.team;return `<div class="item"><b>${eventLabel(p.event||p.result,m)}</b> • ${esc(name)} • <strong>${esc(p.action||p.reason||'Diğer')}</strong><div class="muted">${p.set||1}. set • ${p.time||''} • ${esc(side)}</div></div>`}
function addPoint(id){let m=d.matches.find(x=>x.id===id);if(!m)return;let result=$('pt_side')?.value==='biz'?'biz_sayi':'rakip_sayi',player=$('pt_player')?.value||'',action=$('pt_reason')?.value||'Diğer';m.points.push({id:uid('pt'),side:result==='biz_sayi'?'biz':'rakip',result,playerId:player,action,reason:action,time:new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}),set:m.currentSet||1});save();liveMatch(id);toast('Sayı kaydedildi.')}
function undoPoint(id){let m=d.matches.find(x=>x.id===id);if(!m||!m.points.length)return toast('Geri alınacak kayıt yok.');m.points.pop();save();liveMatch(id);toast('Son kayıt geri alındı.')}
function matchAnalysis(id){
 let m=d.matches.find(x=>x.id===id);if(!m)return;normalizeMatchPoints(m);
 let sides=[{name:m.team,side:'a',players:teamPlayers(m.teamId)}];if(m.internal)sides.push({name:m.team2,side:'b',players:teamPlayers(m.team2Id)});
 let total=m.points.length||1;
 function statsForPlayer(p,sideKey){
  let mine=m.points.filter(x=>x.playerId===p.id);
  let scored=mine.filter(x=>x.event===(sideKey==='a'?'a_score':'b_score')).length;
  let forced=mine.filter(x=>x.event===(sideKey==='a'?'a_forced':'b_forced')).length;
  let errors=mine.filter(x=>x.event===(sideKey==='a'?'a_error':'b_error')).length;
  let opponentPoints=mine.filter(x=>x.event===(sideKey==='a'?'b_score':'a_score')).length+mine.filter(x=>x.event===(sideKey==='a'?'b_forced':'a_forced')).length;
  let scoring={},erroring={},forcedTypes={};
  mine.filter(x=>x.event===(sideKey==='a'?'a_score':'b_score')).forEach(x=>{let a=x.action||'Diğer';scoring[a]=(scoring[a]||0)+1});
  mine.filter(x=>x.event===(sideKey==='a'?'a_error':'b_error')).forEach(x=>{let a=x.action||'Diğer';erroring[a]=(erroring[a]||0)+1});
  mine.filter(x=>x.event===(sideKey==='a'?'a_forced':'b_forced')).forEach(x=>{let a=x.action||'Diğer';forcedTypes[a]=(forcedTypes[a]||0)+1});
  let involvement=mine.length/total*100,sidePoints=m.points.filter(x=>{let e=x.event||x.result;return eventPointWinner(e)===sideKey}).length||1;
  let contribution=Math.max(0,Math.min(100,(scored+forced-errors)/sidePoints*100)),efficiency=scored+forced-errors,errorRate=mine.length?errors/mine.length*100:0,sets={};
  for(let sn=1;sn<=(Number(m.sets)||3);sn++){let sp=mine.filter(x=>(x.set||1)===sn);sets[sn]={scored:sp.filter(x=>x.event===(sideKey==='a'?'a_score':'b_score')).length,forced:sp.filter(x=>x.event===(sideKey==='a'?'a_forced':'b_forced')).length,errors:sp.filter(x=>x.event===(sideKey==='a'?'a_error':'b_error')).length,actions:sp.length};}
  return {p,mine,scored,forced,errors,opponentPoints,involvement,contribution,scoring,erroring,forcedTypes,sets,efficiency,errorRate};
 }
 let fmt=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="badge">${esc(k)}: ${v}</span>`).join(' ')||'<span class="muted">—</span>',allSection='';
 sides.forEach(s=>{
  let pts=m.points.filter(x=>eventPointWinner(x.event||x.result)===s.side),sc=pts.filter(x=>(x.event||'')===(s.side==='a'?'a_score':'b_score')).length,err=pts.filter(x=>(x.event||'')===(s.side==='a'?'a_error':'b_error')).length,forced=pts.filter(x=>(x.event||'')===(s.side==='a'?'a_forced':'b_forced')).length;
  let scoreMap={},errMap={},forcedMap={};
  pts.filter(x=>x.event===(s.side==='a'?'a_score':'b_score')).forEach(x=>scoreMap[x.action||'Diğer']=(scoreMap[x.action||'Diğer']||0)+1);
  m.points.filter(x=>x.event===(s.side==='a'?'a_error':'b_error')).forEach(x=>errMap[x.action||'Diğer']=(errMap[x.action||'Diğer']||0)+1);
  m.points.filter(x=>x.event===(s.side==='a'?'a_forced':'b_forced')).forEach(x=>forcedMap[x.action||'Diğer']=(forcedMap[x.action||'Diğer']||0)+1);
  let stats=s.players.map(p=>statsForPlayer(p,s.side));
  let rows=stats.map(x=>`<tr><td><b>${esc(x.p.name)}</b></td><td>${x.scored}</td><td>${x.forced}</td><td>${x.errors}</td><td>${x.opponentPoints}</td><td>${x.involvement.toFixed(1)}%</td><td>${x.contribution.toFixed(1)}%</td></tr>`).join('');
  let details=stats.map(x=>`<div class="card"><h3>👤 ${esc(x.p.name)}</h3><p><b>Sayı:</b> ${fmt(x.scoring)}</p><p><b>Rakibe aldırdığı hata:</b> ${fmt(x.forcedTypes)}</p><p><b>Yaptığı hata:</b> ${fmt(x.erroring)}</p></div>`).join('');
  allSection+=`<h3>🏐 ${esc(s.name)}</h3><div class="analysis-grid"><div class="mini-stat"><b>Sayı</b><div class="score">${sc}</div></div><div class="mini-stat"><b>Rakibe Aldırılan Hata</b><div class="score">${forced}</div></div><div class="mini-stat"><b>Kendi Hata</b><div class="score">${err}</div></div></div><p><b>Sayı dağılımı:</b> ${fmt(scoreMap)}</p><p><b>Hata dağılımı:</b> ${fmt(errMap)}</p><p><b>Rakibe aldırılan hata dağılımı:</b> ${fmt(forcedMap)}</p><div class="tablewrap"><table><thead><tr><th>Oyuncu</th><th>Sayı</th><th>Rakibe Hata</th><th>Kendi Hata</th><th>Rakip Sayısı</th><th>Katılım %</th><th>Katkı %</th></tr></thead><tbody>${rows||'<tr><td colspan="7">Oyuncu yok.</td></tr>'}</tbody></table></div><h4>🔎 Teknik Ayrıntılar</h4>${details||'<div class="muted">Oyuncu verisi yok.</div>'}`;
 });
 let sets=Array.from({length:Number(m.sets)||3},(_,i)=>{let s=matchScore(m,i+1);return `<div class="mini-stat"><b>${i+1}. Set</b><div class="score">${s[0]} - ${s[1]}</div></div>`}).join('');
 let totalScore=matchTotalScore(m);
 openModal('📊 Detaylı Maç Analizi — '+esc(m.team)+' 🆚 '+esc(m.internal?m.team2:m.opponent),`<div class="analysis-grid"><div class="mini-stat"><div class="muted">${esc(m.team)}</div><div class="score">${totalScore[0]}</div></div><div class="mini-stat"><div class="muted">${esc(m.internal?m.team2:m.opponent)}</div><div class="score">${totalScore[1]}</div></div><div class="mini-stat"><div class="muted">Set Sistemi</div><div class="score">${m.sets}</div></div><div class="mini-stat"><div class="muted">Toplam Aksiyon</div><div class="score">${m.points.length}</div></div></div><h3>🏁 Set Analizi</h3><div class="analysis-grid">${sets}</div>${allSection}<br><div class="actions"><button class="btn primary" onclick="matchTeamReport('${id}')">📄 Tam Maç PDF</button><button class="btn" onclick="liveMatch('${id}')">⚡ Veri Girişi</button></div>`);
}

function playerMatchStats(matchId,playerId){
 let m=d.matches.find(x=>x.id===matchId);if(!m)return null;normalizeMatchPoints(m);
 let p=d.players.find(x=>x.id===playerId),side=m.internal&&teamPlayers(m.team2Id).some(x=>x.id===playerId)?'b':'a',mine=(m.points||[]).filter(x=>x.playerId===playerId);
 let scored=mine.filter(x=>x.event===(side==='a'?'a_score':'b_score')).length,forced=mine.filter(x=>x.event===(side==='a'?'a_forced':'b_forced')).length,errors=mine.filter(x=>x.event===(side==='a'?'a_error':'b_error')).length;
 let opponentPoints=mine.filter(x=>x.event===(side==='a'?'b_score':'a_score')).length+mine.filter(x=>x.event===(side==='a'?'b_forced':'a_forced')).length;
 let actions={},scoring={},erroring={},forcedTypes={};
 mine.forEach(x=>{let a=x.action||x.reason||'Diğer';actions[a]=(actions[a]||0)+1});
 mine.filter(x=>x.event===(side==='a'?'a_score':'b_score')).forEach(x=>{let a=x.action||'Diğer';scoring[a]=(scoring[a]||0)+1});
 mine.filter(x=>x.event===(side==='a'?'a_error':'b_error')).forEach(x=>{let a=x.action||'Diğer';erroring[a]=(erroring[a]||0)+1});
 mine.filter(x=>x.event===(side==='a'?'a_forced':'b_forced')).forEach(x=>{let a=x.action||'Diğer';forcedTypes[a]=(forcedTypes[a]||0)+1});
 let involvement=m.points.length?mine.length/m.points.length*100:0,teamSidePoints=m.points.filter(x=>eventPointWinner(x.event||x.result)===side).length||1,contribution=Math.max(0,Math.min(100,(scored+forced-errors)/teamSidePoints*100)),efficiency=scored+forced-errors,errorRate=mine.length?errors/mine.length*100:0,sets={};
 for(let sn=1;sn<=(Number(m.sets)||3);sn++){let sp=mine.filter(x=>(x.set||1)===sn);sets[sn]={scored:sp.filter(x=>x.event===(side==='a'?'a_score':'b_score')).length,forced:sp.filter(x=>x.event===(side==='a'?'a_forced':'b_forced')).length,errors:sp.filter(x=>x.event===(side==='a'?'a_error':'b_error')).length,actions:sp.length};}
 return {m,p,side,mine,scored,forced,errors,opponentPoints,actions,scoring,erroring,forcedTypes,involvement,contribution,efficiency,errorRate,sets,teamSidePoints};
}
function statsBadges(o){return Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="badge">${esc(k)}: ${v}</span>`).join(' ')||'<span class="muted">—</span>'}
function makePlayerMatchReport(matchId,playerId){
 let st=playerMatchStats(matchId,playerId),p=d.players.find(x=>x.id===playerId);if(!st||!p)return '';
 let opponent=st.m.internal?(st.side==='biz'?st.m.team2:st.m.team):st.m.opponent;
 let setRows=Object.entries(st.sets).map(([s,v])=>`<tr><td>${s}. Set</td><td>${v.scored}</td><td>${v.forced}</td><td>${v.errors}</td><td>${v.actions}</td></tr>`).join('');
 return `<div class="print-report" id="pmr_${matchId}_${playerId}"><h1>🏐 VolleyScout — Sporcu Maç Performans Raporu</h1><h2>${esc(p.name)}</h2><p><b>${esc(st.m.team)} 🆚 ${esc(st.m.internal?st.m.team2:st.m.opponent)}</b><br>${esc(st.m.date)} ${esc(st.m.time||'')} • ${esc(st.m.venue||'')} ${st.m.internal?'• Kulüp İçi Maç':''}</p>
 <div class="analysis-grid"><div class="mini-stat"><b>Aldığı Sayılar</b><div class="score">${st.scored}</div></div><div class="mini-stat"><b>Rakibe Aldırdığı Hata</b><div class="score">${st.forced}</div></div><div class="mini-stat"><b>Yaptığı Hatalar</b><div class="score">${st.errors}</div></div><div class="mini-stat"><b>Rakipten Aldığı Sayı</b><div class="score">${st.opponentPoints}</div></div><div class="mini-stat"><b>Oyuncu Katılımı</b><div class="score">${st.involvement.toFixed(1)}%</div></div><div class="mini-stat"><b>Oyuna Katkı</b><div class="score">${st.contribution.toFixed(1)}%</div></div><div class="mini-stat"><b>Verim</b><div class="score">${st.efficiency}</div></div><div class="mini-stat"><b>Hata Oranı</b><div class="score">${st.errorRate.toFixed(1)}%</div></div></div>
 <h3>🏆 Aldığı Sayılar</h3><div>${statsBadges(st.scoring)}</div>
 <h3>🎯 Rakibe Aldırdığı Hatalar</h3><div>${statsBadges(st.forcedTypes)}</div>
 <h3>❌ Yaptığı Hatalar</h3><div>${statsBadges(st.erroring)}</div>
 <h3>📊 Set Bazlı Performans</h3><div class="tablewrap"><table><thead><tr><th>Set</th><th>Sayı</th><th>Zorlanan Hata</th><th>Kendi Hatası</th><th>Aksiyon</th></tr></thead><tbody>${setRows}</tbody></table></div>
 <p class="muted">Katılım %: kaydedilmiş oyuncu aksiyonları / toplam maç aksiyonu. Oyuna katkı %: (sayı + rakibe aldırılan hata − kendi hatası) / takımın kaydedilmiş aksiyonları. Verim: sayı + rakibe aldırılan hata − hata.</p></div>`;
}

function matchReportHTML(matchId){
 let m=d.matches.find(x=>x.id===matchId);if(!m)return '';normalizeMatchPoints(m);
 let sides=[{name:m.team,side:'a',players:teamPlayers(m.teamId)}];if(m.internal)sides.push({name:m.team2,side:'b',players:teamPlayers(m.team2Id)});
 let total=matchTotalScore(m),setRows=Array.from({length:Number(m.sets)||3},(_,i)=>{let s=matchScore(m,i+1);return `<tr><td>${i+1}. Set</td><td>${s[0]}</td><td>${s[1]}</td></tr>`}).join('');
 let sections=sides.map(s=>{
  let sc=m.points.filter(x=>x.event===(s.side==='a'?'a_score':'b_score')).length,err=m.points.filter(x=>x.event===(s.side==='a'?'a_error':'b_error')).length,forced=m.points.filter(x=>x.event===(s.side==='a'?'a_forced':'b_forced')).length;

  return `<h2>🏐 ${esc(s.name)}</h2><div class="cards"><div><b>Sayı</b><strong>${sc}</strong></div><div><b>Rakibe Aldırılan Hata</b><strong>${forced}</strong></div><div><b>Kendi Hata</b><strong>${err}</strong></div></div><table><thead><tr><th>Oyuncu</th><th>Sayı</th><th>Rakibe Hata</th><th>Kendi Hata</th><th>Rakip Sayısı</th><th>Katılım</th><th>Katkı</th><th>Verim</th><th>Sayı Türleri</th><th>Rakibe Hata Türleri</th><th>Hata Türleri</th></tr></thead><tbody>${rows||'<tr><td colspan="11">Oyuncu verisi yok.</td></tr>'}</tbody></table>`;
 }).join('');
 return `<div class="report"><h1>🏐 VolleyScout — Tam Maç Performans Raporu</h1><h2>${esc(m.team)} 🆚 ${esc(m.internal?m.team2:m.opponent)}</h2><p>${esc(m.date)} ${esc(m.time||'')} • ${esc(m.venue||'')} • ${m.sets} set ${m.internal?'• Kulüp İçi Maç':''}</p><div class="scorebox">${total[0]} — ${total[1]}</div><h2>🏁 Set Sonuçları</h2><table><thead><tr><th>Set</th><th>${esc(m.team)}</th><th>${esc(m.internal?m.team2:m.opponent)}</th></tr></thead><tbody>${setRows}</tbody></table>${sections}<p class="note">Katılım %: oyuncunun kaydedilen aksiyonlarının toplam maç aksiyonlarına oranı. Oyuna katkı %: (sayı + rakibe aldırılan hata − kendi hatası) / takımın kaydedilmiş sayı aksiyonları. Verim = sayı + rakibe aldırılan hata − hata. File teması ayrı hata türü olarak raporlanır.</p></div>`;
}

function restore(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{d=JSON.parse(r.result);save();boot();toast('Yedek yüklendi.')}catch(e){toast('Yedek dosyası okunamadı.')}};r.readAsText(file)}
function archiveCurrentSeason(){let key='volleyScout_archive_'+d.season;let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=key+'.json';a.click();URL.revokeObjectURL(a.href);toast('Sezon arşivi indirildi.')}
function newSeason(){let n=prompt('Yeni sezon (örn. 2027-2028)',d.season);if(!n||n===d.season)return;let old=d.season;d.season=n;d.players=d.players.map(p=>({...p,teamIds:[],teamId:'',schoolGroupId:''}));d.teams=[];d.schoolGroups=[];d.schoolAttendance=[];d.attendance=[];d.trainings=[];d.matches=[];d.tests=[];d.tactics=[];d.messages=[];d.notifications=[];save();boot();toast(old+' → '+n+' geçildi. Aktif sporcular yeni sezona aktarıldı.')}
function resetApp(){if(!confirm('Tüm VolleyScout verileri silinsin mi?'))return;localStorage.removeItem(KEY);location.reload()}
function deleteTestDummy(){}

try{let raw=localStorage.getItem(KEY);if(raw){let old=JSON.parse(raw);if(old&&typeof old==='object')d={...d,...old}}}catch(e){console.warn('Kayıtlı veri okunamadı, güvenli başlangıç yapıldı.',e)}
// Veri şeması güvenliği: eski sürümlerde eksik/bozuk alanlar uygulamanın açılmasını engellemesin.
for(const k of ['players','teams','coaches','schoolGroups','schoolAttendance','attendance','trainings','matches','tests','tactics','messages','notifications'])if(!Array.isArray(d[k]))d[k]=[];
if(!d.season)d.season='2026-2027';
if(!Array.isArray(d.leagues))d.leagues=[];
const _leagueNames=d.leagues.map(x=>typeof x==='string'?x:(x&&x.name?String(x.name):'')).filter(Boolean);
for(const lg of LEAGUES_DEFAULT)if(!_leagueNames.includes(lg))_leagueNames.push(lg);
d.leagues=_leagueNames.map((name,i)=>({id:'lg_'+i+'_'+name.toLowerCase().replace(/[^a-z0-9ğüşöçıİĞÜŞÖÇ]+/gi,'_'),name}));
for(const g of d.schoolGroups){if(!Array.isArray(g.days))g.days=g.day?[g.day]:[];if(!g.time)g.time='';}
save();
boot();

// FINAL PWA cache/version guard
try{if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>{let had=!!navigator.serviceWorker.controller;Promise.all(rs.map(r=>r.unregister())).then(()=>{if(had&&!sessionStorage.getItem('vs_sw_reloaded')){sessionStorage.setItem('vs_sw_reloaded','1');location.reload();}});});}}catch(e){}
</script>
