<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f97316">
<title>VolleyScout TR V3.0</title>
<style>
:root{--orange:#f97316;--orange2:#ea580c;--bg:#fff7ed;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#fed7aa;--ok:#16a34a;--bad:#dc2626;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1180px;margin:auto;min-height:100vh}
.top{position:sticky;top:0;z-index:5;background:rgba(255,247,237,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--orange),#fb923c);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:800}.top h1{font-size:18px;margin:0}.top small{color:var(--muted)}.spacer{flex:1}
.iconbtn,.btn{border-radius:12px;padding:10px 13px;background:#fff;border:1px solid var(--line);color:var(--ink)}.primary{background:var(--orange);color:#fff;border-color:var(--orange)}.danger{background:#fff;color:var(--bad);border-color:#fecaca}.ghost{background:transparent}
main{padding:18px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 5px 20px rgba(124,45,18,.06)}.card h3{margin:0 0 8px}.muted{color:var(--muted)}.hero{background:linear-gradient(135deg,#fff1e6,#fff);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}.hero h2{margin:0 0 6px;font-size:28px}.section-title{display:flex;align-items:center;gap:10px;margin:22px 0 12px}.section-title h2{margin:0;font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.tile{padding:18px;border-radius:18px;background:#fff;border:1px solid var(--line);text-align:left;min-height:100px}.tile b{display:block;margin-top:8px}.tile span{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #fdba74;border-radius:11px;background:#fff}.field textarea{min-height:90px;resize:vertical}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:9px 10px;border-bottom:1px solid #ffedd5;text-align:left;font-size:13px}th{background:#fff7ed;position:sticky;top:0}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#ffedd5;color:#9a3412;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#ffedd5;display:grid;place-items:center;color:#9a3412;font-weight:800}.avatar.big{width:88px;height:88px;font-size:28px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;position:sticky;bottom:0;background:rgba(255,247,237,.97);padding:9px;border-top:1px solid var(--line);z-index:5}.nav button{padding:9px 4px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:12px}.nav button.active{background:var(--orange);color:#fff;border-color:var(--orange)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px}.close{float:right}.toast{position:fixed;right:16px;bottom:78px;background:#111827;color:#fff;padding:12px 15px;border-radius:12px;display:none;z-index:30}.toast.show{display:block}
.setup{min-height:100vh;display:grid;place-items:center;padding:20px}.setup .card{width:min(520px,100%)}.hidden{display:none!important}.stat{font-size:28px;font-weight:800}.score{font-size:42px;font-weight:900}.court{height:390px;border-radius:16px;background:#fb923c;border:6px solid #fff;box-shadow:inset 0 0 0 2px #9a3412;position:relative;overflow:hidden}.court:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid #fff}.court:after{content:"";position:absolute;left:14%;right:14%;top:22%;height:56%;border:3px solid #fff}.playerdot{position:absolute;width:42px;height:42px;border-radius:50%;background:#fff;color:#9a3412;display:grid;place-items:center;font-weight:800;box-shadow:0 3px 8px #7c2d1255;touch-action:none}
@media(min-width:900px){.nav{position:static;grid-template-columns:repeat(10,1fr);margin:0 18px;border:0;background:transparent}.nav button{min-height:54px}.modal{align-items:center}.sheet{border-radius:22px}}
</style>
</head>
<body>
<div id="setup" class="setup">
  <div class="card">
    <div class="logo">🏐</div><h1>VolleyScout TR <span class="badge">V3.0</span></h1>
    <p class="muted">Voleybol antrenör asistanı. İlk kurulumdan sonra kulübünü hatırlar.</p>
    <div class="field"><label>Ad Soyad</label><input id="setupCoach" placeholder="Antrenör adı"></div>
    <div class="field"><label>Kulüp / Spor Okulu adı</label><input id="setupClub" placeholder="Örn. Yıldız Spor"></div>
    <div class="field"><label>Sezon</label><input id="setupSeason" value="2026-2027"></div>
    <br><button class="btn primary" style="width:100%" onclick="finishSetup()">🚀 VolleyScout'u Başlat</button>
  </div>
</div>

<div id="app" class="app hidden">
<header class="top"><div class="logo">🏐</div><div><h1 id="brand">VolleyScout TR</h1><small id="subbrand">Antrenör paneli</small></div><div class="spacer"></div><button class="iconbtn" onclick="showView('notifications')">🔔 <span id="notifCount">0</span></button></header>
<main>
<section id="home" class="view active"></section>
<section id="athletes" class="view"></section>
<section id="teams" class="view"></section>
<section id="school" class="view"></section>
<section id="attendance" class="view"></section>
<section id="training" class="view"></section>
<section id="matches" class="view"></section>
<section id="tests" class="view"></section>
<section id="tactics" class="view"></section>
<section id="messages" class="view"></section>
<section id="reports" class="view"></section>
<section id="club" class="view"></section>
<section id="notifications" class="view"></section>
</main>
<nav class="nav" id="nav"></nav>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="btn close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const KEY='volleyscout_v30';
const CATS=['Mini','Midi','Küçük','Yıldız','Özel Lig'], GROUPS=['A','B','C','1','2','3'];
const TECH=['Pas','Manşet','Servis','Hücum','Blok','Savunma'];
const TESTS=[
 ['Boy','cm','antropometrik'],['Kilo','kg','antropometrik'],['Kulaç','cm','antropometrik'],
 ['Dikey sıçrama','cm','sıçrama'],['Hücum sıçraması','cm','sıçrama'],['10 m Sprint','sn','hız'],['20 m Sprint','sn','hız'],
 ['T Testi','sn','çeviklik'],['Y Testi','sn','çeviklik'],['Esneklik','cm','esneklik'],['Plank','sn','kuvvet'],
 ['Durarak uzun atlama','cm','kuvvet'],['Servis isabet','/10','teknik'],['Pas-Manşet isabet','/20','teknik'],
 ['Yo-Yo / Mekik','seviye','dayanıklılık']
];
let d={club:null,coach:null,season:'2026-2027',players:[],teams:[],schoolGroups:[],attendance:[],trainings:[],matches:[],tests:[],tactics:[],messages:[],notifications:[]};
let state={view:'home', editId:null, selectedPlayer:null, selectedTeam:null, selectedMatch:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(d));}
function uid(p='x'){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function playerTeamIds(p){return Array.isArray(p.teamIds)?p.teamIds:(p.teamId?[p.teamId]:[])}
function playerTeams(p){return playerTeamIds(p).map(id=>d.teams.find(t=>t.id===id)).filter(Boolean)}
function teamPlayers(id){return d.players.filter(p=>playerTeamIds(p).includes(id))}
function finishSetup(){let club=$('setupClub').value.trim(),coach=$('setupCoach').value.trim();if(!club||!coach)return toast('Kulüp ve antrenör adını gir.');d.club=club;d.coach=coach;d.season=$('setupSeason').value||'2026-2027';save();boot()}
function boot(){if(!d.club){$('setup').classList.remove('hidden');$('app').classList.add('hidden');return}$('setup').classList.add('hidden');$('app').classList.remove('hidden');$('brand').textContent=d.club;$('subbrand').textContent=d.coach+' • '+d.season;renderNav();renderAll();showView(state.view||'home')}
function showView(v){state.view=v;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));render(v)}
function renderNav(){$('nav').innerHTML=[['home','🏠','Ana'],['athletes','👥','Sporcular'],['teams','🏐','Takımlar'],['school','🏫','Spor Okulu'],['attendance','📝','Yoklama'],['training','🏋️','Antrenman'],['matches','🏐','Maçlar'],['tests','🧪','Testler'],['tactics','🧠','Taktik'],['messages','💬','İletişim'],['reports','📊','Raporlar'],['club','⚙️','Ayarlar']].map(x=>`<button data-v="${x[0]}" onclick="showView('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join('')}
function renderAll(){['home','athletes','teams','school','attendance','training','matches','tests','tactics','messages','reports','club','notifications'].forEach(render);$('notifCount').textContent=d.notifications.filter(n=>!n.read).length}
function render(v){if(!$(`${v}`))return;({home:home,athletes:athletes,teams:teams,school:school,attendance:attendance,training:training,matches:matches,tests:tests,tactics:tactics,messages:messages,reports:reports,club:club,notifications:notifications}[v])()}
function home(){let today=new Date().toISOString().slice(0,10),trs=d.trainings.filter(t=>t.date===today),up=d.matches.filter(m=>m.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,2),pending=d.notifications.filter(n=>!n.read).length;$('home').innerHTML=`<div class="hero"><h2>Günaydın ${esc(d.coach)} 👋</h2><div class="muted">${esc(d.club)} • ${esc(d.season)}</div><div class="grid" style="margin-top:14px"><div><div class="stat">${d.players.length}</div><div class="muted">Sporcu</div></div><div><div class="stat">${d.teams.length}</div><div class="muted">Takım</div></div><div><div class="stat">${d.trainings.length}</div><div class="muted">Antrenman</div></div><div><div class="stat">${pending}</div><div class="muted">Okunmamış</div></div></div></div>
<div class="tiles">
${[['athletes','👥','Sporcular','Profil, fotoğraf, takım ve gelişim'],['teams','🏐','Takımlar','Kategori ve çoklu takım'],['school','🏫','Spor Okulu','Gruplar, yoklama ve test'],['attendance','📝','Yoklama','Aylık grup yoklaması'],['training','🏋️','Antrenman','Haftalık program'],['matches','🏐','Maçlar','Sayı ve analiz'],['tests','🧪','Testler','Teknik + 10 haftalık gelişim'],['tactics','🧠','Taktik','Saha tahtası'],['messages','💬','İletişim','Hoca, sporcu, veli'],['reports','📊','Raporlar','PDF ve gelişim'],['club','⚙️','Ayarlar','Kulüp ve yedekleme']].map(t=>`<button class="tile" onclick="showView('${t[0]}')">${t[1]}<b>${t[2]}</b><span>${t[3]}</span></button>`).join('')}</div>
<div class="section-title"><h2>Bugün</h2></div><div class="list">${trs.length?trs.map(t=>`<div class="item"><b>🏋️ ${esc(t.title)}</b><div class="muted">${t.time||''} • ${esc(t.team||'')}</div></div>`).join(''):'<div class="card muted">Bugün planlanmış antrenman yok.</div>'}</div>
<div class="section-title"><h2>Yaklaşan Maçlar</h2></div><div class="list">${up.length?up.map(m=>`<div class="item"><b>🏐 ${esc(m.team)} — ${esc(m.opponent)}</b><div class="muted">${m.date} ${m.time||''} • ${esc(m.venue||'')}</div></div>`).join(''):'<div class="card muted">Yaklaşan maç yok.</div>'}</div>`}
function openModal(title,body){$('modalBody').innerHTML=`<h2>${title}</h2>${body}`;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show');state.editId=null}
function athleteForm(p={}){let ids=playerTeamIds(p);return `<div class="formgrid">
<div class="field"><label>Ad Soyad</label><input id="f_name" value="${esc(p.name)}"></div><div class="field"><label>Forma No</label><input id="f_no" value="${esc(p.no)}"></div>
<div class="field"><label>Mevki</label><select id="f_pos">${['Pasör','Smaçör','Orta','Libero','Pasör Çaprazı','Diğer'].map(x=>`<option ${x===p.position?'selected':''}>${x}</option>`).join('')}</select></div>
<div class="field"><label>Doğum Tarihi</label><input type="date" id="f_birth" value="${esc(p.birth)}"></div><div class="field"><label>Boy (cm)</label><input id="f_height" value="${esc(p.height)}"></div><div class="field"><label>Kilo (kg)</label><input id="f_weight" value="${esc(p.weight)}"></div>
<div class="field" style="grid-column:1/-1"><label>Fotoğraf</label><input type="file" id="f_photo" accept="image/*"></div>
<div class="field" style="grid-column:1/-1"><label>Takımlar — birden fazla seçilebilir</label><div class="card">${d.teams.map(t=>`<label style="display:block;margin:7px 0"><input class="tmcheck" type="checkbox" value="${t.id}" ${ids.includes(t.id)?'checked':''}> ${esc(t.name)} <span class="muted">• ${esc(t.category)}</span></label>`).join('')||'<span class="muted">Önce takım oluştur.</span>'}</div></div>
<div class="field" style="grid-column:1/-1"><label>Spor Okulu Grubu</label><select id="f_school"><option value="">Yok</option>${d.schoolGroups.map(g=>`<option value="${g.id}" ${g.id===p.schoolGroupId?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div>
<div class="field" style="grid-column:1/-1"><label>Not</label><textarea id="f_note">${esc(p.note)}</textarea></div></div>
<br><div class="actions"><button class="btn primary" onclick="saveAthlete('${p.id||''}')">💾 Kaydet</button>${p.id?`<button class="btn danger" onclick="deleteAthlete('${p.id}')">🗑️ Sil</button>`:''}</div>`}
function saveAthlete(id){let p=id?d.players.find(x=>x.id===id):{id:uid('p')};p.name=$('f_name').value.trim()||'Sporcu';p.no=$('f_no').value;p.position=$('f_pos').value;p.birth=$('f_birth').value;p.height=$('f_height').value;p.weight=$('f_weight').value;p.teamIds=[...document.querySelectorAll('.tmcheck:checked')].map(x=>x.value);p.teamId=p.teamIds[0]||'';p.schoolGroupId=$('f_school').value;p.note=$('f_note').value;let file=$('f_photo').files[0];if(file){let r=new FileReader();r.onload=()=>{p.photo=r.result;commitPlayer(p,id)};r.readAsDataURL(file)}else commitPlayer(p,id)}
function commitPlayer(p,id){if(!id)d.players.push(p);save();closeModal();renderAll();showView('athletes');toast('Sporcu kaydedildi.')}
function deleteAthlete(id){if(!confirm('Sporcu silinsin mi?'))return;d.players=d.players.filter(p=>p.id!==id);save();closeModal();renderAll();toast('Sporcu silindi.')}
function athletes(){let q=state.q||'';let list=d.players.filter(p=>(p.name||'').toLowerCase().includes(q.toLowerCase()));$('athletes').innerHTML=`<div class="section-title"><h2>👥 Sporcular</h2><div class="spacer"></div><button class="btn primary" onclick="openModal('Yeni Sporcu',athleteForm())">➕ Sporcu Ekle</button></div><div class="row"><div class="field" style="min-width:250px"><input placeholder="🔍 Sporcu ara" value="${esc(q)}" oninput="state.q=this.value;athletes()"></div></div><div class="list">${list.length?list.map(p=>`<div class="item row"><div class="avatar">${p.photo?`<img class="avatar" src="${p.photo}">`:esc((p.name||'?')[0])}</div><div style="flex:1"><b>${esc(p.name)}</b><div class="muted">#${esc(p.no||'-')} • ${esc(p.position||'-')}</div><div class="muted">${playerTeams(p).map(t=>esc(t.name)).join(' • ')||'Takımsız'}${p.schoolGroupId?' • 🏫 '+esc((d.schoolGroups.find(g=>g.id===p.schoolGroupId)||{}).name||''):''}</div></div><div class="actions"><button class="btn" onclick="profile('${p.id}')">👤 Profil</button><button class="btn" onclick="openModal('Sporcu Düzenle',athleteForm(d.players.find(x=>x.id==='${p.id}')))">✏️</button><button class="btn danger" onclick="deleteAthlete('${p.id}')">🗑️</button></div></div>`).join(''):'<div class="card muted">Henüz sporcu yok.</div>'}</div>`}
function profile(id){let p=d.players.find(x=>x.id===id);if(!p)return;state.selectedPlayer=id;let tests=d.tests.filter(t=>t.playerId===id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8),notes=d.messages.filter(m=>m.playerId===id).slice(-4);openModal('👤 '+esc(p.name),`<div class="row"><div class="avatar big">${p.photo?`<img class="avatar big" src="${p.photo}">`:esc((p.name||'?')[0])}</div><div><h3>${esc(p.name)}</h3><div class="muted">#${esc(p.no||'-')} • ${esc(p.position||'-')}</div><div>${playerTeams(p).map(t=>`<span class="badge">${esc(t.name)}</span> `).join('')||'<span class="badge">Takımsız</span>'}</div></div></div><div class="section-title"><h3>📋 Bilgiler</h3></div><div class="grid"><div class="card"><b>Doğum</b><div>${p.birth||'-'}</div></div><div class="card"><b>Boy</b><div>${p.height||'-'} cm</div></div><div class="card"><b>Kilo</b><div>${p.weight||'-'} kg</div></div></div><div class="section-title"><h3>🧪 Son Testler</h3></div><div class="list">${tests.map(t=>`<div class="item"><b>${esc(t.name)}</b> — ${esc(t.value)} ${esc(t.unit||'')}<div class="muted">${t.date} • ${esc(t.period||'')}</div></div>`).join('')||'<div class="muted">Test kaydı yok.</div>'}</div><div class="actions"><button class="btn primary" onclick="closeModal();showView('tests');state.selectedPlayer='${id}'">🧪 Test Ekle</button><button class="btn" onclick="closeModal();showView('messages')">💬 Mesaj</button><button class="btn" onclick="openModal('PDF Rapor',reportPlayer('${id}'))">📄 Rapor</button></div>`)}
function teamForm(t={}){return `<div class="formgrid"><div class="field"><label>Kategori</label><select id="t_cat">${CATS.map(x=>`<option ${x===(t.category||'Yıldız')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Grup</label><select id="t_group">${GROUPS.map(x=>`<option ${x===(t.group||'A')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Takım adı</label><input id="t_name" value="${esc(t.name)}" placeholder="Yıldız A"></div></div><br><div class="actions"><button class="btn primary" onclick="saveTeam('${t.id||''}')">💾 Kaydet</button>${t.id?`<button class="btn danger" onclick="deleteTeam('${t.id}')">🗑️ Sil</button>`:''}</div>`}
function saveTeam(id){let t=id?d.teams.find(x=>x.id===id):{id:uid('t')};t.category=$('t_cat').value;t.group=$('t_group').value;t.name=$('t_name').value.trim()||`${t.category} ${t.group}`;if(!id)t.created=new Date().toISOString();if(!id)d.teams.push(t);save();closeModal();renderAll();toast('Takım kaydedildi.')}
function deleteTeam(id){if(teamPlayers(id).length&& !confirm('Bu takımda sporcular var. Takımı yine de silmek ister misin?'))return;d.players.forEach(p=>{p.teamIds=playerTeamIds(p).filter(x=>x!==id);p.teamId=p.teamIds[0]||''});d.teams=d.teams.filter(t=>t.id!==id);save();closeModal();renderAll();toast('Takım silindi.')}
function teams(){$('teams').innerHTML=`<div class="section-title"><h2>🏐 Takımlar</h2><div class="spacer"></div><button class="btn primary" onclick="openModal('Yeni Takım',teamForm())">➕ Takım Ekle</button></div><div class="grid">${d.teams.map(t=>`<div class="card"><div class="row between"><div><span class="badge">${esc(t.category)}</span> <span class="badge">${esc(t.group)}</span><h3>${esc(t.name)}</h3><div class="muted">${teamPlayers(t.id).length} sporcu</div></div><div>🏐</div></div><br><div class="actions"><button class="btn" onclick="teamDetail('${t.id}')">👥 Aç</button><button class="btn" onclick="openModal('Takım Düzenle',teamForm(d.teams.find(x=>x.id==='${t.id}')))">✏️</button><button class="btn danger" onclick="deleteTeam('${t.id}')">🗑️</button></div></div>`).join('')||'<div class="card muted">Henüz takım yok.</div>'}</div>`}

function schoolForm(g={}){return `<div class="field"><label>Grup adı</label><input id="sg_name" value="${esc(g.name)}" placeholder="Çarşamba Grubu"></div><div class="field"><label>Gün</label><select id="sg_day">${['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'].map(x=>`<option ${x===g.day?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Saat</label><input type="time" id="sg_time" value="${esc(g.time)}"></div><br><button class="btn primary" onclick="saveSchool('${g.id||''}')">💾 Kaydet</button>`}
function saveSchool(id){let g=id?d.schoolGroups.find(x=>x.id===id):{id:uid('sg')};g.name=$('sg_name').value.trim()||'Spor Okulu Grubu';g.day=$('sg_day').value;g.time=$('sg_time').value;if(!id)d.schoolGroups.push(g);save();closeModal();renderAll();toast('Spor okulu grubu kaydedildi.')}
function school(){$('school').innerHTML=`<div class="section-title"><h2>🏫 Spor Okulu</h2><div class="spacer"></div><button class="btn primary" onclick="openModal('Yeni Spor Okulu Grubu',schoolForm())">➕ Grup Ekle</button></div><p class="muted">Takımlardan bağımsız sporcu, yoklama ve test takibi.</p><div class="grid">${d.schoolGroups.map(g=>`<div class="card"><h3>${esc(g.name)}</h3><div class="muted">${esc(g.day)} • ${esc(g.time||'')}</div><div class="stat">${d.players.filter(p=>p.schoolGroupId===g.id).length}</div><div class="muted">sporcu</div><br><div class="actions"><button class="btn" onclick="schoolDetail('${g.id}')">👥 Aç</button><button class="btn" onclick="openModal('Grup Düzenle',schoolForm(d.schoolGroups.find(x=>x.id==='${g.id}')))">✏️</button><button class="btn danger" onclick="deleteSchool('${g.id}')">🗑️</button></div></div>`).join('')||'<div class="card muted">Henüz spor okulu grubu yok.</div>'}</div>`}
function schoolDetail(id){let g=d.schoolGroups.find(x=>x.id===id),ps=d.players.filter(p=>p.schoolGroupId===id);openModal('🏫 '+esc(g.name),`<div class="row"><span class="badge">${esc(g.day)}</span><span class="badge">${esc(g.time||'')}</span></div><h3>Sporcular</h3><div class="list">${ps.map(p=>`<div class="item row"><div class="avatar">${esc((p.name||'?')[0])}</div><b>${esc(p.name)}</b><div class="spacer"></div><button class="btn" onclick="profile('${p.id}')">Profil</button></div>`).join('')||'<div class="muted">Sporcu yok.</div>'}</div>`)}
function deleteSchool(id){if(!confirm('Grup silinsin mi?'))return;d.schoolGroups=d.schoolGroups.filter(x=>x.id!==id);d.players.forEach(p=>{if(p.schoolGroupId===id)p.schoolGroupId=''});save();renderAll();toast('Grup silindi.')}
function attendance(){let month=state.month||new Date().toISOString().slice(0,7),team=state.attTeam||d.teams[0]?.id||'',ps=team?teamPlayers(team):d.players;let days=new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate();$('attendance').innerHTML=`<div class="section-title"><h2>📝 Aylık Yoklama</h2><button class="btn primary" onclick="openModal('Yoklama Günlerini Ayarla',attendanceSettings())">⚙️ Günleri Ayarla</button></div><div class="formgrid"><div class="field"><label>Ay</label><input type="month" value="${month}" onchange="state.month=this.value;attendance()"></div><div class="field"><label>Takım</label><select onchange="state.attTeam=this.value;attendance()"><option value="">Tüm sporcular</option>${d.teams.map(t=>`<option value="${t.id}" ${t.id===team?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div><br><div class="tablewrap"><table><thead><tr><th>Sporcu</th>${Array.from({length:days},(_,i)=>`<th>${i+1}</th>`).join('')}<th>%</th></tr></thead><tbody>${ps.map(p=>{let vals=Array.from({length:days},(_,i)=>d.attendance.find(a=>a.playerId===p.id&&a.date===`${month}-${String(i+1).padStart(2,'0')}`)?.status||'');let done=vals.filter(Boolean),rate=done.length?Math.round(done.filter(x=>x==='G').length/done.length*100):0;return `<tr><td><b>${esc(p.name)}</b></td>${vals.map((v,i)=>`<td><button class="iconbtn" onclick="cycleAttendance('${p.id}','${month}-${String(i+1).padStart(2,'0')}')">${v==='G'?'✅':v==='Y'?'❌':v==='GEC'?'🟡':v==='I'?'🔵':'·'}</button></td>`).join('')}<td><b>${rate}%</b></td></tr>`}).join('')}</tbody></table></div><p class="muted">Tıklayarak: boş → geldi → gelmedi → geç → izinli → boş.</p>`}
function cycleAttendance(pid,date){let a=d.attendance.find(x=>x.playerId===pid&&x.date===date),seq=['','G','Y','GEC','I'];if(!a){a={id:uid('a'),playerId:pid,date,status:''};d.attendance.push(a)}a.status=seq[(seq.indexOf(a.status)+1)%seq.length];save();attendance()}
function attendanceSettings(){return `<p class="muted">Düzenli yoklama günlerini takım bazında belirle. Bu ay ve sonraki planlamalarda kullanılacak.</p><div class="field"><label>Takım</label><select id="as_team">${d.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Yoklama günleri</label><div>${['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'].map(x=>`<label style="display:block;margin:7px 0"><input class="daycheck" type="checkbox" value="${x}"> ${x}</label>`).join('')}</div></div><button class="btn primary" onclick="toast('Yoklama günleri kaydedildi.');closeModal()">💾 Kaydet</button>`}
function trainingForm(t={}){return `<div class="formgrid"><div class="field"><label>Tarih</label><input type="date" id="tr_date" value="${esc(t.date)}"></div><div class="field"><label>Saat</label><input type="time" id="tr_time" value="${esc(t.time)}"></div><div class="field"><label>Takım / Grup</label><input id="tr_team" value="${esc(t.team)}" placeholder="Yıldız A"></div><div class="field"><label>Salon</label><input id="tr_venue" value="${esc(t.venue)}"></div><div class="field" style="grid-column:1/-1"><label>İçerik</label><select id="tr_title">${['Servis','Manşet','Pas','Hücum','Blok','Savunma','Maç hazırlığı','Kondisyon','Teknik + Taktik'].map(x=>`<option ${x===t.title?'selected':''}>${x}</option>`).join('')}</select></div><div class="field" style="grid-column:1/-1"><label>Not</label><textarea id="tr_note">${esc(t.note)}</textarea></div><label><input type="checkbox" id="tr_notify" ${t.notify?'checked':''}> Bildirim gönder</label></div><br><button class="btn primary" onclick="saveTraining('${t.id||''}')">💾 Kaydet</button>`}
function saveTraining(id){let t=id?d.trainings.find(x=>x.id===id):{id:uid('tr')};t.date=$('tr_date').value;t.time=$('tr_time').value;t.team=$('tr_team').value;t.venue=$('tr_venue').value;t.title=$('tr_title').value;t.note=$('tr_note').value;t.notify=$('tr_notify').checked;if(!id)d.trainings.push(t);if(t.notify)addNotification('🏋️ Yeni antrenman programı',`${t.date} ${t.time||''} • ${t.team||''} • ${t.title}`);save();closeModal();renderAll();toast('Antrenman kaydedildi.')}
function training(){let week=state.week||new Date().toISOString().slice(0,10),list=[...d.trainings].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('training').innerHTML=`<div class="section-title"><h2>🏋️ Antrenman</h2><div class="spacer"></div><button class="btn primary" onclick="openModal('Yeni Antrenman',trainingForm({date:new Date().toISOString().slice(0,10)}))">➕ Antrenman Ekle</button></div><div class="card"><b>Haftalık program</b><p class="muted">Her antrenmanda kısa içerik + not + isteğe bağlı bildirim.</p></div><div class="list">${list.map(t=>`<div class="item"><div class="row between"><div><b>${esc(t.date)} • ${esc(t.time||'')} — ${esc(t.team)}</b><div>${esc(t.title)} • ${esc(t.venue||'')}</div>${t.note?`<div class="muted">📝 ${esc(t.note)}</div>`:''}</div><div class="actions"><button class="btn" onclick="openModal('Antrenman Düzenle',trainingForm(d.trainings.find(x=>x.id==='${t.id}')))">✏️</button><button class="btn danger" onclick="deleteTraining('${t.id}')">🗑️</button></div></div></div>`).join('')||'<div class="card muted">Henüz antrenman programı yok.</div>'}</div>`}
function deleteTraining(id){if(!confirm('Antrenman silinsin mi?'))return;d.trainings=d.trainings.filter(x=>x.id!==id);save();renderAll();toast('Antrenman silindi.')}
function matchForm(m={}){return `<div class="formgrid"><div class="field"><label>Takım</label><select id="m_team">${d.teams.map(t=>`<option value="${t.id}" ${t.id===m.teamId?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Rakip</label><input id="m_opp" value="${esc(m.opponent)}"></div><div class="field"><label>Tarih</label><input type="date" id="m_date" value="${esc(m.date)}"></div><div class="field"><label>Saat</label><input type="time" id="m_time" value="${esc(m.time)}"></div><div class="field"><label>Salon</label><input id="m_venue" value="${esc(m.venue)}"></div><div class="field"><label>Set sistemi</label><select id="m_sets">${[3,5].map(x=>`<option ${x===(m.sets||5)?'selected':''}>${x}</option>`).join('')}</select></div></div><br><button class="btn primary" onclick="saveMatch('${m.id||''}')">💾 Kaydet</button>`}
function saveMatch(id){let m=id?d.matches.find(x=>x.id===id):{id:uid('m'),points:[]};m.teamId=$('m_team').value;m.team=d.teams.find(t=>t.id===m.teamId)?.name||'';m.opponent=$('m_opp').value;m.date=$('m_date').value;m.time=$('m_time').value;m.venue=$('m_venue').value;m.sets=Number($('m_sets').value);if(!id)d.matches.push(m);save();closeModal();renderAll();toast('Maç kaydedildi.')}
function matches(){let list=[...d.matches].sort((a,b)=>a.date.localeCompare(b.date));$('matches').innerHTML=`<div class="section-title"><h2>🏐 Maçlar</h2><div class="spacer"></div><button class="btn primary" onclick="openModal('Yeni Maç',matchForm({date:new Date().toISOString().slice(0,10)}))">➕ Maç Oluştur</button></div><div class="list">${list.map(m=>{let bs=m.points.filter(p=>p.side==='biz').length,rs=m.points.filter(p=>p.side==='rakip').length;return `<div class="item"><div class="row between"><div><h3>${esc(m.team)} 🆚 ${esc(m.opponent)}</h3><div class="muted">${m.date} ${m.time||''} • ${esc(m.venue||'')} • ${m.sets} set</div><div class="score">${bs} - ${rs}</div></div><div class="actions"><button class="btn primary" onclick="liveMatch('${m.id}')">🔴 Canlı</button><button class="btn" onclick="openModal('Maç Düzenle',matchForm(d.matches.find(x=>x.id==='${m.id}')))">✏️</button><button class="btn danger" onclick="deleteMatch('${m.id}')">🗑️</button></div></div></div>`}).join('')||'<div class="card muted">Henüz maç yok.</div>'}</div>`}
function deleteMatch(id){if(!confirm('Maç silinsin mi?'))return;d.matches=d.matches.filter(x=>x.id!==id);save();renderAll();toast('Maç silindi.')}
function liveMatch(id){let m=d.matches.find(x=>x.id===id);let players=teamPlayers(m.teamId);openModal('🔴 Canlı Skor — '+esc(m.team)+' 🆚 '+esc(m.opponent),`<div class="row between"><div><span class="badge">${esc(m.team)}</span><div class="score" id="ls_biz">${m.points.filter(p=>p.side==='biz').length}</div></div><div><span class="badge">${esc(m.opponent)}</span><div class="score" id="ls_rakip">${m.points.filter(p=>p.side==='rakip').length}</div></div></div><hr><div class="formgrid"><div class="field"><label>Sayı kimin?</label><select id="pt_side"><option value="biz">BİZ</option><option value="rakip">RAKİP</option></select></div><div class="field"><label>Oyuncu (biz ise)</label><select id="pt_player"><option value="">Takım</option>${players.map(p=>`<option value="${p.id}">${esc(p.name)} #${esc(p.no||'-')}</option>`).join('')}</select></div><div class="field"><label>Neden</label><select id="pt_reason">${['Servis','Pas','Manşet','Hücum','Blok','Savunma','Rakip hatası','Diğer'].map(x=>`<option>${x}</option>`).join('')}</select></div></div><br><button class="btn primary" onclick="addPoint('${id}')">➕ Sayıyı Kaydet</button><div class="section-title"><h3>Son sayılar</h3></div><div id="pointList">${m.points.slice(-12).reverse().map(pointRow).join('')}</div>`)}
function pointRow(p){let name=p.playerId?(d.players.find(x=>x.id===p.playerId)?.name||''):'Takım';return `<div class="item"><b>${p.side==='biz'?'🟧 BİZ':'🔵 RAKİP'}</b> • ${esc(name)} • ${esc(p.reason)}<div class="muted">${p.time}</div></div>`}
function addPoint(id){let m=d.matches.find(x=>x.id===id);m.points.push({id:uid('pt'),side:$('pt_side').value,playerId:$('pt_player').value,reason:$('pt_reason').value,time:new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})});save();liveMatch(id);toast('Sayı kaydedildi.')}
function testForm(playerId=''){let p=playerId||state.selectedPlayer||d.players[0]?.id||'';return `<div class="formgrid"><div class="field"><label>Sporcu</label><select id="te_player">${d.players.map(x=>`<option value="${x.id}" ${x.id===p?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Test</label><select id="te_name">${TESTS.map(x=>`<option data-unit="${x[1]}">${x[0]}</option>`).join('')}</select></div><div class="field"><label>Sonuç</label><input id="te_value" placeholder="Örn. 42"></div><div class="field"><label>Tarih</label><input type="date" id="te_date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Dönem</label><select id="te_period"><option>Sezon Başı</option><option>10. Hafta</option><option>20. Hafta</option><option>30. Hafta</option><option>Diğer</option></select></div></div><br><button class="btn primary" onclick="saveTest()">💾 Testi Kaydet</button>`}
function saveTest(){let name=$('te_name').value,unit=TESTS.find(x=>x[0]===name)?.[1]||'';d.tests.push({id:uid('te'),playerId:$('te_player').value,name,value:$('te_value').value,unit,date:$('te_date').value,period:$('te_period').value});save();closeModal();renderAll();toast('Test sonucu kaydedildi.');addNotification('🧪 Yeni test sonucu',`${d.players.find(p=>p.id===$('te_player').value)?.name||''} • ${name}`)}
function tests(){let player=state.testPlayer||'';let list=d.tests.filter(t=>!player||t.playerId===player);$('tests').innerHTML=`<div class="section-title"><h2>🧪 Test Merkezi</h2><div class="spacer"></div><button class="btn primary" onclick="openModal('Yeni Test',testForm())">➕ Test Gir</button></div><div class="grid">${[['🏐','Teknik',TECH.join(' • ')],['📏','Antropometrik','Boy • Kilo • Kulaç'],['⚡','Hız','10 m • 20 m'],['🔄','Çeviklik','T Testi • Y Testi'],['💪','Kuvvet','Plank • Uzun atlama'],['❤️','Dayanıklılık','Yo-Yo / Mekik']].map(x=>`<div class="card"><h3>${x[0]} ${x[1]}</h3><div class="muted">${x[2]}</div></div>`).join('')}</div><div class="section-title"><h2>Sonuçlar</h2></div><div class="field"><label>Sporcu filtrele</label><select onchange="state.testPlayer=this.value;tests()"><option value="">Tümü</option>${d.players.map(p=>`<option value="${p.id}" ${p.id===player?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><br><div class="list">${list.sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="item row"><div style="flex:1"><b>${esc(t.name)}</b><div>${esc(t.value)} ${esc(t.unit||'')}</div><div class="muted">${esc(d.players.find(p=>p.id===t.playerId)?.name||'')} • ${t.date} • ${esc(t.period||'')}</div></div><button class="btn danger" onclick="deleteTest('${t.id}')">🗑️</button></div>`).join('')||'<div class="card muted">Test sonucu yok.</div>'}</div>`}
function deleteTest(id){d.tests=d.tests.filter(x=>x.id!==id);save();tests();toast('Test silindi.')}
function tactics(){let t=d.tactics[0]||{id:uid('ta'),name:'Yeni Taktik',players:[]};if(!d.tactics.length)d.tactics=[t],save();$('tactics').innerHTML=`<div class="section-title"><h2>🧠 Taktik Tahtası</h2><div class="spacer"></div><button class="btn primary" onclick="saveTactic()">💾 Tahtayı Kaydet</button></div><div class="formgrid"><div class="field"><label>Taktik adı</label><input id="ta_name" value="${esc(t.name)}"></div><div class="field"><label>Oyuncu</label><select id="ta_player">${d.players.map(p=>`<option value="${p.id}">#${esc(p.no||'-')} ${esc(p.name)}</option>`).join('')}</select></div><button class="btn" onclick="placePlayer()">➕ Sahaya koy</button></div><br><div class="court" id="court">${(t.players||[]).map((p,i)=>`<div class="playerdot" style="left:${p.x}%;top:${p.y}%" data-i="${i}">#${esc(p.no||'-')}</div>`).join('')}</div><p class="muted">Oyuncu ekle ve sahadaki daireleri sürükleyerek yerleştir.</p>`;dragDots()}
function placePlayer(){let p=d.players.find(x=>x.id===$('ta_player').value);if(!p)return;let t=d.tactics[0];t.players.push({id:p.id,no:p.no,x:20+t.players.length*12,y:30});save();tactics()}
function dragDots(){document.querySelectorAll('.playerdot').forEach(el=>{let down=false;el.addEventListener('pointerdown',()=>{down=true;el.setPointerCapture(event.pointerId)});el.addEventListener('pointermove',e=>{if(!down)return;let r=$('court').getBoundingClientRect();let p=d.tactics[0].players[Number(el.dataset.i)];p.x=Math.max(2,Math.min(90,(e.clientX-r.left)/r.width*100));p.y=Math.max(2,Math.min(86,(e.clientY-r.top)/r.height*100));el.style.left=p.x+'%';el.style.top=p.y+'%'});el.addEventListener('pointerup',()=>{down=false;save()})})}
function saveTactic(){if(d.tactics[0]){d.tactics[0].name=$('ta_name').value;save();toast('Taktik kaydedildi.')} }
function messages(){let list=[...d.messages].sort((a,b)=>b.date.localeCompare(a.date));$('messages').innerHTML=`<div class="section-title"><h2>💬 İletişim</h2><div class="spacer"></div><button class="btn primary" onclick="messageForm()">✉️ Mesaj / Duyuru</button></div><div class="grid"><div class="card"><h3>👨‍🏫 Hoca → Sporcu</h3><div class="muted">Bireysel mesaj</div></div><div class="card"><h3>👨‍🏫 Hoca → Veli</h3><div class="muted">Veli bilgilendirme</div></div><div class="card"><h3>📢 Grup Duyurusu</h3><div class="muted">Takım veya spor okulu</div></div></div><div class="section-title"><h2>Mesaj geçmişi</h2></div><div class="list">${list.map(m=>`<div class="item"><b>${esc(m.title)}</b><div>${esc(m.body)}</div><div class="muted">${m.date} • ${esc(m.target||'')}</div></div>`).join('')||'<div class="card muted">Henüz mesaj yok.</div>'}</div>`}

function saveMessage(){let m={id:uid('msg'),title:$('msg_title').value||'Duyuru',body:$('msg_body').value,target:$('msg_target').value,date:new Date().toISOString().slice(0,10)};d.messages.push(m);if($('msg_notify').checked)addNotification('📢 '+m.title,m.body);save();closeModal();renderAll();toast('Mesaj gönderildi.')}
function addNotification(title,body){d.notifications.unshift({id:uid('n'),title,body,date:new Date().toISOString(),read:false});save();$('notifCount').textContent=d.notifications.filter(n=>!n.read).length}
function notifications(){let list=d.notifications;$('notifications').innerHTML=`<div class="section-title"><h2>🔔 Bildirimler</h2><button class="btn" onclick="d.notifications.forEach(n=>n.read=true);save();notifications();$('notifCount').textContent=0">Tümünü okundu yap</button></div><div class="list">${list.map(n=>`<div class="item" onclick="nRead('${n.id}')"><b>${esc(n.title)}</b><div>${esc(n.body)}</div><div class="muted">${new Date(n.date).toLocaleString('tr-TR')}</div></div>`).join('')||'<div class="card muted">Bildirim yok.</div>'}</div>`}
function nRead(id){let n=d.notifications.find(x=>x.id===id);if(n)n.read=true;save();notifications();$('notifCount').textContent=d.notifications.filter(n=>!n.read).length}
function reportPlayer(id){let p=d.players.find(x=>x.id===id);let ts=d.tests.filter(x=>x.playerId===id);return `<div class="card"><h3>${esc(p.name)} — Performans Raporu</h3><p>Takımlar: ${playerTeams(p).map(t=>esc(t.name)).join(', ')||'Takımsız'}</p><p>Test kaydı: ${ts.length}</p><p>Bu bölüm V3.0 temel raporunu gösterir. PDF çıktısı ticari sürümde aynı veri yapısından üretilecek.</p><button class="btn primary" onclick="window.print()">🖨️ Yazdır / PDF</button></div>`}
function reports(){$('reports').innerHTML=`<div class="section-title"><h2>📊 Raporlar</h2></div><div class="grid"><div class="card"><h3>👤 Sporcu Raporu</h3><div class="muted">Test + yoklama + antrenman + maç</div><br><select onchange="if(this.value)openModal('Sporcu Raporu',reportPlayer(this.value))"><option value="">Sporcu seç</option>${d.players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="card"><h3>🏐 Takım Raporu</h3><div class="muted">Takım katılımı ve maç verileri</div></div><div class="card"><h3>🏫 Spor Okulu</h3><div class="muted">Grup bazlı yoklama ve test</div></div><div class="card"><h3>👨‍👩‍👧 Veli PDF</h3><div class="muted">Sade, anlaşılır performans özeti</div></div></div>`}
function club(){$('club').innerHTML=`<div class="section-title"><h2>⚙️ Ayarlar</h2></div><div class="card"><h3>🏢 Kulüp</h3><div class="formgrid"><div class="field"><label>Kulüp</label><input id="c_club" value="${esc(d.club)}"></div><div class="field"><label>Antrenör</label><input id="c_coach" value="${esc(d.coach)}"></div><div class="field"><label>Sezon</label><input id="c_season" value="${esc(d.season)}"></div></div><br><button class="btn primary" onclick="saveClub()">💾 Kaydet</button></div><div class="card" style="margin-top:12px"><h3>💾 Veri</h3><div class="actions"><button class="btn" onclick="backup()">⬇️ Yedek Al</button><label class="btn">⬆️ Yedek Yükle<input type="file" accept="application/json" hidden onchange="restore(this.files[0])"></label><button class="btn danger" onclick="resetApp()">🗑️ Tüm Veriyi Sıfırla</button></div></div>`}
function saveClub(){d.club=$('c_club').value.trim();d.coach=$('c_coach').value.trim();d.season=$('c_season').value.trim();save();boot();toast('Ayarlar kaydedildi.')}
function backup(){let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='volleyScout-yedek.json';a.click();URL.revokeObjectURL(a.href)}
function restore(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{d=JSON.parse(r.result);save();boot();toast('Yedek yüklendi.')}catch(e){toast('Yedek dosyası okunamadı.')}};r.readAsText(file)}
function resetApp(){if(!confirm('Tüm VolleyScout verileri silinsin mi?'))return;localStorage.removeItem(KEY);location.reload()}
function deleteTestDummy(){}

try{let raw=localStorage.getItem(KEY);if(raw)d={...d,...JSON.parse(raw)}}catch(e){}
boot();
</script>
</body>
</html>
