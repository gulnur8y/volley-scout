<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47b20"><title>VolleyScout TR</title><style>:root{--o:#f47b20;--bg:#f6f6f6;--ink:#222;--mut:#777;--line:#e7e7e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:5;padding:12px;display:flex;gap:10px;align-items:center}.top b{font-size:19px}.grow{flex:1}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700}.icon{background:#fff;border:1px solid var(--line);font-size:20px}.primary{background:var(--o);color:#fff}.danger{background:#fff0f0;color:#c33}main{max-width:1000px;margin:auto;padding:18px 14px 90px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 8px #00000008}.action{text-align:left;min-height:110px}.action strong{display:block;margin-top:10px;font-size:17px}.muted{color:var(--mut);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:24px}.stat small{color:var(--mut)}.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.row .grow{min-width:0}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.field textarea{min-height:90px}.drawer{position:fixed;inset:0;background:#0006;z-index:20;display:none}.drawer.open{display:block}.panel{background:#fff;width:min(370px,88vw);height:100%;padding:16px;overflow:auto}.menu{display:block;width:100%;text-align:left;background:#fff;margin:3px 0}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:30}.modal.open{display:flex}.sheet{width:min(720px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:18px}.score{display:flex;justify-content:center;gap:25px;font-size:42px;font-weight:900}.score small{font-size:12px;color:var(--mut);display:block;text-align:center}.event{padding:9px;border:1px solid var(--line);border-radius:10px;margin:5px 0;font-size:13px}@media(max-width:600px){.grid4{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.modal{align-items:flex-end}.sheet{border-radius:20px 20px 0 0}}</style></head><body>
<div class="top"><button class="icon" onclick="drawer()">☰</button><div><b>🏐 VolleyScout TR</b><div class="muted" id="ctx">Kulüp spor yönetimi</div></div><div class="grow"></div><button class="icon" onclick="page('settings')">⚙️</button></div>
<div id="dr" class="drawer" onclick="if(event.target===this)drawer()"><div class="panel"><button onclick="drawer()">✕ Kapat</button><h2>VolleyScout TR</h2><button class="menu" onclick="page('home');drawer()">🏠 Ana Sayfa</button><button class="menu" onclick="page('clubs');drawer()">🏢 Kulüpler & Branşlar</button><button class="menu" onclick="page('teams');drawer()">👥 Takımlar</button><button class="menu" onclick="page('players');drawer()">👤 Oyuncular</button><button class="menu" onclick="page('matches');drawer()">🏐🏀 Maçlar</button><button class="menu" onclick="page('tests');drawer()">🧪 Sporcu Testleri</button><button class="menu" onclick="page('training');drawer()">📝 Antrenman</button><button class="menu" onclick="page('analysis');drawer()">📊 Analiz</button><button class="menu" onclick="page('reports');drawer()">📄 Raporlar</button><button class="menu" onclick="page('settings');drawer()">⚙️ Ayarlar & Yedekleme</button></div></div>
<main id="app"></main><div id="mo" class="modal"><div id="sheet" class="sheet"></div></div>
<script>
const K='VS_TR_MASTER_1';let d=JSON.parse(localStorage.getItem(K)||'null')||{clubs:[],seasons:[],teams:[],players:[],matches:[],events:[],tests:[],training:[]};let s={page:'home',club:null,season:null,team:null,player:null,match:null};
const id=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6),save=()=>{localStorage.setItem(K,JSON.stringify(d));render()},$=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>]/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[a]));
function drawer(){$('dr').classList.toggle('open')}function page(p){s.page=p;render()}function club(){return d.clubs.find(x=>x.id===s.club)}function season(){return d.seasons.find(x=>x.id===s.season)}function team(){return d.teams.find(x=>x.id===s.team)}function players(){return d.players.filter(x=>x.teamId===s.team)}function modal(x){$('sheet').innerHTML=x;$('mo').classList.add('open')}function close(){ $('mo').classList.remove('open') }
function render(){let c=club(),t=team();$('ctx').textContent=c?`${c.name} • ${c.sport} • ${season()?.name||''}`:'Kulüp spor yönetimi';let f={home,clubs,teams,teamPage,playersPage,playerPage,matches,matchPage,tests,training,analysis,reports,settings}[s.page]||home;$('app').innerHTML=f()}
function home(){let c=club();if(!c)return `<div class="card"><h1>🏐🏀 VolleyScout TR</h1><p>Önce kulüp, branş ve sezonunu oluştur. Sistem voleybol ve basketbola göre otomatik uyarlanır.</p><button class="primary" onclick="clubForm()">🏢 Kulüp Oluştur</button></div>`;return `<h1>İyi çalışmalar, ${esc(c.coach||'Antrenör')} 👋</h1><p class="muted">${esc(c.name)} • ${esc(c.sport)} • ${esc(season()?.name||'')}</p><div class="grid"><button class="card action" onclick="page('players')">👤<strong>Oyuncu Profilleri</strong><span class="muted">Sporcular ve gelişim</span></button><button class="card action" onclick="newMatch()">🏐🏀<strong>Yeni Maç</strong><span class="muted">Manuel veya video + canlı</span></button><button class="card action" onclick="page('matches')">🗂️<strong>Eski Maçlar</strong><span class="muted">Maç geçmişi</span></button><button class="card action" onclick="page('analysis')">📊<strong>Sezon Özeti</strong><span class="muted">Performans ve gelişim</span></button></div><div class="section"><h2>Sezon Özeti</h2></div><div class="stats"><div class="stat"><b>${d.players.length}</b><small>Oyuncu</small></div><div class="stat"><b>${d.matches.length}</b><small>Maç</small></div><div class="stat"><b>${d.tests.length}</b><small>Test</small></div><div class="stat"><b>${d.training.length}</b><small>Antrenman</small></div></div>`}
function clubs(){return `<div class="section"><h2>🏢 Kulüpler & Branşlar</h2><button class="primary" onclick="clubForm()">+ Kulüp</button></div>${d.clubs.map(c=>`<div class="row"><div class="grow"><b>${esc(c.name)}</b><div class="muted">${esc(c.sport)} • ${esc(c.coach)}</div></div><button onclick="selectClub('${c.id}')">Aç</button></div>`).join('')||'<div class="card muted">Henüz kulüp yok.</div>'}`}
function teams(){return `<div class="section"><h2>👥 Takımlar</h2><button class="primary" onclick="teamForm()">+ Takım</button></div>${d.teams.filter(x=>!s.club||x.clubId===s.club).map(t=>`<div class="row"><div class="grow"><b>${esc(t.name)}</b><div class="muted">${esc(t.category)} • ${esc(t.lig)} • ${esc(t.sport)}</div></div><button onclick="openTeam('${t.id}')">Aç</button></div>`).join('')||'<div class="card muted">Henüz takım yok.</div>'}`}
function teamPage(){let t=team(),ps=players(),ms=d.matches.filter(x=>x.teamId===t.id);return `<button onclick="page('teams')">← Takımlar</button><div class="card"><h1>${esc(t.name)}</h1><p class="muted">${esc(t.sport)} • ${esc(t.category)} • ${esc(t.group)} • ${esc(t.lig)} • ${esc(season()?.name||'')}</p></div><div class="stats"><div class="stat"><b>${ps.length}</b><small>Oyuncu</small></div><div class="stat"><b>${ms.length}</b><small>Maç</small></div><div class="stat"><b>${d.training.filter(x=>x.teamId===t.id).length}</b><small>Antrenman</small></div><div class="stat"><b>${d.tests.filter(x=>ps.some(p=>p.id===x.playerId)).length}</b><small>Test</small></div></div><div class="grid"><button class="card action" onclick="page('players')">👤<strong>Oyuncular</strong></button><button class="card action" onclick="newMatch()">🏐🏀<strong>Yeni Maç</strong></button><button class="card action" onclick="testForm()">🧪<strong>Test Yap</strong></button><button class="card action" onclick="trainingForm()">📝<strong>Antrenman</strong></button></div>`}
function playersPage(){return `<div class="section"><h2>👤 Oyuncular</h2><button class="primary" onclick="playerForm()">+ Oyuncu</button></div>${players().map(p=>`<div class="row"><div class="grow"><b>#${esc(p.no)} ${esc(p.name)}</b><div class="muted">${esc(p.position)}</div></div><button onclick="openPlayer('${p.id}')">Profil</button></div>`).join('')||'<div class="card muted">Oyuncu yok.</div>'}`}
function playerPage(){let p=d.players.find(x=>x.id===s.player),ts=d.tests.filter(x=>x.playerId===p.id);return `<button onclick="page('players')">← Oyuncular</button><div class="card"><h1>#${esc(p.no)} ${esc(p.name)}</h1><p class="muted">${esc(p.position)} • ${esc(p.birth||'')} • ${esc(p.height||'-')} cm • ${esc(p.weight||'-')} kg</p><button onclick="testForm('${p.id}')">+ Test</button> <button class="primary" onclick="report('${p.id}')">📄 Veli Raporu</button></div><div class="section"><h2>🧪 Testler</h2></div>${ts.slice().reverse().map(x=>`<div class="row"><div class="grow"><b>${esc(x.type)}</b><div class="muted">${esc(x.date)} • ${esc(x.result)} ${esc(x.unit)}</div></div></div>`).join('')||'<div class="card muted">Test yok.</div>'}<div class="section"><h2>📝 Antrenör Notu</h2></div><div class="card">${esc(p.note||'Not eklenmedi.')}</div>`}
function matches(){return `<div class="section"><h2>🏐🏀 Maçlar</h2><button class="primary" onclick="newMatch()">+ Maç</button></div>${d.matches.slice().reverse().map(m=>`<div class="row"><div class="grow"><b>${esc(m.teamName)} — ${esc(m.opp)}</b><div class="muted">${esc(m.sport)} • ${esc(m.date)} • ${esc(m.format)} • ${esc(m.mode)}</div></div><button onclick="openMatch('${m.id}')">Aç</button></div>`).join('')||'<div class="card muted">Maç yok.</div>'}`}
function matchPage(){let m=d.matches.find(x=>x.id===s.match),ev=d.events.filter(x=>x.matchId===m.id);return `<button onclick="page('matches')">← Maçlar</button><div class="card"><p class="muted">${esc(m.sport)} • ${esc(m.mode)} • ${esc(m.format)}</p><h2>${esc(m.teamName)} — ${esc(m.opp)}</h2><div class="score"><div><small>${esc(m.teamName)}</small>${m.a}</div>:<div><small>${esc(m.opp)}</small>${m.b}</div></div><p style="text-align:center"><b>${m.type==='set'?'Set':'Periyot'} ${m.period} / ${m.total}</b></p><div class="grid"><button class="primary" onclick="eventForm('${m.id}',1)">🟧 Biz sayı</button><button onclick="eventForm('${m.id}',0)">Rakip sayı</button></div><div class="section"><h3>Ralli / Olay Geçmişi</h3></div>${ev.slice().reverse().map(e=>`<div class="event"><b>${e.label} • ${e.seq}. sayı</b> — ${e.player?'#'+esc(e.player)+' • ':''}${esc(e.reason)} • ${esc(e.time)}</div>`).join('')||'<div class="muted">Henüz olay yok.</div>'}<br><button onclick="next('${m.id}')">➡️ Sonraki ${m.type==='set'?'set':'periyot'}</button> <button class="danger" onclick="finish('${m.id}')">Maçı Tamamla</button></div>`}
function tests(){return `<div class="section"><h2>🧪 Sporcu Testleri</h2><button class="primary" onclick="testForm()">+ Test</button></div><div class="card"><b>Ortak:</b> Y Testi • T Testi • Dikey Sıçrama • Sprint • Reaksiyon • Boy • Kilo<br><b>Voleybol:</b> Servis • Manşet • Pas • Hücum • Blok<br><b>Basketbol:</b> Şut • Serbest Atış • 2/3 Sayı • Top Sürme • Pas • Savunma</div>`}
function training(){return `<div class="section"><h2>📝 Antrenman Takibi</h2><button class="primary" onclick="trainingForm()">+ Antrenman</button></div>${d.training.slice().reverse().map(x=>`<div class="row"><div class="grow"><b>${esc(x.title)}</b><div class="muted">${esc(x.date)} • ${esc(x.duration)} dk • ${esc(x.att)}</div></div></div>`).join('')||'<div class="card muted">Antrenman yok.</div>'}`}
function analysis(){return `<h2>📊 Analiz Merkezi</h2><div class="stats"><div class="stat"><b>${d.matches.length}</b><small>Maç</small></div><div class="stat"><b>${d.players.length}</b><small>Oyuncu</small></div><div class="stat"><b>${d.tests.length}</b><small>Test</small></div><div class="stat"><b>${d.training.length}</b><small>Antrenman</small></div></div><div class="section"><h3>🧠 Antrenör Özeti</h3></div><div class="card">Veri girdikçe maç + test + antrenman sonuçları burada birleşir; güçlü ve geliştirilecek alanlar gösterilir.</div>`}
function reports(){return `<h2>📄 Raporlar</h2><div class="grid"><button class="card action" onclick="page('players')">👤<strong>Veli / Oyuncu Raporu</strong><span class="muted">Oyuncu profilinden oluştur</span></button><button class="card action" onclick="alert('Takım raporu ekranı hazırlanıyor.')">👥<strong>Takım Raporu</strong><span class="muted">Sezon özeti</span></button></div>`}
function settings(){return `<h2>⚙️ Ayarlar & Yedekleme</h2><div class="grid"><button class="card action" onclick="seasonForm()">📅<strong>Yeni Sezon</strong></button><button class="card action" onclick="backup()">💾<strong>Yedekle</strong></button><button class="card action" onclick="$('file').click()">↩️<strong>Geri Yükle</strong></button><button class="card action" onclick="wipe()">⚠️<strong>Verileri Sıfırla</strong></button></div><input id="file" type="file" accept=".json" hidden onchange="restore(this.files[0])">`}
function clubForm(){modal(`<h2>🏢 Kulüp</h2><div class="field"><label>Kulüp adı</label><input id="cn"></div><div class="field"><label>Antrenör</label><input id="cc"></div><div class="field"><label>Branş</label><select id="cs"><option>Voleybol</option><option>Basketbol</option></select></div><button class="primary" onclick="createClub()">Kaydet</button>`)}function createClub(){let c={id:id('c'),name:$('cn').value||'Yeni Kulüp',coach:$('cc').value,sport:$('cs').value};d.clubs.push(c);s.club=c.id;close();save();seasonForm()}
function seasonForm(){modal(`<h2>📅 Sezon</h2><div class="field"><label>Sezon</label><input id="sn" value="2026–2027"></div><button class="primary" onclick="createSeason()">Kaydet</button>`)}function createSeason(){let x={id:id('s'),clubId:s.club,name:$('sn').value};d.seasons.push(x);s.season=x.id;close();save()}
function teamForm(){if(!s.club){alert('Önce kulüp oluştur.');return}modal(`<h2>👥 Takım</h2><div class="field"><label>Kategori</label><input id="tc" placeholder="Mini / Midi / Küçük / Yıldız / U14..."></div><div class="field"><label>Takım adı</label><input id="tn" placeholder="Yıldız A / Küçük 2"></div><div class="field"><label>Grup</label><select id="tg"><option>A</option><option>B</option><option>C</option><option>1</option><option>2</option><option>3</option><option>Özel</option></select></div><div class="field"><label>Lig</label><select id="tl"><option>İstanbul Gelişim Ligi</option><option>2. Lig</option><option>1. Lig</option><option>Süper Lig</option><option>Özel Lig</option><option>Diğer</option></select></div><button class="primary" onclick="createTeam()">Kaydet</button>`)}function createTeam(){let t={id:id('t'),clubId:s.club,seasonId:s.season,sport:club().sport,category:$('tc').value||'Genel',name:$('tn').value||'Takım',group:$('tg').value,lig:$('tl').value};d.teams.push(t);s.team=t.id;close();save();page('team')}
function selectClub(id){s.club=id;s.season=d.seasons.find(x=>x.clubId===id)?.id||null;s.team=d.teams.find(x=>x.clubId===id)?.id||null;save();page('home')}function openTeam(id){let t=d.teams.find(x=>x.id===id);s.team=id;s.club=t.clubId;s.season=t.seasonId;page('team')}
function playerForm(){modal(`<h2>👤 Oyuncu</h2><div class="field"><label>Ad Soyad</label><input id="pn"></div><div class="field"><label>Forma no</label><input id="pno" type="number"></div><div class="field"><label>Mevki</label><input id="pp"></div><div class="field"><label>Doğum</label><input id="pb"></div><div class="field"><label>Boy cm</label><input id="ph" type="number"></div><div class="field"><label>Kilo kg</label><input id="pw" type="number"></div><button class="primary" onclick="createPlayer()">Kaydet</button>`)}function createPlayer(){d.players.push({id:id('p'),teamId:s.team,name:$('pn').value||'Oyuncu',no:$('pno').value,position:$('pp').value,birth:$('pb').value,height:$('ph').value,weight:$('pw').value,note:''});close();save()}
function openPlayer(id){s.player=id;page('player')}
function newMatch(){if(!s.team){alert('Önce takım seç.');return}let t=team();let ligDefault=t.sport==='Voleybol'?(t.lig==='İstanbul Gelişim Ligi'||t.lig==='2. Lig'?'3 Set':t.lig==='Özel Lig'?'2 Set':'5 Set'):'4 Periyot';modal(`<h2>🏐🏀 Yeni Maç</h2><div class="field"><label>Rakip</label><input id="mo1"></div><div class="field"><label>Tarih</label><input id="md" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Mod</label><select id="mm"><option>Manuel Hızlı</option><option>Video + Canlı</option></select></div><div class="field"><label>Format (lig varsayılanı: ${ligDefault})</label><select id="mf">${t.sport==='Voleybol'?'<option>2 Set</option><option>3 Set</option><option>5 Set</option>':'<option>4 Periyot</option><option>Özel Format</option>'}</select></div><button class="primary" onclick="createMatch()">Başlat</button>`)}
function createMatch(){let t=team(),f=$('mf').value, total=t.sport==='Voleybol'?(f==='2 Set'?2:f==='3 Set'?3:5):4;let m={id:id('m'),teamId:t.id,teamName:t.name,sport:t.sport,opp:$('mo1').value||'Rakip',date:$('md').value,mode:$('mm').value,format:f,total,period:1,type:t.sport==='Voleybol'?'set':'period',label:t.sport==='Voleybol'?'Set':'Periyot',a:0,b:0,status:'Devam'};d.matches.push(m);s.match=m.id;close();save();page('match')}
function openMatch(id){s.match=id;page('match')}
function eventForm(mid,ours){let m=d.matches.find(x=>x.id===mid),ps=d.players.filter(p=>p.teamId===m.teamId);let ops=m.sport==='Voleybol'?(ours?['Ace','Hücum Sayısı','Blok Sayısı','Rakip Hatası']:['Servis Hatası','Manşet Hatası','Pas Hatası','Hücum Hatası','Blok Hatası','Savunma Hatası','Diğer']):(ours?['2 Sayı','3 Sayı','Serbest Atış']:['Rakip Sayı','Top Kaybı','Faul','Diğer']);modal(`<h2>${ours?'🟧 Biz sayı':'Rakip sayı'}</h2><div class="field"><label>Oyuncu (isteğe bağlı)</label><select id="ep"><option value="">Seçme</option>${ps.map(p=>`<option value="${esc(p.no)}">#${esc(p.no)} ${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Neden / aksiyon</label><select id="er">${ops.map(x=>`<option>${x}</option>`).join('')}</select></div><button class="primary" onclick="record('${mid}',${ours})">Kaydet</button>`)}
function record(mid,ours){let m=d.matches.find(x=>x.id===mid),r=$('er').value,pts=m.sport==='Basketbol'?(r==='3 Sayı'?3:r==='2 Sayı'?2:1):1;if(ours)m.a+=pts;else m.b+=pts;let seq=d.events.filter(e=>e.matchId===mid&&e.period===m.period).length+1;d.events.push({id:id('e'),matchId:mid,period:m.period,label:m.label,seq,player:$('ep').value,reason:r,time:new Date().toLocaleTimeString('tr-TR')});close();save()}
function next(mid){let m=d.matches.find(x=>x.id===mid);if(m.period<m.total){m.period++;m.a=0;m.b=0;save()}else alert('Son bölüm. Maçı tamamlayabilirsin.')}
function finish(mid){d.matches.find(x=>x.id===mid).status='Tamamlandı';save();page('matches')}
function testForm(pid=''){let ps=players(),types=['Y Testi','T Testi','Dikey Sıçrama','Sprint','Reaksiyon','Boy','Kilo',...(club()?.sport==='Voleybol'?['Servis','Manşet','Pas','Hücum','Blok']:['Şut','Serbest Atış','2 Sayı Şut','3 Sayı Şut','Top Sürme','Pas','Savunma'])];modal(`<h2>🧪 Test</h2><div class="field"><label>Oyuncu</label><select id="xp">${ps.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>#${esc(p.no)} ${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Test</label><select id="xt">${types.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Sonuç</label><input id="xr"></div><div class="field"><label>Birim</label><input id="xu" placeholder="cm / sn / %"></div><div class="field"><label>Tarih</label><input id="xd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><button class="primary" onclick="createTest()">Kaydet</button>`)}function createTest(){d.tests.push({id:id('x'),playerId:$('xp').value,type:$('xt').value,result:$('xr').value,unit:$('xu').value,date:$('xd').value});close();save()}
function trainingForm(){if(!s.team)return;modal(`<h2>📝 Antrenman</h2><div class="field"><label>Başlık</label><input id="tt" placeholder="Servis-Karşılama"></div><div class="field"><label>Tarih</label><input id="td" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Süre (dk)</label><input id="tdur" type="number" value="90"></div><div class="field"><label>Katılım</label><input id="ta" value="${players().length}/${players().length}"></div><div class="field"><label>Not</label><textarea id="tnote"></textarea></div><button class="primary" onclick="createTraining()">Kaydet</button>`)}function createTraining(){d.training.push({id:id('tr'),teamId:s.team,title:$('tt').value||'Antrenman',date:$('td').value,duration:$('tdur').value,att:$('ta').value,note:$('tnote').value});close();save()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='VolleyScout_TR_yedek.json';a.click()}function restore(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{d=JSON.parse(r.result);s.club=d.clubs[0]?.id;s.season=d.seasons[0]?.id;s.team=d.teams[0]?.id;save()}catch(e){alert('Geçersiz yedek')}};r.readAsText(f)}function wipe(){if(confirm('Tüm veriler silinsin mi?')){localStorage.removeItem(K);location.reload()}}
function report(pid){let p=d.players.find(x=>x.id===pid),t=d.teams.find(x=>x.id===p.teamId),c=d.clubs.find(x=>x.id===t.clubId),ts=d.tests.filter(x=>x.playerId===pid);let w=window.open('','_blank');w.document.write(`<html><head><title>Veli Raporu</title><style>body{font-family:Arial;padding:30px}h1{color:#f47b20}</style></head><body><h1>VolleyScout TR</h1><h2>Oyuncu Gelişim Raporu</h2><p><b>${esc(p.name)}</b> • #${esc(p.no)} • ${esc(p.position)}</p><p>${esc(c.name)} • ${esc(t.name)} • ${esc(t.lig)} • ${esc(season()?.name||'')}</p><hr><h3>Testler</h3>${ts.map(x=>`<p>${esc(x.date)} — ${esc(x.type)}: <b>${esc(x.result)} ${esc(x.unit)}</b></p>`).join('')||'<p>Test kaydı yok.</p>'}<h3>Antrenör Değerlendirmesi</h3><p>${esc(p.note||'Henüz değerlendirme eklenmedi.')}</p><p>Oyuncumuzun gelişimini desteklemek için antrenman sürecimize devam ediyoruz.</p><button onclick="print()">PDF / Yazdır</button></body></html>`);w.document.close()}
render();
